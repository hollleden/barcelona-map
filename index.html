да, и закрепил нынешнюю городскую планировку Побле-Сека — от моря до площади Испании.", "<strong>Застройка Параллеля</strong>", "Параллель, ныне являющийся границей района со старым городом и нижней частью Эшампле, был застроен вскоре после Всемирной выставки 1888 года. Своё название он получил от таверны, открытой в 1894 году, чьи владельцы, чтобы дать ей имя, последовали совету друга — астронома Комаса-и-Соля, исходившего из того, что трасса улицы имеет точно ту же ориентацию, что и земные параллели, и совпадает с той, что проходит через Барселону, расположенную на 41°20' северной широты. Практически сразу этот широкий проспект превратился в весёлый квартал, полный театров и кафе.", "В 1892 году открылся Испанский театр, в том же, впоследствии перестроенном здании, которое сегодня занимает зал Барц. В 1898 году на проспекте открылось кафе «Севилья», ныне уже не существующее, а в 1903 году — театр «Кондаль». В 1901 году к ним добавился «Ноу», в 1903-м — «Аполо», в 1907-м — «Комико», в 1916-м — «Викториа» и «Эль-Молино». Ракель Мельер, дебютировавшая в 1911 году в театре «Арнау», на протяжении многих лет была бесспорной звездой концертных залов Параллеля. Эта традиция, зародившаяся на стыке веков, с трудом, но сохранилась до наших дней.", "<strong>Зона-Франка, таможенная территория</strong>", "Название района Ла-Марина, ранее известного как Зона-Франка, происходит от того, что в начале XX века организация Фоменто-дель-Трабахо-Насьональ попросила правительство создать в дельте реки Льобрегат крупную промышленную зону, где при значительных налоговых льготах могло бы перерабатываться каталонское сырьё, предназначенное для экспорта. Именно это и есть свободная (франко-) зона: территория, обладающая портовыми сооружениями и с таможенной точки зрения считающаяся иностранной, хотя формально она подчинена государству, на территории которого расположена. Там разрешено только промышленное и коммерческое строительство, но не жилое.", "Барселоне эта привилегия так и не была предоставлена. Во времена диктатуры Примо де Риверы земли даже экспроприировали, отделив их от Л'Оспиталета и присоединив к Барселоне, но ничего сделано не было из-за судебных тяжб с экспроприированными владельцами и последующего исторического развития страны. В 1965 году, когда завод SEAT уже десять лет как обосновался в этих краях, закон постановил, что экспроприированные земли будут использоваться не как свободная зона, а как промышленный узел для средних и крупных предприятий, а также для расширения порта. Три года спустя был утверждён частный план на 714 гектаров, на основе которого возникли те безымянные, неприветливые улицы.", "<strong>Монжуик — пространство досуга</strong>", "Издавна существовала традиция ходить на Монжуик проводить свободное время. Часовни всегда были местом паломничества, и такие вылазки обычно заканчивались пикником. К часовням добавились закусочные, всегда рядом с источниками. Туда ходили по воскресеньям, и там устраивали танцы под открытым небом. В ночь на Сан-Хуан гора особенно становилась излюбленным местом народных гуляний, поскольку на Монжуике росло растение с тем же названием (вербена), и влюблённые пользовались случаем, чтобы собрать букет цветов и подарить его своим избранницам. Родник Фон-дель-Гат дал начало одной из самых популярных каталонских песен.", "Суета каменоломен уживалась со спокойными местами, лугами и сосновыми рощами, где в начале века леррусисты устраивали свои встречи. Этот райский уголок перестал им быть, когда некоторые барселонские финансисты, тесно связанные с зарождавшимися компаниями по производству и распределению электроэнергии, обратили на это место внимание, решив превратить его в лучшую рекламную витрину своих интересов.", "<strong>Значение света</strong>", "Франсеск Камбо был адвокатом компании Sofina, финансового общества, связанного с AEG, которое сыграло решающую роль во всём процессе электрификации Каталонии. Жуан Пич-и-Пон был лидером Радикальной партии в Барселоне. Когда радикалы возглавляли муниципалитет, компании AEG была предоставлена муниципальная концессия на уличное освещение города — после поездки, которую Леррус специально совершил в Барселону для встречи с представителями этой компании.", "Камбо и Пич-и-Пон имели возможность влиять на муниципальные решения второго десятилетия века. Они были наиболее заметными советниками своих соответствующих партий и в 1913 году были избраны для организации выставки электротехнической промышленности, призванной стимулировать потребление этого зарождавшегося вида энергии. Муниципалитет полностью взял на себя этот проект и выбрал гору Монжуик местом проведения выставки, которая должна была состояться в 1917 году. Королевский указ разрешил муниципалитету экспроприировать земли, признанные представляющими общественную пользу. Проекты застройки были заказаны некоторым из самых важных архитекторов того времени — Пучу-и-Кадафалку, Доменеку-и-Монтанеру, Энрику Сань​еру и Аугусту Фонту среди прочих — и работы начались с большим размахом.", "Европейская война вынудила отложить выставку, поскольку в ней вряд ли смогли бы участвовать иностранные компании, но работы не остановились — считалось, что они могли бы пригодиться для других выставок. В тот самый день, когда Примо де Ривера совершил государственный переворот, в 1923 году открылась выставка мебели, а шесть лет спустя, когда работы по благоустройству были завершены, состоялась Международная выставка. Свет, как и было изначально задумано, играл в ней важнейшую роль: лучи Национального дворца, волшебный фонтан Буйгаса, башня на площади Универса и уличные фонари в стиле ар-деко на проспекте Марии-Кристины. Гора приобрела тот облик, который сохраняет и поныне, от площади Испании до Мирамара.", "<strong>Монжуик после выставки: 3 ключевых момента</strong>", "После выставки 1929 года на Монжуике произошло немало событий. Во-первых, многие из привлечённых ею иммигрантов поселились в лачугах за стадионом, и, чтобы их не было видно во время выставки, была возведена стена. Этот посёлок продолжал расти в послевоенные годы, превратившись в настоящий город, доходивший до ограды кладбища. К середине 1960-х годов, когда он достиг максимальной плотности, этот город из лачуг насчитывал около 35 000 жителей и занимал площадь в 30 гектаров, сохранявшуюся до начала 1970-х годов.", "Во-вторых, во время и после окончания Гражданской войны в Испании гора вступила в период нарастающей деградации, из которого начала выходить лишь когда было решено провести в Барселоне Международный евхаристический конгресс 1952 года — событие огромной политической значимости (это был первый видимый признак конца дипломатической изоляции франкистского режима), оказавшее на градостроительство города влияние, сопоставимое с двумя всемирными выставками и Олимпийскими играми.", "В-третьих, после того как выставочные сооружения были восстановлены, а работа Ярмарки образцов возобновлена, Монжуик стал местом, куда помещали всё, что не находило места в других частях города, без какого-либо цельного и последовательного замысла: от площадок для экзаменов по вождению до школ для глухонемых, от парков развлечений до музеев, от спортивных площадок до свалок мусора... Здесь находилось место всему.", "<strong>Строительство государственного жилья</strong>", "Одним из применений, которое франкистский муниципалитет нашёл для горы Монжуик, стало размещение здесь нескольких комплексов жилья государственной застройки — из тех, что возводились в городе в 1960-е годы, чтобы расселить продолжавших прибывать в город иммигрантов, в жилье для которых частная инициатива не была заинтересована.", "Первый из таких комплексов сформировался ещё во времена выставки, рядом с проспектом Зона-Франка, который тогда представлял собой обсаженную деревьями дорогу, ведущую к ипподрому Кан-Тунис. Здесь была возведена одна из четырёх групп «дешёвых домов», построенных диктатурой Примо де Риверы в Барселоне. Комплекс получил имя Эдуардо Аунос, министра труда, торговли и промышленности на момент его создания.", "Следующие комплексы были построены в Польвори и Кан-Клосе в дни Евхаристического конгресса. За один месяц в Кан-Клосе было возведено 192 жилища площадью 30 квадратных метров. Туда переселили обитателей лачуг, находившихся в зоне Диагонали на границе муниципальной территории, поскольку это место было тогда благоустроено для размещения главного алтаря торжественных богослужений конгресса. В Польвори, где Муниципальный патронат жилья возвёл 44 корпуса, также разместили обитателей лачуг из других зон, хотя девять квартир были зарезервированы для полицейских.", "<strong>Застройка новых пространств</strong>", "В 1966 году Патронат построил на горе ещё один жилой массив — Ла-Винья, с 288 квартирами рядом с линией Каталонских железных дорог. Эта железнодорожная линия была веткой, построенной в 1926 году от станции Магория до порта через Монжуик, для перевозки поташа с рудников Баж к грузовым судам. Она была закрыта после серьёзных протестов в 1977 году, и сегодня от путей уже не осталось никаких следов.", "Кроме того, со стороны Маре-де-Деу-де-Порт есть и другие рабочие жилые комплексы, созданные предприятиями: колония Баусили, рядом с «дешёвыми домами»; колония Сантивери; дома компании SEAT, строительство которых началось в 1953 году; и другие группы застройки, постепенно растворившиеся среди современных зданий проспекта Зона-Франка, полностью преобразившегося.", "Со стороны Гран-Виа постепенно, живя собственной жизнью, развивался квартал Фон-де-ла-Гуатлья-Магория, с улицей Фон-Флорида в качестве центральной оси, и муниципальная школа Пау-Вила, созданная во времена мэра Сосиаса как связующее звено с кварталами со стороны Порта.", "Избрание Барселоны местом проведения Олимпийских игр 1992 года привнесло новый элемент, открывший новую, важную главу в истории этой части города Барселоны. Кроме того, в последние годы здесь велись важные работы по связыванию территорий, реурбанизации, реабилитации жилья, созданию новых объектов инфраструктуры, зелёных зон и так далее."], "vibe": "От средневекового еврейского кладбища до олимпийского салюта — гора, которая видела всё."}, "historia_url": "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/sants-montjuic/es/el-distrito-y-sus-barrios"}, "d4": {"num": 4, "color": "#93A8B0", "web1": "http://www.bcn.cat/lescorts", "src": "https://ca.wikipedia.org/wiki/Barri_de_les_Corts", "ipa_ca": "luhs KORTS", "ipa_es": "less KORTS", "landmarks": [["El Palacio Real de Pedralbes", "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/puntos-de-interes/el-palacio-real-de-pedralbes-95090122928", {"es": "antigua residencia real", "ca": "antiga residència reial", "ru": "бывшая королевская резиденция"}], ["El Real Monasterio de Santa Maria de Pedralbes", "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/puntos-de-interes/el-real-monasterio-de-santa-maria-de-pedralbes-92086005213", {"es": "monasterio gótico del siglo XIV", "ca": "monestir gòtic del segle XIV", "ru": "готический монастырь XIV века"}], ["La Masia del Barça (Can Planes)", "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/puntos-de-interes/la-masia-del-barca-can-planes-99400477722", {"es": "masía, cuna de jugadores del Barça", "ca": "masia, bressol de jugadors del Barça", "ru": "усадьба, кузница игроков «Барселоны»"}], ["Los Pabellones de la Finca Güell", "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/puntos-de-interes/los-pabellones-de-la-finca-gell-2063142018", {"es": "pabellones de Gaudí para Eusebi Güell", "ca": "pavellons de Gaudí per a Eusebi Güell", "ru": "павильоны Гауди для Эусеби Гуэля"}], ["La Torre Rodona (Can Vinyals de la Torre)", "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/puntos-de-interes/la-torre-rodona-can-vinyals-de-la-torre-99400328582", {"es": "masía con restos de torre medieval", "ca": "masia amb restes de torre medieval", "ru": "усадьба с остатками средневековой башни"}]], "founding": {"es": "Les Corts es uno de los diez distritos de Barcelona y está formado por los barrios de Les Corts, Pedralbes y la Maternitat i Sant Ramon. Con una superficie de 600 hectáreas y más de 82.000 habitantes, su situación geográfica lo ha convertido, desde sus orígenes, en puerta de entrada al llano de Barcelona y escenario de muchos hechos históricos.", "ca": "Les Corts és un dels deu districtes de Barcelona i el formen els barris de Les Corts, Pedralbes i la Maternitat i Sant Ramon. Amb una superfície de 600 hectàrees i més de 82.000 habitants, la seva situació geogràfica l'ha convertit, des dels orígens, en porta d'entrada al pla de Barcelona i escenari de molts fets històrics.", "ru": "Лес-Корст — один из десяти районов Барселоны, включающий кварталы Лес-Корст, Педральбес и ла-Матернитат-и-Сан-Рамон. Площадь района — 600 га, население — более 82 000 человек; благодаря своему географическому положению район с самого начала служил воротами на равнину Барселоны и был сценой многих исторических событий."}, "es": {"name": "Les Corts", "sub": "", "desc": ["<strong>Sobre la historia de Les Corts</strong>", "El distrito de Les Corts tiene su origen en el antiguo pueblo del mismo nombre, situado en la parte occidental del llano de Barcelona, una zona rural con tierra fértil que ocupaba aproximadamente el territorio entre el torrente de Magòria y la Riera Blanca.", "Hay indicios de ocupación humana en esta área que se remontan a las épocas ibérica y romana. La tradición agraria de la zona se hace patente en la existencia de algunas villas romanas en el territorio donde hoy día se extiende el distrito de Les Corts. Durante la Edad Media, algunas masías se fortificaron, como la masía Torre Rodona, que actualmente todavía se conserva y que toma el nombre de la torre de defensa que se añadió en la época de las razias árabes de finales del siglo X.", "Los habitantes de Les Corts —desde la época carolingia hasta el siglo IX— disfrutaban de los privilegios de las franquezas, que habían sido reconocidos por una sentencia de Jaime I, en 1274. Eran considerados ciudadanos de Barcelona y estaban exentos de impuestos que no fueran los de albergue real. El alcalde real de las franquezas nombraba a un alcalde local en Les Corts, lo que propiciaba que la estructura social se mantuviera sobre la base de campesinos propietarios de la tierra, manteniendo una independencia territorial.", "La delimitación del distrito actual se corresponde bastante con la de los terrenos francos que se instauraron en tiempos medievales, entonces regidos directamente por el conde rey para favorecer su desarrollo. Precisamente esta situación administrativa en que no intervenía ningún poder local es la que favoreció que se eligiera este espacio para la ubicación del Real Monasterio de Santa Maria de Pedralbes.", "El Decreto de Nueva Planta de 1716 significó la pérdida, entre otras cosas, del privilegio de las franquezas del que había disfrutado Les Corts. Como consecuencia de ello, y durante los años posteriores a la guerra de Sucesión (1701-1713/1715), algunos propietarios se vieron obligados al establecimiento enfitéutico de las tierras de su propiedad e iniciaron, así, un proceso segregacionista que ya no se detendría. La Constitución de 1812 y la creación de la parroquia de la Mare de Déu del Remei permitieron establecer una nueva unidad municipal plena en 1836, que se anexionó a Barcelona en 1897.", "<strong>Los orígenes del Ayuntamiento de Les Corts</strong>", "Tal como apunta el historiador Josep Moran i Ocerinjauregui en sus trabajos, la creación de los ayuntamientos constitucionales en el llano de Barcelona a principios del siglo XIX se hizo a partir de las antiguas alcaldías, cuyo ámbito coincidía con el de las parroquias, excepto en el caso de Les Corts.", "Su singularidad radica en que disponía de alcaldía propia en su término, pero pertenecía a la parroquia de Sant Vicenç de Sarrià. En la delimitación de los nuevos términos municipales, Les Corts tuvo que ceder a Sarrià la parte de montaña. Este proceso constitutivo municipal, iniciado en febrero de 1814, no concluyó hasta octubre de 1836.", "Fue entonces, cuando Les Corts consiguió la autonomía definitiva, que duró hasta el momento de la anexión a la ciudad de Barcelona, en 1897. En aquel momento, en virtud de un decreto real de agregación y en contra de la voluntad de sus habitantes, Les Corts se anexionó a Barcelona junto con otros pueblos del llano barcelonés como Gràcia, Sant Martí de Provençals, Sant Andreu de Palomar y Santa Maria de Sants.", "Posteriormente, el pueblo creció en la carretera de Sarrià y formó un ensanche. También a finales del siglo XIX y principios del XX, en Les Corts se construyeron diversas instalaciones que daban servicio a la ciudad de Barcelona, como la casa de la Maternitat i Expòsit, uno de los conjuntos más emblemáticos del distrito, el instituto Frenopático, el Hospital infantil Sant Joan de Déu y varios asilos.", "Les Corts preservó su carácter rural hasta relativamente tarde, pero, como en otros lugares del llano de Barcelona, el proceso de industrialización y urbanización acabó transformando el aspecto y el carácter del barrio durante el siglo XX. La instalación de diversas tejerías y fábricas de productos químicos en Les Corts se acompañó con la construcción de colonias de obreros, entre las cuales la Colònia Castells es uno de los ejemplos más claros.", "Esta primera oleada de urbanización se concentró en torno a las llamadas Corts Velles, mientras que la zona en torno a la avenida Diagonal, gran arteria urbana que se abrió en 1924, se mantuvo sin urbanizar hasta mediados del siglo XX, en el que se empezaron a construir numerosos edificios de oficinas y comerciales.", "Les Corts también creció en dirección a L’Hospitalet de Llobregat, en un primer momento a raíz del desarrollo de las colonias obreras, como las casas de la calle del Comte de Güell. En la segunda mitad del siglo XX, la celebración del Congreso Eucarístico (1952) dio un último impulso a la urbanización de la zona de la plaza de Pius XII.", "Entre 1950 y 1975 también se construyeron las instalaciones del FC Barcelona y el campus de las universidades a ambos lados de la Diagonal, que ocupan una porción significativa del territorio actual del distrito.", "Si hablamos de la historia reciente de Les Corts, no podemos dejar de hablar de un barrio, Pedralbes, que pasó a formar parte de la zona en los años ochenta del siglo XX a consecuencia de la ordenación en distritos de la ciudad de Barcelona.", "El barrio de Pedralbes, que en la actualidad ocupa la zona del distrito de Les Corts comprendida entre la avenida Diagonal y Collserola, toma su nombre de las piedras de color claro que se encontraban en el lugar. Pedralbes permaneció durante siglos y hasta bien entrado el siglo XX como una zona poco urbanizada. Algunas familias adineradas de Barcelona tenían sus fincas en la zona, como fue el caso de Eusebi Güell, conocido por haber sido el mecenas de Antoni Gaudí, o Manuel Girona, importante banquero barcelonés del siglo XIX.", "El Pedralbes histórico estaba centrado en torno al monasterio, fundado en 1327 por la reina Elisenda de Montcada y del que dependían las masías de los alrededores. Su buen estado de conservación explica por qué este punto es todavía hoy uno de los más emblemáticos de todo el distrito de Les Corts.", "<strong>Ruta de la memoria histórica: un enclave de memoria histórica</strong>", "Inspirada en el proyecto desarrollado por el Máster en Diseño Urbano y el Centro de Investigación Polis: Arte, Ciudad, Sociedad de la Universidad de Barcelona, esta ruta se ha trazado con la colaboración de la Asociación por la Cultura y la Memoria de Cataluña (ACME) y el Ayuntamiento.", "La Ruta de la Memoria Histórica de Les Corts en Barcelona propone un recorrido urbano por trece localizaciones del distrito: edificios, monumentos y entornos urbanos fuertemente identificados con acontecimientos históricos del periodo de la Segunda República Española, de la Guerra Civil y de la dictadura franquista.", "También se proponen tres proyectos de ideas para espacios “sin memoria”, donde se han llevado a cabo derribos de monumentos franquistas. Este es el caso de los lugares donde se alzaban el antiguo monumento dedicado a José Antonio Primo de Rivera y el monumento a los caídos. El tercer proyecto identifica la prisión de mujeres de Les Corts, ya desaparecida. Se trata de un lugar con una fuerte historia social y humana de represión franquista, hoy invisible en el paisaje urbano de la ciudad.", "Aquí se exponen las localizaciones de la ruta:", "Antiguo monumento a José Antonio Primo de Rivera", "Yugo y flechas en placas de viviendas", "Antiguo monumento a los héroes de Espinosa de los Monteros", "Antiguo campo de Les Corts", "Residencia de oficiales del Ejército español", "Antiguo monolito dedicado a la Legión Cóndor", "Antigua prisión de mujeres de Les Corts", "Congreso Eucarístico de 1952. Monumento a Pío XII", "Facultad de Derecho, urbanización de Maria Cristina y Zona Universitaria", "Palacio de Pedralbes", "Monumento caído, antiguo monumento a los caídos", "Camp Nou", "Cuartel del Bruc"], "vibe": "Un pueblo agrícola que hoy vive al ritmo de los goles del Camp Nou."}, "ca": {"name": "Les Corts", "sub": "", "desc": ["<strong>Sobre la història de Les Corts</strong>", "El districte de les Corts té l’origen en l’antic poble del mateix nom, situat a la part occidental del pla de Barcelona, una zona rural amb terra fèrtil que ocupava aproximadament el territori entre la riera de Magòria i la riera Blanca.", "Hi ha indicis d’ocupació humana en aquesta àrea que es remunten a les èpoques ibèrica i romana. La tradició agrària de la zona es fa patent en l’existència d’algunes vil·les romanes al territori on avui dia s’estén el districte de les Corts. Durant l’edat mitjana, alguns masos es van fortificar, com la masia Torre Rodona, que actualment encara es conserva i que pren el nom de la torre de defensa que s’hi va afegir a l’època dels raids àrabs del final del segle X.", "Els habitants de les Corts —des de l’època carolíngia, fins al segle IX— gaudien dels privilegis de les franqueses que havien estat reconeguts per una sentència de Jaume I, l’any 1274. Eren considerats ciutadans de Barcelona i estaven exempts d’impostos que no fossin els d’alberg reial. El batlle reial de les franqueses nomenava un batlle local a les Corts, la qual cosa propiciava que l’estructura social es mantingués sobre la base de pagesos propietaris de la terra, mantenint una independència territorial.", "La delimitació del districte actual es correspon força amb la dels terrenys francs que es van instaurar en temps medievals, aleshores regits directament pel comte rei per afavorir-ne el desenvolupament. Justament aquesta situació administrativa en què no intervenia cap poder local és la que va afavorir que es triés aquest espai per ubicar-hi el Reial Monestir de Santa Maria de Pedralbes.", "El Decret de Nova Planta de 1716 va significar la pèrdua, entre altres coses, del privilegi de les franqueses de què havia gaudit les Corts. Com a conseqüència d’això, i durant els anys posteriors a la guerra de Successió (1701-1713 / 1715), alguns propietaris es van veure obligats a l’establiment emfitèutic de les terres de la seva propietat i van iniciar, així, un procés segregacionista que ja no s’aturaria. La Constitució de 1812 i la creació de la parròquia de la Mare de Déu del Remei van permetre la creació d’una nova unitat municipal plena el 1836, que es va annexionar a Barcelona el 1897.", "<strong>Els orígens de l'Ajuntament de Les Corts</strong>", "Tal com apunta l’historiador Josep Moran i Ocerinjauregui en els seus treballs, la creació dels ajuntaments constitucionals al pla de Barcelona al començament del segle XIX es va fer a partir de les antigues batllies, l’àmbit de les quals coincidia amb el de les parròquies, excepte en el cas de les Corts.", "La seva singularitat rau en el fet que disposava de batllia pròpia al seu terme, però pertanyia a la parròquia de Sant Vicenç de Sarrià. En la delimitació dels termes municipals nous, les Corts va haver de cedir a Sarrià la part de muntanya. Aquest procés constitutiu municipal, iniciat el febrer del 1814, no va concloure fins a l’octubre del 1836.", "Va ser llavors, que les Corts va aconseguir l’autonomia definitiva, que va durar fins al moment de l’annexió a la ciutat de Barcelona, l’any 1897. En aquell moment, en virtut d’un decret reial d’agregació i en contra de la voluntat dels seus habitants, les Corts va ser annexionat per Barcelona juntament amb altres pobles del pla barceloní com Gràcia, Sant Martí de Provençals, Sant Andreu de Palomar i Santa Maria de Sants.", "Posteriorment, el poble va créixer a la carretera de Sarrià i va formar un eixample. També al final del segle XIX i principi del segle XX, a les Corts s’hi van construir diverses instal·lacions que donaven servei a la ciutat de Barcelona, com la casa de la Maternitat i Expòsit, un dels conjunts més emblemàtics del districte, l'institut Frenopàtic, l’Hospital infantil Sant Joan de Déu i diversos asils.", "Les Corts va preservar el seu caràcter rural fins relativament tard, però, com en altres indrets del pla de Barcelona, el procés d’industrialització i urbanització va acabar transformant l’aspecte i el caràcter del barri durant el segle XX. La instal·lació de diverses bòbiles i fàbriques de productes químics a les Corts es va acompanyar amb la construcció de colònies d’obrers, entre les quals la Colònia Castells és un dels exemples més clars.", "Aquesta primera onada d’urbanització es va concentrar entorn de les anomenades Corts Velles, mentre que la zona al voltant de l’avinguda Diagonal, gran artèria urbana que es va obrir el 1924, es va mantenir sense urbanitzar fins a mitjan segle XX, en què s’hi van començar a construir nombrosos edificis d’oficines i comercials.", "Les Corts també va créixer en direcció a l’Hospitalet de Llobregat, en un primer moment arran del desenvolupament de les colònies obreres, com les cases del carrer del Comte de Güell. A la segona meitat del segle XX, la celebració del Congrés Eucarístic (1952) va acabar de donar un impuls a la urbanització de la zona de la plaça de Pius XII.", "Entre el 1950 i el 1975 també es van construir les instal·lacions del FC Barcelona i el campus de les universitat a ambós costats de l'avinguda Diagonal, que ocupen una porció significativa del territori actual del districte.", "Si parlem de la història recent del districte de les Corts, no podem deixar de parlar d’un barri, Pedralbes, que va passar a formar part de les Corts als anys vuitanta del segle XX a conseqüència de l’ordenació en districtes de la ciutat de Barcelona.", "El barri de Pedralbes, que en l’actualitat ocupa la zona del districte de les Corts compresa entre l’avinguda Diagonal i Collserola, pren el seu nom de les pedres de color clar que es trobaven a l’indret. Pedralbes va romandre durant segles i fins ben entrat el segle XX com una zona poc urbanitzada. Algunes famílies adinerades de Barcelona hi tenien les seves finques, com va ser el cas d’Eusebi Güell, conegut per haver estat el mecenes d’Antoni Gaudí, o Manuel Girona, important banquer barceloní del segle XIX.", "El Pedralbes històric estava centrat al voltant del monestir, fundat el 1327 per la reina Elisenda de Montcada i del qual depenien els masos del voltant. El seu bon estat de conservació explica per què aquest punt és encara avui un dels més emblemàtics de tot el districte de les Corts.", "<strong>Ruta de la memòria històrica: un enclavament de memòria històrica</strong>", "Inspirada en el projecte desenvolupat pel Màster en disseny urbà i el Centre de Recerca Polis: Art, Ciutat, Societat de la Universitat de Barcelona, aquesta ruta s’ha traçat amb la col·laboració de l’Associació per la Cultura i la Memòria de Catalunya (ACME) i l’Ajuntament de Barcelona.", "La Ruta de la Memòria Històrica de les Corts a Barcelona proposa un recorregut urbà per tretze localitzacions del districte: edificis, monuments, entorns urbans fortament identificats amb esdeveniments històrics del període de la Segona República Espanyola, de la Guerra Civil i de la dictadura franquista.", "També es proposen tres projectes d’idees per a espais “sense memòria”, on s’han dut a terme enderrocaments de monuments franquistes. Aquest és el cas dels indrets on s’alçaven l’antic monument dedicat a José Antonio Primo de Rivera i el monument a “los caídos”. El tercer projecte identifica la presó de dones de les Corts, ja desapareguda. Es tracta d’un lloc amb una forta història social i humana de repressió franquista, avui invisible en el paisatge urbà de la ciutat.", "Aquí teniu les localitzacions de la ruta:", "Antic monument a José Antonio Primo de Rivera", "Jou i fletxes en plaques d’habitatges", "Antic monument als herois d’Espinosa de los Monteros", "Antic camp de Les Corts", "Residència d’oficials de l’Exèrcit espanyol", "Antic monòlit dedicat a la Legión Cóndor", "Antiga presó de dones de les Corts", "Congrés Eucarístic del 1952. Monument a Pius XII", "Facultat de Dret, urbanització de Maria Cristina i Zona Universitària", "Palau de Pedralbes", "Monument caigut, antic monument a “los caídos”", "Camp Nou", "Caserna del Bruc"], "vibe": "Un poble agrícola que avui viu al ritme dels gols del Camp Nou."}, "ru": {"name": "Лес-Кортс", "sub": "", "desc": ["<strong>О истории Лес-Кортса</strong>", "Район Лес-Кортс берёт своё начало от одноимённого старинного посёлка, расположенного в западной части барселонской равнины, сельской местности с плодородной землёй, занимавшей примерно территорию между руслом Магория и Риера-Бланка.", "Есть свидетельства присутствия человека в этой местности, восходящие к иберийской и римской эпохам. Земледельческая традиция этой территории проявляется в существовании нескольких римских вилл на землях, где сегодня раскинулся район Лес-Кортс. В Средние века некоторые усадьбы (масии) были укреплены, как, например, усадьба Торре-Родона, сохранившаяся до наших дней и получившая своё название от оборонительной башни, пристроенной во времена арабских набегов конца X века.", "Жители Лес-Кортса — с эпохи Каролингов вплоть до IX века — пользовались привилегиями «франкез» (freedoms), признанными решением Хайме I в 1274 году. Их считали гражданами Барселоны и освобождали от всех налогов, кроме сбора на королевский постой. Королевский алькальд франкез назначал местного алькальда в Лес-Кортсе, что способствовало сохранению социальной структуры, основанной на крестьянах-землевладельцах, и поддержанию территориальной независимости.", "Границы нынешнего района довольно точно соответствуют границам вольных земель, установленных в средневековые времена и находившихся тогда под непосредственным управлением графа-короля, что способствовало их развитию. Именно эта административная ситуация, при которой не вмешивалась никакая местная власть, и способствовала выбору данного места для размещения Королевского монастыря Санта-Мария-де-Педральбес.", "Декрет Нуэва-Планта 1716 года среди прочего означал утрату привилегии франкез, которой пользовался Лес-Кортс. Как следствие, в годы после войны за испанское наследство (1701–1713/1715) некоторые землевладельцы были вынуждены передавать свои земли в эмфитевзис (долгосрочную аренду с правом выкупа), положив начало процессу раздробления, который уже было не остановить. Конституция 1812 года и создание прихода Марe-де-Деу-дель-Ремей позволили в 1836 году учредить новую полноценную муниципальную единицу, которая в 1897 году была присоединена к Барселоне.", "<strong>Истоки муниципалитета Лес-Кортс</strong>", "Как отмечает в своих трудах историк Жузеп Моран-и-Осеринжауреги, создание конституционных муниципалитетов на равнине Барселоны в начале XIX века происходило на основе прежних алькальдий, границы которых совпадали с границами приходов, — за исключением случая Лес-Кортса.", "Его своеобразие заключалось в том, что он имел собственную алькальдию на своей территории, но при этом принадлежал приходу Сант-Висенс-де-Сарриа. При разграничении новых муниципальных территорий Лес-Кортс был вынужден уступить Сарриа свою горную часть. Этот процесс формирования муниципалитета, начавшийся в феврале 1814 года, завершился лишь в октябре 1836 года.", "Именно тогда Лес-Кортс добился окончательной автономии, которая сохранялась вплоть до присоединения к городу Барселона в 1897 году. Тогда, в силу королевского указа о присоединении и вопреки воле его жителей, Лес-Кортс был присоединён к Барселоне вместе с другими посёлками барселонской равнины — Грасией, Сант-Марти-де-Провенсалс, Сант-Андреу-де-Паломар и Санта-Мария-де-Сантс.", "Позднее посёлок разросся вдоль дороги на Сарриа, образовав собственное расширение (эшампле). Также в конце XIX — начале XX века в Лес-Кортсе были построены различные учреждения, обслуживавшие город Барселону, такие как дом Матернитат-и-Экспозит — один из самых знаковых архитектурных ансамблей района, психиатрический институт (Френопатико), детская больница Сант-Жоан-де-Деу и несколько приютов.", "Лес-Кортс сохранял сельский характер довольно долго, но, как и в других частях барселонской равнины, процесс индустриализации и урбанизации в итоге преобразил облик и характер квартала на протяжении XX века. Размещение в Лес-Кортсе различных кирпичных заводов и химических предприятий сопровождалось строительством рабочих посёлков (колоний), среди которых Колония Кастельс — один из самых ярких примеров.", "Эта первая волна застройки сосредоточилась вокруг так называемого Старого Лес-Кортса (Кортс-Вельес), тогда как зона вокруг проспекта Диагональ, крупной городской магистрали, открытой в 1924 году, оставалась незастроенной вплоть до середины XX века, когда там начали возводить многочисленные офисные и торговые здания.", "Лес-Кортс также разрастался в сторону Л’Оспиталет-де-Льобрегат — сначала благодаря развитию рабочих колоний, таких как дома на улице Конте-де-Гуэль. Во второй половине XX века проведение Евхаристического конгресса (1952) дало последний толчок застройке зоны площади Пия XII.", "Между 1950 и 1975 годами были также построены сооружения ФК «Барселона» и университетские кампусы по обе стороны Диагонали, которые занимают значительную часть нынешней территории района.", "Говоря о новейшей истории Лес-Кортса, нельзя не упомянуть квартал Педральбес, вошедший в состав района в 1980-е годы XX века в результате деления Барселоны на округа.", "Квартал Педральбес, занимающий сегодня часть территории района Лес-Кортс между проспектом Диагональ и горным массивом Кольсерола, получил своё название от светлых камней («педрес альбес»), которые находили в этой местности. Педральбес на протяжении веков, вплоть до значительной части XX века, оставался малозастроенной зоной. Некоторые состоятельные барселонские семьи держали здесь свои поместья, как, например, Эусеби Гуэль, известный как меценат Антони Гауди, или Мануэль Жирона, крупный барселонский банкир XIX века.", "Исторический центр Педральбеса сформировался вокруг монастыря, основанного в 1327 году королевой Элисендой де Монкада, от которого зависели окрестные усадьбы (масии). Его хорошая сохранность объясняет, почему это место и сегодня остаётся одним из самых узнаваемых во всём районе Лес-Кортс.", "<strong>Маршрут исторической памяти: место памяти</strong>", "Вдохновлённый проектом, разработанным магистерской программой по городскому дизайну и Исследовательским центром Polis: Искусство, Город, Общество Университета Барселоны, этот маршрут был проложен в сотрудничестве с Ассоциацией по культуре и памяти Каталонии (ACME) и муниципалитетом.", "Маршрут исторической памяти Лес-Кортса в Барселоне предлагает городской путь по тринадцати точкам района: зданиям, памятникам и городским пространствам, тесно связанным с историческими событиями периода Второй Испанской республики, Гражданской войны и франкистской диктатуры.", "Также предлагаются три проектные идеи для пространств «без памяти», где были снесены франкистские монументы. Речь идёт о местах, где стояли прежний памятник Хосе Антонио Примо де Ривере и памятник павшим. Третий проект посвящён женской тюрьме Лес-Кортс, ныне уже не существующей, — месту с тяжёлой социальной и человеческой историей франкистских репрессий, сегодня невидимому в городском пейзаже.", "Ниже перечислены точки маршрута:", "Прежний памятник Хосе Антонио Примо де Ривере", "Ярмо и стрелы на табличках домов", "Прежний памятник героям Эспиносы-де-лос-Монтерос", "Прежнее поле стадиона «Лес-Кортс»", "Резиденция офицеров испанской армии", "Прежний монолит в честь легиона «Кондор»", "Прежняя женская тюрьма Лес-Кортс", "Евхаристический конгресс 1952 года. Памятник Пию XII", "Юридический факультет, застройка Марии-Кристины и Университетская зона", "Дворец Педральбес", "«Павший монумент» — прежний памятник павшим", "«Камп Ноу»", "Казармы Брук"], "vibe": "Бывшая деревня, чей ритм жизни сегодня задаёт «Камп Ноу»."}, "historia_url": "https://ajuntament.barcelona.cat/lescorts/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/lescorts/es/el-distrito-y-sus-barrios"}, "d5": {"num": 5, "color": "#A9A66A", "web1": "http://www.bcn.cat/sarria-santgervasi", "src": "https://en.wikipedia.org/wiki/Sarri%C3%A0-Sant_Gervasi", "ipa_ca": "suh-ree-AH san zhuhr-VAH-zee", "ipa_es": "sah-ree-AH sahn kher-VAH-syoh", "landmarks": [["La Torre Bellesguard", "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/puntos-de-interes/la-torre-bellesguard-92086008813", {"es": "residencia de Gaudí sobre ruinas medievales", "ca": "residència de Gaudí sobre ruïnes medievals", "ru": "особняк Гауди на средневековых руинах"}], ["Vil·la Joana, Museo-Casa Verdaguer", "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/puntos-de-interes/villa-joana-museocasa-verdaguer-92086005883", {"es": "antigua masía, casa-museo del poeta Verdaguer", "ca": "antiga masia, casa-museu del poeta Verdaguer", "ru": "усадьба, дом-музей поэта Вердагера"}], ["El Mercado de Galvany", "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/puntos-de-interes/el-mercado-de-galvany-92086009458", {"es": "mercado municipal de 1927", "ca": "mercat municipal de 1927", "ru": "муниципальный рынок 1927 года"}], ["La iglesia de Sant Vicenç de Sarrià", "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/puntos-de-interes/la-iglesia-de-sant-vicenc-de-sarria-92086005254", {"es": "parroquia con orígenes del siglo X", "ca": "parròquia amb orígens del segle X", "ru": "приходская церковь с корнями X века"}], ["Casa Roviralta ‘El Frare Blanc’", "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/puntos-de-interes/casa-roviralta-el-frare-blanc-75990048521", {"es": "mansión modernista, hoy restaurante", "ca": "mansió modernista, avui restaurant", "ru": "модернистский особняк, теперь ресторан"}]], "founding": {"es": "Sarrià-Sant Gervasi es el quinto distrito de Barcelona, con 20,09 km2 y unos 148.000 habitantes, y es la puerta al parque natural de Collserola. Lo forman los barrios de Sarrià, les Tres Torres, Sant Gervasi-la Bonanova, Sant Gervasi-Galvany, Vallvidrera-el Tibidabo i les Planes y el Putxet i el Farró, resultado de la suma de antiguos municipios agregados a Barcelona.", "ca": "Sarrià-Sant Gervasi és el cinquè districte de Barcelona, amb 20,09 km2 i uns 148.000 habitants, i és la porta al parc natural de Collserola. El formen els barris de Sarrià, les Tres Torres, Sant Gervasi-la Bonanova, Sant Gervasi-Galvany, Vallvidrera-el Tibidabo i les Planes i el Putxet i el Farró, resultat de la suma d'antics municipis agregats a Barcelona.", "ru": "Сарья-Сан-Жервази — пятый по счёту район Барселоны площадью 20,09 км² и населением около 148 000 человек, служащий воротами в природный парк Кольсерола. Район включает кварталы Сарья, лас-Трес-Торрес, Сан-Жервази-ла-Бонанова, Сан-Жервази-Гальвани, Вальвидрера-эль-Тибидабо-и-лес-Планес и эль-Путчет-и-эль-Фарро — результат объединения бывших самостоятельных общин."}, "es": {"name": "Sarrià-San Gervasio", "sub": "", "desc": ["<strong>Sarrià</strong>", "El topónimo Sarrià proviene del nombre Sirriano, que aparece mencionado por primera vez en el año 986. El origen de la municipalidad de Sarrià se puede situar hacia los siglos XIII-XIV. A finales del siglo XV, el poblamiento de Sarrià ya era bastante significativo. El núcleo situado en torno a la iglesia y el que había en las masías de fuera de la villa formaban una sociedad rural que fundamentaba la economía en el rendimiento de la tierra. Con el tiempo se fue transformando en una sociedad urbana de menestrales y artesanos que, con la proliferación de torres y chalés de veraneo (siglos XVI-XVII), adquirió una gran importancia.", "A principios del siglo XX, Sarrià se convirtió en uno de los núcleos más ricos y poblados del llano de Barcelona. A partir de 1850, Sarrià vivió principalmente de las actividades relacionadas con la construcción, y su población, hasta entonces formada por campesinos y artesanos, pasó a tener un núcleo de menestralía importante. En el último tercio del siglo XIX ya se planteó la agregación a Barcelona. Sarrià se opuso al respecto y fue, junto con Horta, el único municipio del llano que la pudo evitar en 1897. En 1921 se reabrió el expediente de agregación, a petición del Ayuntamiento de Barcelona. Se tramitó con una gran rapidez y, el mismo año, a pesar de la oposición de los sarrianenses, quedó agregado a la ciudad por real decreto, y fue, pues, el último pueblo del llano que se incorporó a Barcelona.", "El Sarrià de hoy combina los rincones donde se puede rememorar con facilidad el antiguo pueblo rural, sobre todo en los alrededores de la calle Major de Sarrià, y las zonas modernas y las grandes vías de comunicaciones.", "<strong>Sant Gervasi-la Bonanova</strong>", "El antiguo término de Sant Gervasi de Cassoles estaba situado en la vertiente del Tibidabo, entre la sierra y el llano. Su geografía accidentada de torrentes y colinas explica que se mantuviera con una población escasa durante muchos años y que no tuviera un núcleo potente. El nombre proviene de una pequeña iglesia rural bajo la advocación de san Gervasio. Con respecto al topónimo Cassoles, se ha interpretado como una contracción de casas solas. En el siglo X formaba parte del término de Sarrià, hasta que en 1714 fue declarado municipio autónomo. Su primer ayuntamiento se constituyó en 1727, y, en 1897, se anexionó a Barcelona.", "A mediados del siglo XIX, Sant Gervasi fue descubierto por la burguesía barcelonesa y emprendieron las primeras urbanizaciones. Propietarios como Mandri o Ganduxer pusieron sus nombres a algunas de las calles que abrían. En unos cincuenta años dejó de ser un pequeño pueblo campesino y se convirtió en una zona residencial con antiguas casas solariegas, villas de veraneo, casas de menestrales, conventos y colegios religiosos, artesanos y pequeños rentistas.", "Este carácter se mantiene todavía en buena medida en la parte alta del barrio, conocida como la Bonanova, si bien muchas torres se han sustituido por bloques de pisos de alto nivel. Algunos de los edificios destacados del barrio son el de la Rotonda, el del Frare Blanc y el de Bellesguard, este último, obra de Gaudí. Otros elementos urbanos destacables son el cementerio de Sant Gervasi; los jardines de La Tamarita, diseñados por Rubió i Tudurí en 1918 en una finca privada e inaugurados como parque público en 1994; o la antigua fábrica Casacuberta, obra de Josep Domènech i Estapà, rehabilitada y complementada recientemente con un nuevo edificio como museo de la ciencia.", "<strong>Sant Gervasi-Galvany</strong>", "El barrio de Sant Gervasi-Galvany ocupa la parte baja del antiguo término de Sant Gervasi, entre la Diagonal y la ronda del Mig. El nombre de Galvany se popularizó cuando lo adoptó el mercado municipal de la zona, recuperando el del antiguo propietario de los terrenos del entorno, Josep Castelló i Galvany. La urbanización del Camp d’en Galvany se inició en 1866. Se trataba de unos terrenos junto al parque de atracciones Turó Park, posteriormente convertido en jardines en 1934 siguiendo un proyecto de Rubió i Tudurí del año 1917.", "Este jardín, junto con el de Monterols y el pequeño parque de Moragues, son las islas verdes de un barrio de marcado carácter residencial, combinado con una importante actividad comercial y terciaria, sobre todo en el sector más próximo a la Diagonal y en el eje vertical de la calle de Muntaner. El tren de Sarrià ha sido uno de los principales elementos de estructuración y dinamización del barrio, aunque el recorrido a cielo abierto representó, durante muchos años, un peligro importante y una barrera urbana. Inaugurado en 1868, fue electrificado en 1902. Entre 1925 y 1929 se cubrió el trazado entre la plaza de Catalunya y la calle de Muntaner, hecho que dio lugar a la aparición de la Vía Augusta, actual eje vertebrador transversal del barrio.", "La tipología edificatoria predominante en el barrio es la de manzana cerrada, si bien en el extremo oriental —en las zonas de Can Ballescar y Modolell-Can Castelló, a ambos lados de la Vía Augusta— se reproduce el modelo de bloques aislados de media altura característico del barrio vecino de las Tres Torres.", "<strong>El Putxet i el Farró</strong>", "El Putxet es una pequeña montaña que se extiende entre Vallcarca y Sant Gervasi. Aunque hay noticias de la existencia de una capilla en el siglo XVII, los primeros vestigios de poblamiento conocidos deben situarse hacia 1870, cuando se empezó a construir una serie de torres para la burguesía, que se trasladaba allí a causa de las condiciones urbanas que sufría la Barcelona vieja. Se trataba de uno de los tres barrios, junto con los de la Bonanova y Lledó, que integraban el término municipal de Sant Gervasi en 1879.", "Durante muchos años fue, fundamentalmente, un barrio de veraneo, pero con el paso del tiempo y la llegada de nuevos medios de transporte (el tren de Sarrià en 1863, el metro en 1924, el tranvía...) se convirtió en un lugar de residencia habitual. Tal como ocurría simultáneamente en Sarrià o en la Salut, la colina se pobló de torres, algunas de estilo modernista, como las que perviven en las calles de Mulet o de Puig-reig. A partir de la segunda mitad del siglo XX, no obstante, muchas de estas casas se sustituyeron por pisos. El barrio es dominado por el parque creado en 1970 en la cima de la colina, en unos terrenos cedidos por la familia Morató.", "La parte baja del barrio, por debajo de la ronda del Mig, corresponde al vecindario del Farró, estructurado verticalmente en torno a las calles de Saragossa y de Vallirana. Este sector vio rota la continuidad física con la parte baja del Putxet por la abertura de la ronda del Mig, que durante decenios ha sido una barrera urbana casi infranqueable, tanto a pie como en vehículo. Los actuales proyectos de reordenación urbana y circulatoria de la ronda entre Balmes y Lesseps permitirán permeabilizar el paso entre las aceras de montaña y de mar y recuperar la antigua relación entre ambas zonas.", "<strong>Vallvidrera, el Tibidabo i les Planes</strong>", "Este barrio se extiende por un amplio territorio de la sierra de Collserola y comprende tres zonas bien diferenciadas. El término de Vallvidrera, a caballo entre ambas vertientes de Collserola, forma parte de Sarrià desde que se agregó a este, en 1890. Su historia va estrechamente ligada a la de la iglesia de Santa Maria de Vallvidrera, construida en estilo gótico tardío entre los años 1540 y 1587. Otro edificio destacado es la casa solariega Vil·la Joana, que fue la última residencia de mosén Cinto Verdaguer. El desarrollo urbano se produjo a partir de la segunda mitad del siglo XIX. Entre los elementos construidos destacables está el pantano de Vallvidrera (1864), actualmente en recuperación como espacio de ocio. En 1888 se construyó la carretera de acceso de Vallvidrera al Tibidabo y, en 1902, la carretera de las Aigües, vinculada al abastecimiento de la ciudad. En 1901 se inauguró el Tramvia Blau, que hacía el recorrido desde el Tibidabo hasta Vallvidrera, y, en 1906, el funicular. La expansión urbanística de Vallvidrera la convirtió en un lugar de veraneo de los barceloneses. Actualmente, Vallvidrera está consolidado como zona residencial permanente.", "Las Planes, que incluye los núcleos diferenciados de Mas Sauró, Mas Guimbau y el Rectoret, se sitúa en la vertiente del Vallès de la sierra de Collserola. Durante unos años fue primordialmente un lugar de veraneo, con hoteles, fuentes y los populares merenderos. A finales de siglo surgió el primer núcleo urbanizado y, a partir de la segunda mitad del siglo XX, se transformó en una barriada humilde sin ningún orden. No fue hasta 1980 cuando se aprobó un plan de actuación urbanística.", "El Tibidabo era un lugar de excursiones hasta que se abrió la carretera de la Arrabassada, en 1888. Entonces se inició la construcción del parque de atracciones, del Observatorio Fabra (1902-1904) y del templo del Sagrat Cor, iniciado en 1902 y acabado en los años sesenta. En 1992 se inauguró la torre de comunicaciones de Collserola, obra de Norman Foster. En el año 2000, el parque de atracciones del Tibidabo pasó a ser propiedad del Ayuntamiento. A su lado se mantiene un pequeño núcleo residencial."], "vibe": "Tres pueblos independientes que se resisten, con estilo, a dejar de sentirse pueblo."}, "ca": {"name": "Sarrià-Sant Gervasi", "sub": "", "desc": ["<strong>Sarrià</strong>", "El topònim Sarrià prové del nom Sirriano, que apareix esmentat per primera vegada l’any 986. L’origen de la municipalitat de Sarrià es pot situar cap als segles XIII-XIV. Al final del segle XV, el poblament de Sarrià ja era prou significatiu. El nucli situat al voltant de l’església i el que hi havia a les masies de fora de la vila formaven una societat rural que fonamentava l’economia en el rendiment de la terra. Amb el temps es va anant transformant en una societat urbana de menestrals i artesans que, amb la proliferació de torres i xalets d’estiueig (segles XVI-XVII), va adquirir una gran importància.", "Al començament del segle XX, Sarrià va esdevenir un dels nuclis més rics i poblats del pla de Barcelona. A partir del 1850 Sarrià va viure principalment de les activitats relacionades amb la construcció i la seva població, fins llavors formada per pagesos i artesans, va passar a tenir un nucli de menestralia important. En el darrer terç del segle XIX ja es va plantejar l’agregació a Barcelona. Sarrià s’hi va oposar i va ser, juntament amb Horta, l’únic municipi del pla que la va poder evitar l’any 1897. El 1921 es va reobrir l’expedient d’agregació, a petició de l’Ajuntament de Barcelona. Es va tramitar amb una gran rapidesa i, el mateix any, malgrat l’oposició dels sarrianencs, va quedar agregat a la ciutat per reial decret, i va ser, doncs, el darrer poble del pla que es va incorporar a Barcelona.", "El Sarrià d’avui combina els racons on es pot rememorar amb facilitat l’antic poble rural, sobretot als voltants del carrer Major de Sarrià, i les zones modernes i les grans vies de comunicacions.", "<strong>Sant Gervasi - la Bonanova</strong>", "L’antic terme de Sant Gervasi de Cassoles estava situat al vessant del Tibidabo, entre la serra i el pla. La seva geografia accidentada per rieres, torrents i turons explica que es mantingués amb una població escassa durant molts anys i que no tingués un nucli potent. El nom prové d’una petita església rural sota l’advocació de sant Gervasi. Pel que fa al topònim Cassoles, s’ha interpretat com una contracció de cases soles. Al segle X formava part del terme de Sarrià, fins que el 1714 va ser declarat municipi autònom. El seu primer ajuntament es va constituir el 1727. El 1897 va ser annexionat a Barcelona.", "A mitjan segle XIX Sant Gervasi va ser descobert per la burgesia barcelonesa i hi van començar les primeres urbanitzacions. Propietaris com Mandri o Ganduxer van posar els seus noms a alguns dels carrers que obrien. En uns cinquanta anys va deixar de ser un petit poble camperol i es va convertir en una zona residencial amb antigues cases pairals, vil·les d’estiueig, cases de menestrals, convents i col·legis religiosos, artesans i petits rendistes.", "Aquest caràcter es manté encara en bona mesura a la part alta del barri, coneguda com la Bonanova, si bé moltes torres s'han substituït per blocs de pisos d’alt nivell. Alguns dels edificis destacats del barri són el de la Rotonda, el del Frare Blanc i el de Bellesguard, aquest darrer, obra de Gaudí. Altres elements urbans remarcables són el cementiri de Sant Gervasi, els jardins de la Tamarita, dissenyats per Rubió i Tudurí el 1918 en una finca privada i inaugurats com a parc públic el 1994, o l’antiga fàbrica Casacuberta, obra de Josep Domènech i Estapà, rehabilitada i complementada recentment amb un nou edifici com a museu de la ciència.", "<strong>Sant Gervasi - Galvany</strong>", "El barri de Sant Gervasi - Galvany ocupa la part baixa de l’antic terme de Sant Gervasi, entre la Diagonal i la ronda del Mig. El nom de Galvany es va popularitzar quan el va adoptar el mercat municipal de la zona, recuperant el de l’antic propietari dels terrenys de l’entorn, Josep Castelló i Galvany. La urbanització del Camp d’en Galvany es va iniciar el 1866. Es tractava d’uns terrenys a tocar del parc d’atraccions Turó Park, posteriorment convertit en jardins el 1934 seguint un projecte de Rubió i Tudurí de l’any 1917.", "Aquest jardí, juntament amb el de Monterols i el petit parc de Moragues, són les illes verdes d’un barri de marcat caràcter residencial, combinat amb una important activitat comercial i terciària sobretot en el sector més proper a la Diagonal i en l’eix vertical del carrer de Muntaner. El tren de Sarrià ha estat un dels principals elements d'estructuració i dinamització del barri, encara que el recorregut a cel obert va representar, durant molts anys, un perill important i una barrera urbana. Inaugurat el 1868, va ser electrificat el 1902. Entre el 1925 i el 1929 es va cobrir el traçat entre la plaça de Catalunya i el carrer de Muntaner, fet que va donar lloc a l’aparició de la Via Augusta, actual eix vertebrador transversal del barri.", "La tipologia edificatòria predominant al barri és la d’illa tancada, si bé a l’extrem oriental –a les zones de Can Ballescar i Modolell - Can Castelló, a banda i banda de la Via Augusta– es reprodueix el model de blocs aïllats de mitjana alçada característic del barri veí de les Tres Torres.", "<strong>El Putxet i el Farró</strong>", "El Putxet és una petita muntanya que s’estén entre Vallcarca i Sant Gervasi. Malgrat que hi ha notícies de l’existència d’una capella al segle XVII, els primers vestigis de poblament s’han de situar cap al 1870, en què es va començar a construir un seguit de torres per a la burgesia, que s’hi traslladava a causa de les condicions urbanes que patia la Barcelona vella. Es tractava d’un dels tres barris, juntament amb els de la Bonanova i Lledó, que integraven el terme municipal de Sant Gervasi el 1879.", "Durant molts anys va ser, fonamentalment, un barri d’estiueig, però amb el pas del temps i l’arribada de nous mitjans de transport (el tren de Sarrià el 1863, el metro el 1924, el tramvia…) es va convertir en un lloc de residència habitual. Tal com passava simultàniament a Sarrià o a la Salut, el turó es va poblar de torres, algunes d’estil modernista, com les que perviuen als carrers de Mulet o de Puig-reig. A partir de la segona meitat del segle XX, però, moltes d’aquestes cases es van substituir per pisos. El barri és dominat pel parc creat el 1970 al cim del turó, en uns terrenys cedits per la família Morató.", "La part baixa del barri, per sota de la ronda del Mig, correspon al veïnat del Farró, estructurat verticalment entorn dels carrers de Saragossa i de Vallirana. Aquest sector va veure trencada la continuïtat física amb la part baixa del Putxet per l’obertura de la ronda del Mig, que durant decennis ha estat una barrera urbana quasi infranquejable, tant a peu com amb vehicle. Els actuals projectes de reordenació urbana i circulatòria de la ronda entre Balmes i Lesseps permetran permeabilitzar el pas entre les voreres de muntanya i de mar i recuperar l’antiga relació entre ambdues zones.", "<strong>Vallvidrera, el Tibidabo i les Planes</strong>", "Aquest barri s’estén per un ampli territori de la serra de Collserola i comprèn tres zones ben diferenciades. El terme de Vallvidrera, a cavall d’ambdós vessants de Collserola, forma part de Sarrià des que s’hi va agregar, l’any 1890. La seva història va estretament lligada a la de l’església de Santa Maria de Vallvidrera, construïda en estil gòtic tardà entre els anys 1540 i 1587. Un altre edifici destacat és la casa pairal Vil·la Joana, que va ser la darrera residència de mossèn Cinto Verdaguer. El desenvolupament urbà es va produir a partir de la segona meitat del segle XIX. Entre els elements construïts destacables hi ha el pantà de Vallvidrera (1864), actualment en recuperació com a espai de lleure. El 1888 es va construir la carretera d’accés de Vallvidrera al Tibidabo i, el 1902, la carretera de les Aigües, vinculada a l’abastament de la ciutat. El 1901 es va inaugurar el Tramvia Blau, que feia el recorregut des del Tibidabo fins a Vallvidrera i, el 1906, el funicular. L’expansió urbanística de Vallvidrera la va convertir en un indret d’estiueig dels barcelonins. Actualment, Vallvidrera està consolidat com a zona residencial permanent.", "Les Planes, que inclou els nuclis diferenciats de Mas Sauró, Mas Guimbau i el Rectoret, se situa al vessant del Vallès de la serra de Collserola. Durant uns anys va ser primordialment un lloc d’estiueig, amb hotels, fonts i els populars berenadors. Al tombant del segle hi va sorgir el primer nucli urbanitzat i, a partir de la segona meitat del segle XX, es va transformar en una barriada humil sense cap ordre. No va ser fins el 1980 que es va aprovar un pla d’actuació urbanística.", "El Tibidabo era un lloc d’excursions fins que es va obrir la carretera de l’Arrabassada, el 1888. Aleshores es va iniciar la construcció del parc d’atraccions, de l’Observatori Fabra (1902-1904) i del temple del Sagrat Cor, iniciat l’any 1902 i acabat als anys seixanta. L’any 1992 es va inaugurar la torre de comunicacions de Collserola, obra de Norman Foster. L’any 2000 el parc d’atraccions del Tibidabo va passar a ser propietat de l’Ajuntament. Al seu costat es manté un petit nucli residencial."], "vibe": "Tres pobles independents que es resisteixen, amb estil, a deixar de sentir-se poble."}, "ru": {"name": "Сарья-Сант-Жервази", "sub": "", "desc": ["<strong>Сарриа</strong>", "Топоним Сарриа происходит от имени Сиррьяно, впервые упомянутого в 986 году. Возникновение муниципалитета Сарриа можно отнести примерно к XIII–XIV векам. К концу XV века поселение Сарриа было уже весьма значительным. Ядро вокруг церкви и то, что находилось в усадьбах за пределами посёлка, образовывали сельское общество, экономика которого основывалась на доходах от земли. Со временем оно превратилось в городское общество ремесленников и мастеровых, которое благодаря распространению башен и летних вилл (XVI–XVII века) приобрело большое значение.", "В начале XX века Сарриа стал одним из самых богатых и населённых центров барселонской равнины. Начиная с 1850 года Сарриа жил главным образом за счёт деятельности, связанной со строительством, а его население, состоявшее до тех пор из крестьян и ремесленников, пополнилось значительной прослойкой мастеровых. В последней трети XIX века уже поднимался вопрос о присоединении к Барселоне. Сарриа воспротивился этому и, вместе с Ортой, оказался единственным муниципалитетом равнины, которому удалось избежать присоединения в 1897 году. В 1921 году дело о присоединении было вновь открыто по требованию барселонского муниципалитета. Оно было проведено очень быстро, и в том же году, несмотря на сопротивление жителей Сарриа, посёлок был присоединён к городу королевским указом, став, таким образом, последним посёлком равнины, вошедшим в состав Барселоны.", "Сегодняшний Сарриа сочетает уголки, где легко представить старый сельский посёлок, особенно в окрестностях улицы Майор-де-Сарриа, с современными зонами и крупными транспортными магистралями.", "<strong>Сант-Жервази — ла-Бонанова</strong>", "Старинная территория Сант-Жервази-де-Касолес располагалась на склоне горы Тибидабо, между хребтом и равниной. Её пересечённая местность с оврагами и холмами объясняет, почему на протяжении многих лет здесь сохранялось малочисленное население без сильного центра. Название происходит от небольшой сельской церкви, освящённой в честь святого Жервасия. Что касается топонима Касолес, его трактуют как сокращение от «отдельно стоящие дома» (casas solas). В X веке эта территория входила в состав Сарриа, пока в 1714 году не была объявлена самостоятельным муниципалитетом. Его первый муниципальный совет был образован в 1727 году, а в 1897 году территория вошла в состав Барселоны.", "В середине XIX века Сант-Жервази был «открыт» барселонской буржуазией, которая начала первую застройку этих земель. Такие владельцы, как Мандри или Гандуше, дали свои имена некоторым из прокладываемых улиц. Всего за пятьдесят с небольшим лет он перестал быть маленьким крестьянским посёлком и превратился в жилую зону со старинными родовыми домами, летними виллами, домами ремесленников, монастырями и религиозными школами, мастеровыми и мелкими рантье.", "Этот характер во многом сохраняется до сих пор в верхней части квартала, известной как Ла-Бонанова, хотя многие «башни» (особняки) были заменены многоквартирными домами высокого класса. Среди наиболее заметных зданий квартала — здание Ротонды, дом Фраре-Бланк и дом Бельесгуард — последний является работой Гауди. Среди других примечательных городских объектов — кладбище Сант-Жервази; сады Ла-Тамарита, спроектированные Рубьо-и-Тудури в 1918 году на территории частного поместья и открытые как общественный парк в 1994 году; а также старая фабрика Касакуберта, творение Жузепа Доменека-и-Эстапы, недавно реставрированная и дополненная новым зданием музея науки.", "<strong>Сант-Жервази — Гальвани</strong>", "Квартал Сант-Жервази-Гальвани занимает нижнюю часть старинной территории Сант-Жервази, между Диагональю и рондой Миг. Название Гальвани получило распространение, когда его принял муниципальный рынок этой зоны, унаследовав его от прежнего владельца окрестных земель, Жузепа Кастельо-и-Гальвани. Застройка Камп-д'ен-Гальвани началась в 1866 году. Это были земли рядом с парком аттракционов Туро-Парк, впоследствии, в 1934 году, превращённым в сад по проекту Рубьо-и-Тудури 1917 года.", "Этот сад вместе с садом Монтеролс и небольшим парком Морагес образуют зелёные острова квартала с выраженным жилым характером, сочетающимся с заметной торговой и деловой активностью, особенно в секторе, ближайшем к Диагонали, и вдоль вертикальной оси улицы Мунтанер. Поезд Сарриа был одним из главных факторов формирования и оживления квартала, хотя его открытый маршрут долгие годы представлял собой серьёзную опасность и городской барьер. Открытая в 1868 году линия была электрифицирована в 1902 году. Между 1925 и 1929 годами участок между площадью Каталонии и улицей Мунтанер был убран под землю, что дало начало улице Виа-Аугуста, ныне поперечной структурообразующей оси квартала.", "Преобладающий тип застройки в квартале — замкнутый квартал (манзана), хотя в восточной части — в зонах Кан-Бальескар и Модолель-Кан-Кастельо, по обе стороны Виа-Аугуста, — воспроизводится модель отдельно стоящих малоэтажных блоков, характерная для соседнего квартала Трес-Торрес.", "<strong>Путчет и Фарро</strong>", "Путчет — небольшая гора, простирающаяся между Валькаркой и Сант-Жервази. Хотя есть сведения о существовании часовни в XVII веке, первые известные следы заселения относятся примерно к 1870 году, когда здесь начали строить ряд «башен» (особняков) для буржуазии, переселявшейся сюда из-за неблагоприятных городских условий, царивших в старой Барселоне. Это был один из трёх кварталов — наряду с Ла-Бонановой и Льедо, — которые составляли муниципальную территорию Сант-Жервази в 1879 году.", "Долгие годы это был преимущественно дачный квартал, но со временем и с появлением новых видов транспорта (поезд Сарриа в 1863 году, метро в 1924-м, трамвай...) он превратился в место постоянного проживания. Как и одновременно происходило в Сарриа или в ла-Салют, холм застроился «башнями», некоторые в стиле модернизма, как те, что сохранились на улицах Мулет или Пуч-рейч. Начиная со второй половины XX века, впрочем, многие из этих домов были заменены многоквартирными зданиями. В квартале доминирует парк, созданный в 1970 году на вершине холма на землях, переданных семьёй Морато.", "Нижняя часть квартала, ниже ронды Миг, соответствует району Фарро, вертикально организованному вокруг улиц Сарагоса и Валлирана. Этот сектор утратил физическую связь с нижней частью Путчета из-за прокладки ронды Миг, которая на протяжении десятилетий была почти непреодолимым городским барьером — как для пешеходов, так и для транспорта. Нынешние проекты реорганизации улично-дорожной сети ронды между Бальмесом и Лессепсом позволят сделать проницаемым переход между «горной» и «морской» сторонами и восстановить прежнюю связь между этими двумя зонами.", "<strong>Вальвидрера, Тибидабо и Лес-Планес</strong>", "Этот квартал раскинулся на обширной территории горного массива Кольсерола и включает три чётко различающиеся зоны. Территория Вальвидреры, расположенная на обоих склонах Кольсеролы, входит в состав Сарриа с момента присоединения к нему в 1890 году. Её история тесно связана с историей церкви Санта-Мария-де-Вальвидрера, построенной в стиле поздней готики между 1540 и 1587 годами. Ещё одно примечательное здание — усадебный дом Вилья-Жоана, ставший последней резиденцией мосена Синто Вердагера. Городское развитие территории началось во второй половине XIX века. Среди примечательных построек — водохранилище Вальвидреры (1864), ныне восстанавливаемое как рекреационное пространство. В 1888 году была построена подъездная дорога от Вальвидреры к Тибидабо, а в 1902 году — «дорога вод» (каррете́ра-де-лес-Айгуэс), связанная со снабжением города водой. В 1901 году был открыт «Голубой трамвай» (Tramvia Blau), курсировавший от Тибидабо до Вальвидреры, а в 1906 году — фуникулёр. Городское развитие Вальвидреры превратило её в излюбленное дачное место барселонцев. Сегодня Вальвидрера утвердилась как зона постоянного проживания.", "Лес-Планес, включающая обособленные поселения Мас-Сауро, Мас-Гимбау и Эль-Ректурет, расположена на вальесской стороне горного массива Кольсерола. Несколько лет это было прежде всего дачное место, с гостиницами, источниками и популярными закусочными на открытом воздухе. В конце века здесь возник первый застроенный посёлок, а начиная со второй половины XX века территория превратилась в скромный квартал без какого-либо порядка застройки. Лишь в 1980 году был утверждён план градостроительных мероприятий.", "Тибидабо был местом для прогулок и вылазок до открытия в 1888 году дороги Аррабассада. Тогда же началось строительство парка аттракционов, обсерватории Фабра (1902–1904) и храма Сакрат-Кор, начатого в 1902 году и завершённого в 1960-е годы. В 1992 году была открыта телекоммуникационная башня Кольсеролы, творение Нормана Фостера. В 2000 году парк аттракционов Тибидабо перешёл в собственность муниципалитета. Рядом с ним сохраняется небольшой жилой посёлок."], "vibe": "Три бывшие независимые деревни, которые стильно отказываются переставать быть деревней."}, "historia_url": "https://ajuntament.barcelona.cat/sarria-santgervasi/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/sarria-santgervasi/es/el-distrito-y-sus-barrios"}, "d6": {"num": 6, "color": "#BB8478", "web1": "http://www.bcn.cat/gracia", "src": "https://guia.barcelona.cat/ca/detall/els-origens-de-gracia_99400664252.html", "ipa_ca": "GRAH-see-uh", "ipa_es": "GRAH-syah", "landmarks": [["El Park Güell", "https://ajuntament.barcelona.cat/gracia/es/conozca-el-distrito/puntos-de-interes/el-park-gell-92086011949", {"es": "parque modernista de Gaudí", "ca": "parc modernista de Gaudí", "ru": "модернистский парк Гауди"}], ["La Casa Vicens", "https://ajuntament.barcelona.cat/gracia/es/conozca-el-distrito/puntos-de-interes/la-casa-vicens-92086008808", {"es": "primera obra de Gaudí", "ca": "primera obra de Gaudí", "ru": "первая работа Гауди"}], ["La Casa Fuster", "https://ajuntament.barcelona.cat/gracia/es/conozca-el-distrito/puntos-de-interes/la-casa-fuster-99400084665", {"es": "edificio modernista, hoy hotel", "ca": "edifici modernista, avui hotel", "ru": "модернистское здание, теперь отель"}], ["El viaducto de Vallcarca", "https://ajuntament.barcelona.cat/gracia/es/conozca-el-distrito/puntos-de-interes/el-viaducto-de-vallcarca-99400386856", {"es": "viaducto con leones de piedra", "ca": "viaducte amb lleons de pedra", "ru": "виадук с каменными львами"}]], "founding": {"es": "Pocos distritos de Barcelona están rodeados de tanta simbología como Gràcia. El nuevo mapa de barrios oficializó el topónimo Vila de Gràcia para el casco antiguo, mientras que en el norte Vallcarca i els Penitents y el Coll (separado de Vallcarca) marcan el otro centro neurálgico. Los otros dos barrios son el Camp d'en Grassot i Gràcia Nova, sector más reciente, y la Salut.", "ca": "Pocs districtes de Barcelona estan envoltats de tanta simbologia com Gràcia. El nou mapa de barris va oficialitzar el topònim Vila de Gràcia per al nucli antic, mentre que al nord Vallcarca i els Penitents i el Coll (separat de Vallcarca) marquen l'altre centre neuràlgic. Els altres dos barris són el Camp d'en Grassot i Gràcia Nova, sector més recent, i la Salut.", "ru": "Немногие районы Барселоны так насыщены символикой, как Грасия. Новая карта кварталов официально закрепила название Вила-де-Грасия за старой частью, тогда как на севере Вальккарка-и-элс-Пенитентс и эль-Кол (отделившийся от Вальккарки) образуют второй центр района. Ещё два квартала — Камп-д'ан-Грассот-и-Грасия-Нова, более новый сектор, и ла-Салют."}, "es": {"name": "Gracia", "sub": "«Gracia»", "desc": ["Pocos distritos de Barcelona están rodeados de tanta simbología como el de Gràcia. El casco antiguo del barrio que le da nombre no ha dejado nunca de reivindicar con orgullo su pasado como municipio independiente (se agregó a la ciudad en 1897), y el nuevo mapa de barrios lo reconoce oficializando el topónimo Vila de Gràcia para denominar esta unidad de casi 50.000 habitantes, calles pequeñas y bulliciosas y numerosas plazas. En el norte, el otro centro neurálgico del distrito, Vallcarca, añade a la denominación tradicional el topónimo de la zona de los Penitents, por la vinculación histórica entre los dos territorios. Por el contrario, el Coll gana entidad propia como barrio y se separa de Vallcarca. Los otros dos barrios del distrito son los del Camp d’en Grassot i Gràcia Nova, un sector más reciente y, por este motivo, autónomo de la Vila, y el de la Salut. Los límites de este último barrio se han ampliado por ambos lados del tramo de la Travessera de Dalt, donde se está llevando a cabo un proyecto de reducción del tráfico que mejorará la comunicación entre los dos lados de esta vía."], "vibe": "Independiente de espíritu, obrera de raíz, hoy bohemia sin remedio."}, "ca": {"name": "Gràcia", "sub": "", "desc": ["Pocs districtes de Barcelona estan envoltats de tanta simbologia com el de Gràcia. El nucli antic del barri que li dona nom no ha deixat mai de reivindicar amb orgull el seu passat com a municipi independent (es va agregar a la ciutat el 1897), i el nou mapa de barris l'hi reconeix oficialitzant el topònim Vila de Gràcia per denominar aquesta unitat de gairebé 50.000 habitants, carrers petits i bulliciosos i nombroses places. Al nord, l’altre centre neuràlgic del districte, Vallcarca, afegeix a la denominació tradicional el topònim de la zona de Penitents, per la vinculació històrica entre tots dos territoris. Per contra, el Coll guanya entitat pròpia com a barri i se separa de Vallcarca. Els altres dos barris del districte són els del Camp d’en Grassot i Gràcia Nova, un sector més recent i, per aquest motiu, autònom de la Vila, i el de la Salut. Els límits d’aquest últim barri s’han ampliat pels dos costats del tram de la travessera de Dalt, on s’està portant a terme un projecte de reducció del trànsit que millorarà la comunicació entre les dues bandes d’aquesta via."], "vibe": "Independent d'esperit, obrera d'arrel, avui bohèmia sense remei."}, "ru": {"name": "Грасиа", "sub": "«Благодать»", "desc": ["Немногие районы Барселоны окружены таким множеством символов, как Грасия. Старый квартал, давший название всему району, никогда не переставал с гордостью отстаивать своё прошлое как независимого муниципалитета (он был присоединён к городу в 1897 году), и новая карта кварталов признаёт это, официально закрепляя за этой единицей, насчитывающей почти 50 000 жителей, с её маленькими оживлёнными улочками и многочисленными площадями, топоним Вила-де-Грасия. На севере другой ключевой центр района, Валькарка, добавляет к своему традиционному названию топоним зоны Пенитентс — из-за исторической связи между этими двумя территориями. Коль, напротив, обретает собственную идентичность как квартал и отделяется от Валькарки. Два других квартала района — это Камп-д'ен-Грассот-и-Грасия-Нова, более новый и потому самостоятельный по отношению к Виле сектор, и квартал Ла-Салют. Границы последнего были расширены по обе стороны участка Травессера-де-Далт, где сейчас реализуется проект по снижению интенсивности движения, который улучшит сообщение между двумя сторонами этой магистрали."], "vibe": "Независимая по духу, рабочая по корням, сегодня — безнадёжно богемная."}, "historia_url": "https://ajuntament.barcelona.cat/gracia/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/gracia/es/el-distrito-y-sus-barrios"}, "d7": {"num": 7, "color": "#7E93A8", "web1": "http://www.bcn.cat/horta-guinardo", "src": "https://en.wikipedia.org/wiki/Horta-Guinard%C3%B3", "ipa_ca": "OR-tuh gee-nuhr-DOH", "ipa_es": "OR-tah gee-nar-DOH", "landmarks": [["Sant Pau Recinto Modernista", "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/puntos-de-interes/sant-pau-recinto-modernista-92086008873", {"es": "antiguo hospital modernista, Patrimonio Mundial", "ca": "antic hospital modernista, Patrimoni Mundial", "ru": "бывшая модернистская больница, Всемирное наследие"}], ["Can Travi Nou", "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/puntos-de-interes/can-travi-nou-92086016065", {"es": "antigua masía catalana, hoy restaurante", "ca": "antiga masia catalana, avui restaurant", "ru": "старинная усадьба, теперь ресторан"}], ["La masía de Can Cortada", "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/puntos-de-interes/la-masia-de-can-cortada-94263110012", {"es": "masía de origen medieval", "ca": "masia d'origen medieval", "ru": "усадьба средневекового происхождения"}], ["El Pabellón de la República", "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/puntos-de-interes/el-pabellon-de-la-republica-92259121045", {"es": "réplica del pabellón de 1937, hoy biblioteca", "ca": "rèplica del pavelló de 1937, avui biblioteca", "ru": "реплика павильона 1937 года, теперь библиотека"}], ["La masía de Can Baró", "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/puntos-de-interes/la-masia-de-can-baro-99400390674", {"es": "masía del siglo XVIII", "ca": "masia del segle XVIII", "ru": "усадьба XVIII века"}]], "founding": {"es": "Con 1.192 hectáreas, Horta-Guinardó es el tercer distrito más extenso de Barcelona, situado en el sector noreste entre Gràcia y Nou Barris. Su estructura interna reúne una pluralidad de barrios heterogéneos, condicionados por unidades físicas muy marcadas como Collserola, la Vall d'Hebron o las lomas de la Rovira: el Guinardó, el Baix Guinardó, Can Baró, la Font d'en Fargues, el Carmel, la Teixonera, Horta, la Vall d'Hebron, Sant Genís dels Agudells, Montbau y la Clota.", "ca": "Amb 1.192 hectàrees, Horta-Guinardó és el tercer districte més extens de Barcelona, situat al sector nord-est entre Gràcia i Nou Barris. La seva estructura interna reuneix una pluralitat de barris heterogenis, condicionats per unitats físiques molt marcades com Collserola, la Vall d'Hebron o els turons de la Rovira: el Guinardó, el Baix Guinardó, Can Baró, la Font d'en Fargues, el Carmel, la Teixonera, Horta, la Vall d'Hebron, Sant Genís dels Agudells, Montbau i la Clota.", "ru": "Площадь Орта-Гинардо составляет 1192 га — это третий по величине район Барселоны, расположенный на северо-востоке между Грасией и Ноу-Баррис. Его внутренняя структура объединяет разнородные кварталы, сформированные заметными природными особенностями — Кольсеролой, долиной Валь-д'Эброн, холмами Ровира: Гинардо, Байш-Гинардо, Кан-Баро, ла-Фонт-д'ан-Фаргес, эль-Кармель, ла-Тейшонера, Орта, Валь-д'Эброн, Сан-Женис-делс-Агуделс, Монтбау и ла-Клота."}, "es": {"name": "Horta-Guinardó", "sub": "", "desc": ["Como ocurre en todas partes, lo que hoy constituye Horta-Guinardó es, geográficamente hablando, el resultado de la evolución de su territorio, tan marcado por la presencia del agua, y, sin duda, el poso de su evolución histórica, cargada de hitos singulares. Le proponemos conocer este desarrollo histórico a partir de los apartados que verá a continuación.", "<strong>Episodios históricos</strong>", "Horta-Guinardó es un territorio cargado de historia, de episodios singulares que han marcado el paso del tiempo, en lo que son sus barrios actuales. Hablamos de un compendio de acontecimientos, la gran mayoría con cientos de años a sus espaldas, muchos de ellos, destacados.", "A continuación le presentamos algunos de estos episodios históricos, elaborados para la publicación Barcelona Informació durante la primera década de este siglo XXI por Josep Maria Contel.", "<strong>La guerra de Sucesión en el Guinardó y en Horta</strong>", "Texto de Joan Corbera, miembro de El Pou. Grup d’Estudis de la Vall d’Horta i la Muntanya Pelada, sobre el desarrollo de la Guerra de Sucesión en los territorios del Guinardó y de Horta.", "Unos episodios poco estudiados y que tienen un valor muy importante para la historiografía de Horta-Guinardó.", "<strong>La situación de Horta</strong>", "El antiguo municipio de Horta, en el norte de la ciudad de Barcelona, tenía, en el momento de su anexión a la Ciudad Condal, el 1 de enero de 1904, un perímetro muy vasto y limitaba con los municipios, también independientes, de Sant Gervasi de Cassoles (suroeste), Gràcia (sur y sureste) y Sant Andreu de Palomar (este), ahora agregados a Barcelona, y con los de Cerdanyola y Sant Cugat del Vallès (norte).", "El territorio está centrado por un amplio valle, el valle de Horta, y queda cerrado a ambos lados de este por montes y colinas; en la vertiente septentrional están las vertientes de la sierra de Collserola, del Coll Serola, que da nombre a la sierra, en la vertiente de levante, hasta el Turó de les Roquetes (305 metros) hacia poniente, pasando por el Turó de Sant Genís (con la ermita de Sant Cebrià i Santa Justina), las colinas de Magarola y de Valldaura (422 metros), y el Coll de la Ventosa en la otra vertiente del valle, el Turó de la Creueta del Coll o d’en Falcó (249 metros), el Turó del Carmel (267 metros), separados por el Coll de Font-rúbia (antiguo nombre del santuario del Coll), el Turó de la Rovira (261 metros), con la Font d’en Fargues, montañas que han recibido el nombre de conjunto de la montaña Pelada, y más al noreste el Turó de la Peira (133 metros) o de Montadell, que suministró las piedras de los antiguos casales. Estas colinas, hasta hace pocos siglos, estaban repletas de árboles y de vegetación frondosa, con caza abundante, pero la acción del hombre las ha desnudado ha
