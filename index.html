sta convertirlas en terrenos urbanizados invadidos por las viviendas o zonas casi yermas.", "Las abundosas torrenteras van a parar a la riera de los Agudells —que por Vallcarca y el Putxet se continúa por el Torrent de l’Olla de Gràcia— o la riera de Horta, que tras recibir los torrentes de Valldaura, de Duran y de los Agudells, continúa por tierras de Sant Andreu de Palomar y hasta el mar. Estas torrenteras que alimentan el valle de Horta descienden de las vertientes de la sierra de Collserola y de la montaña Pelada.", "El antiguo término de Horta tuvo, inicialmente, dos centros de poblamiento, el de la parroquia rural de Sant Genís dels Agudells, consagrada ya el año 931, según Carreras i Candi una de las más pequeñas y pobres del territorio de Barcelona, situada en las vertientes de la sierra de Collserola —sector denominado sierra de los Agudells —, y su sufragánea de Sant Joan d’Horta, en el fondo del valle, mencionada desde 1095 y que a lo largo del siglo XIX tenía que tomar, por la expansión demográfica y urbana muy superior, la capitalidad eclesiástica y municipal en Sant Genís. Describiremos primero la historia y la evolución del núcleo de Horta, con los sectores de la Clota, la Font d’en Fargues y la Font del Gos, después los de Sant Genís dels Agudells, Vallcarca i els Penitents, Montbau, el parque de la Vall d’Hebron, el Carmel, el Coll y la Teixonera, que son los barrios o vecindarios que se han ido formando a lo largo del tiempo dentro del antiguo término municipal y que hoy forman un continuo urbano con el resto de la ciudad.", "<strong>Las familias</strong>", "Desde el siglo XIV se establecieron familias importantes, como los Vallseca, que a menudo fueron miembros del Consejo de Ciento de Barcelona, al igual que los Horta, y que dieron hombres ilustres, como el jurista y político Guillem de Vallseca (fallecido después de 1412), consejero jefe y embajador de los reyes. Se establecieron en la Torre Sobirana, el futuro Laberint, antes de Pere Marí, propiedad que pasó a los Desvalls. También construyeron casa en Horta los Llull, dueños de una gran parte de la Vilanova del Mar, con palacio en el Born; los Llobet, con palacio en la calle de Montcada; los Sapila; los Sitges; los Cervià; los Sabastida, y los Mariner, una familia de mucho prestigio sociopolítico.", "Después del Decreto de Nueva Planta, se regularon los nuevos municipios de la Administración borbónica, y Horta quedó sometida al municipio de Sant Genís dels Agudells, pero el crecimiento del núcleo de Horta hizo que, ya en el mismo siglo XVIII, la casa consistorial se levantara (1768) en la plaza de Santes Creus d’Horta, rehecha en 1896.", "En el escudo municipal figuraba, hasta la primera mitad del XIX, el nombre de Sant Genís dels Agudells d’Horta y los tres pájaros propios de Sant Genís, pero después ya perdió el nombre y las armas. En 1888, Horta tenía los distritos de Vallcarca, els Penitents, Sant Genís dels Agudells y el Coll, y en 1903, cuando fue anexionado, comprendía, además de Horta, los barrios de la Clota, el Coll, Vallcarca, Sant Genís y els Penitents.", "En el siglo XVIII se produjo una recuperación económica general en el país que incidió especialmente en Barcelona y en los pueblos de los alrededores. Horta tenía en su término municipal una amplia población dispersa entre campos y viñas, y había masías al lado de las casas de nobles y fabricantes.", "Entre las actividades económicas, aparte de las tradicionales agropecuarias, que dotaron de una nueva vitalidad al barrio, la más característica fue la de las lavanderas, las mujeres que se dedicaban a lavar la ropa de la gente de Barcelona, a las que iba ligada toda una industria relacionada con la ropa y el agua. La industria de la piel estuvo representada por la Adoberia de Barcelona, de la empresa Deu i Companyia (1789), instalada en Can Fontaner, antigua casa de recreo, y otras curtidurías, y también hubo fábricas de almidón.", "Según la respuesta al cuestionario de F. de Zamora, en 1789 trabajaban en la curtiduría 26 personas, y había, además, 36 cosecheros, 320 jornaleros, 5 artesanos, 2 médicos, 2 cirujanos, 1 boticario y 16 menestrales (2 maestros de obras, 2 carpinteros, 2 maestros de carros, 2 cerrajeros, 2 alpargateros, 3 tejedores, 1 sastre, 1 zapatero y 1 barbero). Es decir, la actividad de lavanderas y peleteros fue la predominante hasta principios del siglo XX, y de la piel derivaron zapateros, guarnicioneros, guanteros y encuadernadores. Pero Horta no fue nunca un pueblo industrial, sino agrícola, y hoy la economía de la población gira en torno a los pequeños tenderos y los profesionales liberales, o administrativos, directivos y técnicos, y, sobre todo, constituye un barrio dormitorio de tipo semirresidencial.", "<strong>Lavanderas y albañiles</strong>", "En los acontecimientos de tipo político y social de la historia contemporánea del barrio, podemos destacar la repercusión de los hechos de la Semana Trágica de 1909, cuando los sublevados se replegaron hacia Sant Andreu y Horta y quemaron el convento de las dominicanas y la vieja iglesia de Sant Joan. El ambiente de los años veinte fue muy tenso, y tuvo relevancia la Sociedad de Albañiles de Horta, de izquierdas y anarquista (los albañiles de Horta disfrutaban de renombre en todo el llano de Barcelona). Después de los años oscuros de la dictadura, cuando serían clausurados el Centro Catalán y otros grupos y partidos políticos, la república aportó un avivamiento, reflejado en publicaciones como La Vall d'Horta, El boletín o La Peira. El carácter residencial hizo que la población presentara durante la Guerra Civil una relativa normalidad (los primeros incidentes tuvieron lugar en las calles de Fulton y de Horta, a causa de la FAI, que ocupaba la masía de Can Querol), y la posguerra fue igualmente tranquila hasta la gran oleada inmigratoria de los años 1950-60, que comportó grandes transformaciones sociológicas.", "El núcleo urbano de la población de Horta se formó a partir del siglo XVI en torno a la plaza Major, hoy de Santes Creus, donde los jornaleros se agrupaban para repartirse en la subasta de la bolsa de trabajo. El momento de la expansión de la segunda mitad del siglo XIX, cuando consiguió la independencia municipal, tuvo lugar a lo largo de la calle Major, y aumentó con la instalación de las colonias de veraneo (la primera en la rambla de Cortada, hoy de Campoamor) y la construcción de nuevas torres a partir de la epidemia de fiebre amarilla de 1870, que convirtieron la población en núcleo residencial de la pequeña burguesía barcelonesa.", "De 1845 al principio del siglo la población pasó de 1.855 habitantes a 6.035, y muchos propietarios de masías y tierras vendieron las propiedades como solares para la construcción. Después de 1904 se empedró la calle Major (desde la riera de la calle de Castelló) y se urbanizó la plaza de Eivissa, que ha desplazado la de Santes Creus como centro urbano. Las calles más características de la parte antigua son la rambla de Cortada, la calle de Feliu i Codina, de Salses, del Canigó y del Mestre Dalmau. La sustitución de las casas de planta baja por bloques de pisos ha representado, además de la pérdida del carácter tradicional, una densidad demográfica que ha hecho insuficientes los equipamientos.", "La iglesia parroquial de Sant Joan d’Horta tuvo su primitivo emplazamiento al lado de Can Cortada (queda el nombre de calle de la Església), en el norte del centro del núcleo urbano (quemada el último día de la Semana Trágica, se conservó hasta bien entrado el siglo). En 1905 el cardenal Casañas bendijo la colocación de la primera piedra de un nuevo templo en el lugar actual, más céntrico, que se inauguró en parte en 1911 y se acabó en 1917. Incendiado y devastado en julio de 1936, fue totalmente reconstruido en la posguerra en un neogótico modernizando, y no alcanzó el aspecto definitivo hasta 1980, cuando fue inaugurado el portalón y el tímpano de la fachada, obra del pintor J. Torras i Viver, que también decoró el interior.", "<strong>Urbanismo</strong>", "Aparte de las torres modernistas que quedan, las mejores en la calle de Campoamor, tienen un gran interés las antiguas masías, unas cuarenta y cinco, algunas de campesino y otras de nobles y gente adinerada, de las que quedan unas diez.", "Can Cortada, al final de la calle de Campoamor, es una vieja construcción medieval, antigua torre fortificada, que corresponde a la fundada por la familia Horta, cuyos propietarios, los Oriola Cortada, condes de la Vall de Merlès, tenían el patronato de la iglesia de Sant Joan; conserva ventanales góticos de épocas diferentes y en su subsuelo han aparecido restos de una villa romana. Can Querol, en el paseo de Maragall, cerca de las calles de Petrarca y de Sant Alexandre, es un edificio del siglo XVIII de planta cuadrada con bonitos esgrafiados, reformado y ampliado, que alberga la residencia para personas mayores de la Fundación Valldejuli. Can Fargas, en la calle de Frederic Rahola, cerca del paseo de Maragall y de la calle de Peris i Mencheta, está mencionada ya en 1300 y es propiedad de los Fargas de Casanovas desde 1734; es un notable edificio con una amplia galería y grandes contrafuertes, rodeado de pinos. Can Mariner está en la calle de Horta, esquina con la del Vent: restaurada en 1950, es una de las masías más grandes y bien conservadas. También hay que mencionar Ca n’Andalet, sede del centro territorial de Barcelona Activa en Horta-Guinardó, en la Clota; Can Carabassa, edificio neoclásico, sede del colegio SAFA; Can Masdeu, Can Notari, Ca la Sínia, Can Papanaps, Can Travi Vell, Can Travi Nou, Can Santgenís...", "Los jardines del Laberint forman un notable conjunto, actualmente propiedad del municipio de Barcelona, en torno a una antigua mansión de los Vallseca y después de los Roger, que pasó en el siglo XVIII a los Desvalls, marqueses del Poal y de Llupià, y después de Alfarràs (quedan vestigios de la antigua Torre Sobirana detrás del palacio construido el siglo pasado, con fachada neomusulmana). Los jardines fueron creados a partir de 1793 por Joan Antoni Desvalls i d’Ardena (que fue un destacado matemático y científico) con la ayuda del maestro de obras Andreu Valls según los planos del ingeniero italiano Domenico Bagutti; el círculo de cipreses y las conducciones de agua son del 1797-1799 y fue decorado con esculturas, un templete y balaustres. Los jardines están situados en el paseo de la Vall d’Hebron, en el norte del antiguo pueblo (paseo que recorre la llamada carretera de Cornellà a Fogars de Tordera, abierta en 1869), al pie de Collserola, entre las Llars Mundet y el acceso a Can Papanaps. Actualmente son un jardín museo, y en una parte del edificio hay oficinas del Instituto Municipal de Parques y Jardines.", "También cerca de las Llars Mundet está el Palau de les Heures (o Can Gallart), residencia con cuatro torres redondas coronadas por picos cónicos, al estilo de los châteaux franceses, construido en 1895-1898 según los planos de August Font i Carreras para el naviero Gallart, que contenía un espléndido mobiliario y notables obras de arte; actualmente es propiedad de la Diputación de Barcelona y constituye un anexo de las Llars Mundet. Acoge la Fundación Bosch i Gimpera.", "La Torre de la Granja Vella, que había pertenecido a Joan Sabastida (siglo XV), pasó a propiedad de los jerónimos de la Vall d’Hebron y, después de la desamortización, pasó al banquero Lluis Martí i Codolar, que estableció una granja agrícola, jardines y parques e, incluso, un zoológico (núcleo inicial del Zoo de Barcelona); Don Bosco la visitó en 1885 y fue cedida poco después a los salesianos.", "<strong>Entidades</strong>", "Entre las entidades de tipo cultural y asociativo que han centrado la vida del barrio mencionamos, en primer lugar, el Centre Parroquial dels Lluïsos, fundado en 1866 en Cal Xicus (calle Baix de Mariner) por mosén Lluís Cantarella, que se ha convertido en uno de los centros más activos, con secciones de excursionismo, fotografía, biblioteca, centro literario y teatral. De los organismos filiales, destacan el Esbart de Horta, fundado por Josep M. Castells i Andilla, y el  Grupo de Estudios Teatrales de Horta, nacidos bajo la iniciativa de Josep Montanyès en 1964, que han tenido resonancia en todo el país. El Ateneu fue fundado en 1868 con el nombre de Círcol Hortenc y dispone de biblioteca, sección de ajedrez, sala de actividades artísticas, etcétera. La Vanguardia Obrera, fundada en 1894 para subir el nivel cultural de sus asociados, formó parte del movimiento cooperativo catalán a través de la Federación de Cooperativas de Consumo y otras entidades; dependieron de ella escuelas, secciones de música, deportes, etcétera.", "El Foment es una entidad muy arraigada en Horta. Fue fundado en 1887 como continuación de la Societat Casino Familiar de la plaza de Santes Creus, y en 1917, con el nombre de Foment Hortenc, se instaló en el local de la calle Alt de Mariner (edificio de Pere Serra i Pau), que fue destruido por el fuego en 1946 y se reconstruyó en 1948; tiene sala de reuniones, conferencias y exposiciones y dispone de una biblioteca, y dependen de él un buen número de grupos de teatro.", "Otras entidades se dedican más intensamente al deporte, como el Club de Tenis Horta (de 1912), en terrenos de la iglesia vieja, la Unión Atlética Horta, la Unión Deportiva de Horta y la Unión Excursionista de Horta, que al mismo tiempo también cumplen una función de tipo cívico y cultural.", "Entre los centros asistenciales, muy numerosos en Horta y que rebasan completamente el ámbito del barrio, mencionamos, en primer lugar, la Institución o Patronato Ribas, asilo de huérfanos fundado por Lluís Ribas i Regordosa, en un edificio del arquitecto Enric Sagnier, rodeado de jardines, hoy instituto de formación profesional y de bachillerato. Entre las Heures y el Laberint está el gran complejo asistencial centrado por las Llars Anna Gironella de Mundet, que ha recogido muchas de las instalaciones de la Casa de Caridad de Barcelona. Ya en 1915 la Diputación de Barcelona instaló, gracias al apoyo económico de la Fundación Albà (instituida por Miquel Albà i Andreu), un centro hospitalario con este nombre, en la antigua Torre dels Frares, y un edificio construido por Francesc de Paula del Villar i Carmona (acabado por Bonaventura Bassegoda). La donación de Artur Mundet i Carbó (1954) impulsó a la Diputación de Barcelona a construir este conjunto asistencial, a partir de un edificio inacabado de 1927 y nuevos pabellones, obra del arquitecto Manuel Baldrich, para residencia de personas mayores y también escuelas y centros de reeducación de niños. Los edificios están adornados con obras de prestigiosos pintores y escultores (Subirachs, Clarà, E. Sierra, Tharrats, Guinovart, etcétera). El Hospital de Sant Rafael, especializado en niños, se encuentra sobre el paseo de la Vall d’Hebron (hasta 1967, en Les Corts). A su lado está la gran Ciudad Sanitaria de la Vall d’Hebron, con un conjunto de 2.300 camas y ambulatorio, una de las más grandes y bien equipadas del Estado. Cerca, en el sector de Can Papanaps, está el Instituto Municipal de Psiquiatría, construido a partir de 1971.", "En el campo de la enseñanza, Horta tiene una buena tradición que arranca del trabajo de un maestro prestigioso, Francesc Comerma i Bachs, maestro en el común y autor de libros pedagógicos, como Espigues i roselles (1875) y Lo libre de la infantesa (1879), y de la labor de algunas escuelas laicas, como las escuelas de la cooperativa la Vanguardia Obrera, renovadas, que se mantuvieron hasta 1975. De las estatales, debe destacarse la Escuela Unitària fundada en 1906 y que estaba situada en el edificio del antiguo Ayuntamiento de Horta en la plaza de Santes Creus, hoy en día, centro de servicios sociales. Fue interesante la escuela que funcionó durante la Guerra Civil en Can Glòria, la Escuela Productiva, donde los mismos alumnos explotaban y comercializaban tierras de labranza. Entre las confesionales, destaca la Escuela Parroquial creada en 1904 por mosén Josep Bundó i Vidal, de sensibilidad muy catalana y arraigada en el pueblo, que pasó en 1912 a los hermanos de la Doctrina Cristiana (Escuelas La Salle-Horta). El colegio de las dominicanas de la Anunciata, creado en 1878, cuenta también con una buena tradición (fue visitado por Maria Montessori). En 1913 se inauguró la École Ménagère, primera escuela del hogar en el Estado español."], "vibe": "Huertas que regaban toda Barcelona, ahora cubiertas de escaleras y miradores."}, "ca": {"name": "Horta-Guinardó", "sub": "", "desc": ["Com passa a tot arreu, el que és avui Horta-Guinardó és, geogràficament parlant, el resultat de l'evolució del seu territori (tan marcat per la presència de l'aigua) i, sens dubte, el pòsit de la seva evolució històrica, carregada de fites singulars. Us proposem conèixer aquest desenvolupament històric a partir dels apartats que veureu a continuació.", "<strong>Episodis històrics</strong>", "Horta-Guinardó és un territori carregat d’història, d’episodis singulars que han marcat el pas del temps en el que són els seus barris actuals. Parlem d’un compendi d’esdeveniments, la gran majoria amb centenars d’anys a l’esquena, molts d’ells destacats.", "A continuació us presentem alguns d’aquests episodis històrics, elaborats per a la publicació Barcelona Informació durant la primera dècada d’aquest segle XXI per Josep Maria Contel.", "<strong>La guerra de Successió al Guinardó i Horta</strong>", "Text de Joan Corbera, membre d’El Pou, Grup d’Estudis de la Vall d’Horta i la Muntanya Pelada, sobre el desenvolupament de la guerra de Successió als territoris del Guinardó i Horta.", "Uns episodis poc estudiats i que tenen un valor molt important per a la historiografia d’Horta-Guinardó.", "<strong>La situació d'Horta</strong>", "L'antic municipi d'Horta, al nord de la ciutat de Barcelona, tenia, en el moment de la seva annexió a la ciutat comtal, el primer de gener del 1904, un perímetre molt vast i limitava amb els municipis, també independents, de Sant Gervasi de Cassoles (sud-oest), Gràcia (sud i sud-est), Sant Andreu de Palomar (est), ara agregats a Barcelona, i amb els de Cerdanyola i Sant Cugat del Vallès (nord).", "El territori és centrat per una àmplia vall, la vall d'Horta, i tancat a banda i banda d'aquesta per puigs i turons; al vessant septentrional hi ha els vessants de la serra de Collserola, del coll Serola, que dona nom a la serra, a llevant, fins al turó de les Roquetes (305 metres) a ponent, passant pel turó de Sant Genís (amb l'ermita de Sant Cebrià i Santa Justina), els turons de Magarola i de Valldaura (422 metres), i el coll de la Ventosa a l'altre vessant de la vall, el turó de la Creueta del Coll o d'en Falcó (249 metres), el turó del Carmel (267 metres), separats pel coll de Font-rúbia (antic nom del santuari del Coll), el turó de la Rovira (261 metres), amb la Font d'en Fargas, muntanyes que han rebut el nom de conjunt de la muntanya Pelada, i més al nord-est el turó de la Peira (133 metres) o de Montadell, que va fornir les pedres dels antics casals. Aquests turons, fins fa pocs segles, eren plens d'arbres i de vegetació frondosa, amb caça abundant, però l'acció de l'home els ha despullat fins a convertir-los en terrenys urbanitzats envaïts pels habitatges o zones quasi ermes.", "Les abundoses torrenteres van a parar a la riera dels Agudells —que per Vallcarca i el Putxet es continua pel torrent de l'Olla de Gràcia— o la riera d'Horta, que després de rebre els torrents de Valldaura, de Duran i dels Agudells, continua per terres de Sant Andreu de Palomar i fins al mar. Aquestes torrenteres que alimenten la vall d'Horta davallen dels vessants de la serra de Collserola i de la muntanya Pelada.", "L'antic terme d'Horta va tenir, inicialment, dos centres de poblament, el de la parròquia rural de Sant Genís dels Agudells, consagrada ja el 931, segons Carreras i Candi una de les més petites i pobres del territori de Barcelona, situada als vessants de la serra de Collserola —sector anomenat serra dels Agudells —, i la seva sufragània de Sant Joan d'Horta, al fons de la vall, esmentada des del 1095 i que al llarg del segle XIX havia de prendre, per l’expansió demogràfica i urbana molt superior, la capitalitat eclesiàstica i municipal a Sant Genís. Descriurem primer la història i l'evolució del nucli d'Horta, amb els sectors de la Clota, la Font d'en Fargas i la Font del Gos, després els de Sant Genís dels Agudells, Vallcarca i els Penitents, Montbau, el parc de la Vall d'Hebron, el Carmel, el Coll i la Teixonera, que són els barris o veïnats que s'han anat formant al llarg del temps dins l'antic terme municipal i que avui formen un continu urbà amb la resta de la ciutat.", "<strong>Les famílies</strong>", "Des del segle XIV s’hi van establir famílies importants, com els Vallseca, que sovint van ser membres del Consell de Cent de Barcelona, igual que els Horta, i que van donar homes il·lustres, com el jurista i polític Guillem de Vallseca (mort després del 1412), conseller en cap i ambaixador dels reis. Es van establir a la Torre Sobirana, el futur Laberint, abans de Pere Marí, propietat que va passar als Desvalls. També van bastir casa a Horta els Llull, amos d’una gran part de la Vilanova de la Mar, amb palau al Born; els Llobet, amb palau al carrer de Montcada, els Sapila, els Sitges, els Cervià, els Sabastida i els Mariner, família d’un gran prestigi sociopolític.", "Després del Decret de Nova Planta, es van regular els nous municipis de l’Administració borbònica, i Horta va quedar sotmesa al municipi de Sant Genís dels Agudells, però el creixement del nucli d’Horta va fer que, ja al mateix segle XVIII, la casa consistorial s’aixequés (1768) a la plaça de Santes Creus d’Horta, refeta el 1896.", "L’escut municipal fins a la primera meitat del XIX portava el nom de Sant Genís dels Agudells d’Horta i els tres ocells propis de Sant Genís, però després ja va perdre el nom i les armes. El 1888, Horta tenia els districtes de Vallcarca, els Penitents, Sant Genís dels Agudells i el Coll, i el 1903, quan va ser annexionat, comprenia, a més d’Horta, els barris de la Clota, el Coll, Vallcarca, Sant Genís i els Penitents.", "Al segle XVIII es va produir una recuperació econòmica general al país que va incidir especialment a Barcelona i als pobles de la rodalia. Horta tenia dins el seu terme municipal un ampli poblament dispers entre camps i vinyes, i les masies feien costat a les cases de nobles i fabricants.", "Entre les activitats econòmiques, a part de les tradicionals agropecuàries, que van donar una nova vitalitat al barri, la més característica va ser la de les bugaderes, les dones que es dedicaven a rentar la roba de la gent de Barcelona, amb les quals anava lligada tota una indústria relacionada amb la roba i l’aigua. La indústria de la pell va estar representada per l’Adoberia de Barcelona, de l’empresa Deu i Companyia (1789), instal·lada a Can Fontaner, antiga casa d’esbarjo, i altres adoberies, i també hi va haver fàbriques de midó.", "Segons la resposta al qüestionari de F. de Zamora, el 1789 treballaven a l’adoberia 26 persones, i hi havia, a més, 36 colliters, 320 jornalers, 5 artesans, 2 metges, 2 cirurgians, 1 apotecari, 16 menestrals (2 mestres d’obres, 2 fusters, 2 mestres de carros, 2 manyans, 2 espardenyers, 3 teixidors, 1 sastre, 1 sabater i 1 barber). És a dir, que l’activitat de bugaderes i pellaires va ser la predominant fins a l’inici del segle XX, i de la pell en van derivar sabaters, guarnicioners, guanters i relligadors. Però Horta no va ser mai un poble industrial, sinó agrícola, i avui l’economia de la població gira al voltant dels petits botiguers, els professionals liberals, o administratius, directius i tècnics i, sobretot, constitueix un barri dormitori de tipus semiresidencial.", "<strong>Bugaderes i paletes</strong>", "En els esdeveniments de tipus polític i social de la història contemporània del barri, podem destacar la repercussió dels fets de la Setmana Tràgica del 1909, quan els revoltats es replegaren vers Sant Andreu i Horta i cremaren el convent de les dominicanes i la vella església de Sant Joan. L'ambient dels anys vint fou molt tens, i hi tingué rellevància la Societat de Paletes d'Horta, de caire esquerrà i anarquista (els paletes d'Horta gaudien d'anomenada a tot el pla de Barcelona). Després dels anys foscos de la dictadura, quan foren clausurats el Centre Català i altres grups i partits polítics, la república aportà una revifalla, reflectida en publicacions com La Vall d'Horta, El boletín o La Peira . El caràcter residencial feu que la població presentés durant la Guerra Civil una relativa normalitat (els primers incidents tingueren lloc als carrers de Fulton i d'Horta, a causa de la FAI, que ocupava la masia de Can Querol), i la postguerra fou igualment tranquil·la fins a la gran onada immigratòria dels anys 1950-60, que comportà unes grans transformacions sociològiques.", "El nucli urbà de la població d'Horta es formà a partir del segle XVI a l'entorn de la plaça Major, avui de Santes Creus, on s'agrupaven els jornalers per repartir-se en la subhasta de la borsa de treball. El moment de l'expansió de la segona meitat del segle XIX, quan aconseguí la independència municipal, es feu al llarg del carrer Major, i augmentà amb la instal·lació de les colònies d'estiueig (la primera a la rambla de Cortada, avui de Campoamor) i la construcció de noves torres a partir de l'epidèmia de febre groga del 1870, que convertiren la població en nucli residencial de la petita burgesia barcelonina.", "Del 1845 al començament del segle la població passà de 1.855 habitants a 6.035 habitants, i molts propietaris de masies i terres vengueren les propietats com a solars per a la construcció. Després del 1904 s'empedrà el carrer Major (des de la riera del carrer de Castelló) i s'urbanitzà la plaça d'Eivissa, que ha desplaçat la de Santes Creus com a centre urbà. Els carrers més característics de la part antiga són la rambla de Cortada, el carrer de Feliu i Codina, de Salses, del Canigó i del Mestre Dalmau. La substitució de les cases de planta baixa per blocs de pisos ha representat, a més de la pèrdua del caràcter tradicional, una densitat demogràfica que ha fet insuficients els equipaments.", "L'església parroquial de Sant Joan d'Horta tingué el primitiu emplaçament al costat de Can Cortada (resta el nom de carrer de l'Església), al nord del centre del nucli urbà (cremada el darrer dia de la Setmana Tràgica, es conservà fins ben entrat el segle). El 1905 el cardenal Casañas beneí la col·locació de la primera pedra d'un nou temple a l'indret actual, més cèntric, que s'inaugurà en part el 1911 i s'acabà el 1917. Incendiat i devastat el juliol del  1936, fou totalment reconstruït a la postguerra en un neogòtic modernitzant, i no aconseguí l'aspecte definitiu fins al 1980, quan fou inaugurada la portalada i el timpà de la façana, obra del pintor J. Torras i Viver, que també en decorà l'interior.", "<strong>Urbanisme</strong>", "A part les torres modernistes que resten, les millors al carrer de Campoamor, tenen un gran interès les antigues masies, unes quaranta-cinc, algunes de pagès i altres de nobles i gent adinerada, de les quals en resten unes deu.", "Can Cortada, al final del carrer de Campoamor, és una vella construcció medieval, antiga torre fortificada, que correspon a la fundada per la família Horta, els propietaris de la qual, els Oriola Cortada, comtes de la Vall de Merlès, tenien el patronat de l'església de Sant Joan; conserva finestrals gòtics d'èpoques diferents; en el seu subsol han aparegut restes d'una vil·la romana. Can Querol, al passeig de Maragall, prop dels carrers de Petrarca i de Sant Alexandre, és un edifici del segle XVIII de planta quadrada amb bonics esgrafiats, reformat i ampliat, que estatja la residència per a persones grans de la Fundació Valldejuli. Can Fargas, al carrer de Frederic Rahola, prop del passeig de Maragall i del carrer de Peris i Mencheta, és esmentada ja el 1300 i és propietat dels Fargas de Casanovas des del 1734; és un notable edifici amb una àmplia galeria i grans contraforts, envoltat de pins; Can Mariner és al carrer d'Horta cantonada amb el del Vent: restaurada el 1950, és una de les masies més grans i ben conservades. També cal esmentar Ca n'Andalet, seu del centre territorial de Barcelona Activa a Horta-Guinardó, a la Clota; Can Carabassa, edifici neoclàssic seu del col·legi SAFA; Can Masdeu, Can Notari, Ca la Sínia, Can Papanaps, Can Travi Vell, Can Travi Nou, Can Santgenís...", "Els jardins del Laberint formen un notable conjunt, actualment de propietat del municipi de Barcelona, al voltant d'una antiga mansió dels Vallseca i després dels Roger, que passà al segle XVIII als Desvalls, marquesos del Poal i de Llupià, i després d'Alfarràs (resten vestigis de l'antiga Torre Sobirana darrere el palau construït al segle passat, amb façana neomusulmana); els jardins foren creats a partir del 1793 per Joan Antoni Desvalls i d'Ardena (que fou un destacat matemàtic i científic) amb l'ajuda del mestre d'obres Andreu Valls i segons plans de l'enginyer italià Domenico Bagutti; el cercle de xiprers i les conduccions d'aigua són del 1797-1799 i fou decorat amb escultures, un templet i balustres. Els jardins estan situats al passeig de la Vall d'Hebron, al nord de l'antic poble (passeig que ressegueix l'anomenada carretera de Cornellà a Fogars de Tordera, oberta el 1869), al peu de Collserola, entre les Llars Mundet i l'accés a Can Papanaps. Actualment són un jardí museu, i en una part de l'edifici hi ha oficines de l'Institut Municipal de Parcs i Jardins.", "També prop de les Llars Mundet hi ha el Palau de les Heures (o Can Gallart), residència amb quatre torres rodones coronades per pics cònics, a l'estil dels châteaux francesos , construït el 1895-1898 segons plans d'AAugust Font i Carreras per al navilier Gallart, que contenia un esplèndid mobiliari i notables obres d'art; actualment és propietat de la Diputació de Barcelona i constitueix un annex de les Llars Mundet. Acull la Fundació Bosch i Gimpera.", "La Torre de la Granja Vella, que havia pertangut a Joan Sabastida (segle XV), passà a propietat dels jerònims de la Vall d'Hebron i, després de la desamortització, passà al banquer Lluis Martí i Codolar, que hi establí una granja agrícola, jardins i parcs i, fins i tot, un zoològic (nucli inicial del Zoo de Barcelona); Don Bosco la visità el 1885 i fou cedida poc després als salesians.", "<strong>Les entitats</strong>", "Entre les entitats de tipus cultural i associatiu que han centrat la vida del barri, esmentem en primer lloc el Centre Parroquial dels Lluïsos, fundat el 1866 a Cal Xicus (carrer Baix de Mariner) per mossèn Lluís Cantarella, que ha esdevingut un dels centres més actius, amb seccions d'excursionisme, fotografia, biblioteca, centre literari i teatral. Dels organismes filials, en destaquen l'Esbart d'Horta, fundat per Josep M. Castells i Andilla, i els Grup d'Estudis Teatrals d'Horta, nascuts sota la iniciativa de Josep Montanyès el 1964, que han tingut ressò a tot el país. L'Ateneu fou fundat el 1868 amb el nom de Círcol Hortenc i disposa de biblioteca, secció d'escacs, sala d'activitats artístiques, etc. La Vanguardia Obrera , fundada el 1894 per a pujar el nivell cultural dels seus associats, formà part del moviment cooperatiu català a través de la Federació de Cooperatives de Consum i altres entitats; en depengueren escoles, seccions de música, esports, etc.", "El Foment és una entitat molt arrelada a Horta; fou fundada el 1887 com a continuació de la Societat Casino Familiar de la plaça de Santes Creus i el 1917, amb el nom de Foment Hortenc, s'instal·là al local del carrer Alt de Mariner (edifici de Pere Serra i Pau); destruït pel foc el 1946, es reconstruí el 1948 i té sala de reunions, conferències i exposicions i disposa d'una biblioteca; en depenen un bon nombre de grups de teatre.", "Altres entitats es dediquen més intensament a l'esport, com el Club de Tennis Horta (del 1912), en terrenys de l'església vella, la Unió Atlètica Horta, la Unió Esportiva d'Horta, la Unió Excursionista d'Horta, que alhora també compleixen una funció de tipus cívic i cultural.", "Entre els centres assistencials, molt nombrosos a Horta i que depassen completament l'àmbit del barri, esmentem primerament la Institució o Patronat Ribas, asil d'orfes fundat per Lluís Ribas i Regordosa, edifici de l'arquitecte Enric Sagnier, envoltat de jardins, avui institut de formació professional i de batxillerat; entre les Heures i el Laberint hi ha el gran complex assistencial centrat per les Llars Anna Gironella de Mundet, que ha recollit moltes de les instal·lacions de la Casa de Caritat de Barcelona; ja el 1915 la Diputació de Barcelona instal·là, gràcies al suport econòmic de la Fundació Albà (instituïda per Miquel Albà i Andreu), un centre hospitalari d'aquest nom, a l'antiga Torre dels Frares, i un edifici bastit per Francesc de Paula del Villar i Carmona (acabat per Bonaventura Bassegoda); la donació d'Artur Mundet i Carbó (1954) impulsà la Diputació de Barcelona a bastir aquest conjunt assistencial, a partir d'un edifici inacabat del 1927 i nous pavellons, obra de l'arquitecte Manuel Baldrich, per a residència de gent gran i també escoles i centres de reeducació d'infants; els edificis són ornats amb obres de bons pintors i escultors (Subirachs, Clarà, E. Serra, Tharrats, Guinovart, etc.); l'Hospital de Sant Rafael, especialitzat en infants, es troba damunt el passeig de la Vall d'Hebron (fins al 1967, a les Corts); al seu costat hi ha la gran Ciutat Sanitària de la Vall d'Hebron, amb un conjunt de 2.300 llits i ambulatori, una de les més grans i ben equipades de l'Estat. Prop, al sector de Can Papanaps, hi ha l'Institut Municipal de Psiquiatria, bastit a partir del 1971.", "En el camp de l'ensenyament, Horta té una bona tradició que arrenca de la labor d'un mestre prestigiós, Francesc Comerma i Bachs, mestre al comú i autor de llibres pedagògics, com Espigues i roselles (1875) i Lo libre de la infantesa (1879), i de la labor d'algunes escoles laiques, com les escoles de la cooperativa la Vanguardia Obrera, renovades, que es van mantenir fins al 1975. De les estatals, s'ha de destacar l'Escola Unitària fundada el 1906 i que estava situada a l'edifici de l'antic Ajuntament d'Horta a la plaça de Santes Creus, avui dia, Centre de Serveis Socials. Fou interessant l'escola que funcionarà durant la Guerra Civil a Can Glòria, l'Escola Productiva, on els mateixos alumnes explotaven i comercialitzaven terres de conreu. Entre les confessionals, destaca l'Escola Parroquial creada el 1904 per mossèn Josep Bundó i Vidal, de sensibilitat molt catalana i arrelada al poble, que passà el 1912 als germans de la Doctrina Cristiana (Escoles La Salle - Horta). El col·legi de les dominicanes de l'Anunciata, creat el 1878, té també una bona tradició (fou visitat per Maria Montessori). El 1913 s'inaugurà l'École Ménagère, primera escola de la llar a l'Estat espanyol."], "vibe": "Horts que regaven tot Barcelona, ara coberts d'escales i miradors."}, "ru": {"name": "Орта-Гинардо", "sub": "", "desc": ["Как и повсюду, то, что сегодня представляет собой Орта-Гинардо, географически является результатом эволюции своей территории, столь отмеченной присутствием воды, и, без сомнения, отпечатком своего исторического развития, насыщенного примечательными вехами. Предлагаем вам познакомиться с этим историческим развитием через разделы, представленные ниже.", "<strong>Исторические эпизоды</strong>", "Орта-Гинардо — территория, насыщенная историей, отмеченными временем эпизодами, составляющими нынешние кварталы района. Речь идёт о своде событий, подавляющее большинство которых насчитывает сотни лет, причём многие из них весьма примечательны.", "Ниже мы представляем некоторые из этих исторических эпизодов, подготовленных для издания Barcelona Informació в первом десятилетии этого XXI века Жузепом Марией Контелем.", "<strong>Война за испанское наследство в Гинардо и Орте</strong>", "Текст Жуана Корберы, члена объединения El Pou. Grup d'Estudis de la Vall d'Horta i la Muntanya Pelada, посвящённый ходу войны за испанское наследство на территориях Гинардо и Орты.", "Малоизученные эпизоды, имеющие, однако, очень большое значение для историографии Орта-Гинардо.", "<strong>Положение Орты</strong>", "Старинный муниципалитет Орта, на севере города Барселоны, на момент своего присоединения к Городу-графству, 1 января 1904 года, обладал весьма обширным периметром и граничил с также независимыми тогда муниципалитетами Сант-Жервази-де-Касолес (юго-запад), Грасия (юг и юго-восток) и Сант-Андреу-де-Паломар (восток) — ныне присоединёнными к Барселоне, — а также с Серданьолой и Сант-Кугат-дель-Вальес (север).", "Территорию центрирует обширная долина — долина Орта, — замкнутая с обеих сторон горами и холмами; на северном склоне тянутся отроги горного массива Кольсерола, от Коль-Сероллы, давшей имя всему массиву, со стороны востока и до Туро-де-лес-Рокетес (305 м) в сторону запада, проходя через Туро-де-Сант-Женис (с часовней Сант-Себриа-и-Санта-Жустина), холмы Магарола и Вальдаура (422 м) и Коль-де-ла-Вентоса на другом склоне долины — Туро-де-ла-Крееута-дель-Коль, или д'ен-Фалько (249 м), Туро-дель-Кармель (267 м), разделённые Коль-де-Фонт-рубия (старинное название святилища Коля), Туро-де-ла-Ровира (261 м) с источником Фон-д'ен-Фаргес — горы, вместе получившие название Монтанья-Пелада, а ещё дальше на северо-восток — Туро-де-ла-Пейра (133 м), или Монтадель, откуда добывали камень для старинных особняков. Эти холмы вплоть до недавних веков были покрыты густыми лесами и растительностью, изобиловали дичью, однако деятельность человека оголила их, превратив в застроенные территории, занятые жильём, либо в почти пустоши.", "Обильные потоки воды стекают в русло Агудельс — которое через Валькарку и Путчет продолжается как Торрент-де-л'Олья-де-Грасия — либо в русло Орта, которое, приняв воды потоков Вальдаура, Дуран и Агудельс, продолжается по землям Сант-Андреу-де-Паломар и достигает моря. Эти потоки, питающие долину Орта, стекают со склонов горного массива Кольсерола и горы Пелада.", "У старинной территории Орта изначально было два центра расселения: сельский приход Сант-Женис-делс-Агудельс, освящённый ещё в 931 году, по свидетельству Каррераса-и-Канди — один из самых маленьких и бедных на территории Барселоны, расположенный на склонах массива Кольсерола (в секторе, называемом горами Агудельс), и его викариат Сант-Жоан-д'Орта, в глубине долины, упоминаемый с 1095 года, который на протяжении XIX века, ввиду значительно более активного демографического и городского роста, взял на себя церковную и муниципальную «столичность», отняв её у Сант-Женис. Ниже мы опишем сначала историю и эволюцию центра Орта с секторами Ла-Клота, Фон-д'ен-Фаргес и Фон-дель-Гос, а затем — Сант-Женис-делс-Агудельс, Валькарка-и-элс-Пенитентс, Монтбау, парка Валь-д'Эброн, Кармель, Коль и Тейшонера — кварталов или поселений, постепенно сформировавшихся внутри прежней муниципальной территории и сегодня образующих непрерывную городскую застройку в единстве с остальным городом.", "<strong>Семьи</strong>", "С XIV века здесь обосновались влиятельные семьи, такие как Вальсека, представители которой нередко входили в барселонский Совет Ста, как и семья Орта, давшая таких выдающихся людей, как юрист и политик Гильем де Вальсека (умер после 1412 года), главный советник и посол королей. Они обосновались в Торре-Собирана, будущем Лабиринте, ранее принадлежавшем Пере Марí, — владении, впоследствии перешедшем к семье Десвальс. Дом в Орте построили также семьи Льюль, владевшие значительной частью Виланова-дель-Мар и дворцом в квартале Борн; Льобет, с дворцом на улице Монткада; Сапила; Ситжес; Сервия; Сабастида и Маринер — семья с высоким социально-политическим престижем.", "После Декрета Нуэва-Планта новые муниципалитеты бурбонской администрации были упорядочены, и Орта оказалась подчинена муниципалитету Сант-Женис-делс-Агудельс, однако рост населённого пункта Орта привёл к тому, что уже в том же XVIII веке на площади Сантес-Креус-д'Орта было возведено здание муниципалитета (1768), впоследствии перестроенное в 1896 году.", "На муниципальном гербе вплоть до первой половины XIX века значилось название Сант-Женис-делс-Агудельс-д'Орта и три птицы, символ Сант-Женис, но позднее это название и герб были утрачены. В 1888 году в состав Орты входили округа Валькарка, Элс-Пенитентс, Сант-Женис-делс-Агудельс и Коль, а в 1903 году, на момент присоединения, помимо самой Орты, в неё входили кварталы Ла-Клота, Коль, Валькарка, Сант-Женис и Элс-Пенитентс.", "В XVIII веке в стране произошло общее экономическое восстановление, особенно затронувшее Барселону и окрестные посёлки. На муниципальной территории Орты проживало значительное население, рассредоточенное между полями и виноградниками, а усадьбы (масии) соседствовали с домами знати и предпринимателей.", "Среди экономических занятий, помимо традиционных сельскохозяйственных, придававших кварталу новую жизненную силу, наиболее характерным было занятие прачек — женщин, стиравших бельё для жителей Барселоны, вокруг чего сложилась целая индустрия, связанная с бельём и водой. Кожевенная промышленность была представлена дубильней Барселоны, принадлежавшей компании Deu i Companyia (1789), размещённой в Кан-Фонтанер, бывшем загородном доме, и другими кожевенными мастерскими, а также существовали крахмальные фабрики.", "Согласно ответу на опросник Ф. де Саморы, в 1789 году на дубильне работали 26 человек, а кроме того, здесь насчитывалось 36 сборщиков урожая, 320 подёнщиков, 5 ремесленников, 2 врача, 2 хирурга, 1 аптекарь и 16 мастеровых (2 мастера строительных работ, 2 плотника, 2 мастера по изготовлению повозок, 2 слесаря, 2 мастера по изготовлению эспадрилий, 3 ткача, 1 портной, 1 сапожник и 1 цирюльник). Иными словами, до начала XX века преобладающей деятельностью было прачечное и скорняжное дело, а из кожевенного производства выросли профессии сапожников, шорников, перчаточников и переплётчиков. Однако Орта никогда не была промышленным посёлком — она оставалась сельскохозяйственной, и сегодня экономика её населения вращается вокруг мелких лавочников и людей свободных профессий, а также административных работников, руководителей и технических специалистов; прежде всего это квартал полужилого, «спального» типа.", "<strong>Прачки и каменщики</strong>", "Среди политических и социальных событий современной истории квартала можно выделить отголоски Трагической недели 1909 года, когда восставшие отступили в сторону Сант-Андреу и Орты и сожгли монастырь доминиканок и старую церковь Сант-Жоан. Атмосфера 1920-х годов была весьма напряжённой, заметную роль играло Общество каменщиков Орты, левого и анархистского толка (каменщики Орты пользовались известностью по всей барселонской равнине). После мрачных лет диктатуры, когда были закрыты Каталонский центр и другие группы и политические партии, республика принесла оживление, отразившееся в таких изданиях, как La Vall d'Horta, El Boletín или La Peira. Жилой характер квартала обусловил то, что во время Гражданской войны население сохраняло относительное спокойствие (первые инциденты произошли на улицах Фултон и Орта из-за ФАИ, занявшей усадьбу Кан-Керол), а послевоенный период также прошёл спокойно вплоть до мощной волны иммиграции 1950–60-х годов, повлёкшей за собой значительные социологические перемены.", "Городской центр посёлка Орта сформировался начиная с XVI века вокруг главной площади, сегодня — площади Сантес-Креус, где подёнщики собирались, чтобы распределиться на бирже труда. Момент расширения во второй половине XIX века, когда посёлок добился муниципальной независимости, происходил вдоль улицы Майор и усилился с появлением дачных колоний (первая — на рамбле Кортада, ныне Кампоамор) и строительством новых «башен» (особняков) начиная с эпидемии жёлтой лихорадки 1870 года, что превратило посёлок в жилой центр барселонской мелкой буржуазии.", "С 1845 года до начала века население выросло с 1855 до 6035 жителей, и многие владельцы усадеб и земель продали их под застройку. После 1904 года была замощена улица Майор (от русла на улице Кастельо), а также благоустроена площадь Эйвисса, потеснившая площадь Сантес-Креус в качестве городского центра. Наиболее характерные улицы старой части — рамбла Кортада, улицы Фелиу-и-Кодина, Салсес, Каниго и Местре-Дальмау. Замена одноэтажных домов многоквартирными зданиями означала, помимо утраты традиционного облика, рост плотности населения, из-за чего существующая инфраструктура стала недостаточной.", "Приходская церковь Сант-Жоан-д'Орта первоначально располагалась рядом с Кан-Кортада (об этом напоминает название улицы Иглесия), к северу от центра посёлка (она была сожжена в последний день Трагической недели, но сохранялась до значительной части века). В 1905 году кардинал Касаньяс благословил закладку первого камня нового храма на нынешнем, более центральном месте; он был частично открыт в 1911 году и полностью завершён в 1917-м. Подожжённый и разрушенный в июле 1936 года, он был полностью восстановлен в послевоенные годы в осовремененном неоготическом стиле и обрёл окончательный облик лишь в 1980 году, когда были торжественно открыты портал и тимпан фасада работы художника Х. Торраса-и-Вивера, оформившего также интерьер.", "<strong>Градостроительство</strong>", "Помимо сохранившихся «башен» модернистского стиля — лучшие из них находятся на улице Кампоамор, — большой интерес представляют старинные усадьбы (масии), которых насчитывалось около сорока пяти, некоторые крестьянские, другие принадлежавшие знати и состоятельным людям, из которых до наших дней сохранилось около десяти.", "Кан-Кортада, в конце улицы Кампоамор, — старинная средневековая постройка, прежняя укреплённая башня, принадлежавшая семье Орта, чьи владельцы, Ориола-Кортада, графы Валье-де-Мерлес, обладали патронатом над церковью Сант-Жоан; в здании сохранились готические окна разных эпох, а в его подземной части были обнаружены остатки римской виллы. Кан-Керол, на променаде Марагаль, рядом с улицами Петрарка и Сант-Алешандре, — здание XVIII века квадратной планировки с красивыми сграффито, перестроенное и расширенное, в котором сегодня размещается дом престарелых Фонда Вальдежули. Кан-Фаргас, на улице Фредерик-Раола, рядом с променадом Марагаль и улицей Перис-и-Менчета, впервые упоминается уже в 1300 году и с 1734 года принадлежит семье Фаргас-де-Касановас; это примечательное здание с широкой галереей и мощными контрфорсами, окружённое соснами. Кан-Маринер расположен на улице Орта, на углу с улицей Вент: отреставрированный в 1950 году, это один из крупнейших и наиболее хорошо сохранившихся усадебных домов. Стоит также упомянуть Ка-н'Андалет, где размещается территориальный центр Barcelona Activa в Орта-Гинардо, в Ла-Клоте; Кан-Карабасса — неоклассическое здание, в котором располагается колледж SAFA; Кан-Масдеу, Кан-Нотари, Ка-ла-Синия, Кан-Папанапс, Кан-Трави-Вель, Кан-Трави-Ноу, Кан-Сантженис...", "Сады Лабиринта (Лаберинт) образуют примечательный ансамбль, ныне принадлежащий муниципалитету Барселоны, сложившийся вокруг старинного особняка семьи Вальсека, а затем Роже, который в XVIII веке перешёл к семье Десвальс, маркизам Поал-и-Люпия, а позднее — Альфаррас (позади дворца, построенного в прошлом веке в неомавританском стиле, сохранились остатки старинной Торре-Собирана). Сады были заложены начиная с 1793 года Жуаном Антони Десвальсом-и-д'Ардена (выдающимся математиком и учёным) с помощью мастера строительных работ Андреу Вальса, по планам итальянского инженера Доменико Багутти; круг из кипарисов и водные каналы относятся к 1797–1799 годам, сад был украшен скульптурами, беседкой и балюстрадами. Сады расположены на променаде Валь-д'Эброн, к северу от старинного посёлка (променад проходит по так называемой дороге из Корнелья в Фогарс-де-Тордера, открытой в 1869 году), у подножия Кольсеролы, между Льярс-Мундет и подъездом к Кан-Папанапс. Сегодня это сад-музей, а в части здания размещаются офисы Муниципального института парков и садов.", "Также неподалёку от Льярс-Мундет находится Дворец Плюща (Палау-де-лес-Эурес, или Кан-Гальярт) — резиденция с четырьмя круглыми башнями, увенчанными коническими шпилями во французском замковом стиле, построенная в 1895–1898 годах по проекту Аугуста Фонта-и-Каррераса для судовладельца Гальярта; в ней хранилась великолепная мебель и значительные произведения искусства. Сегодня она принадлежит провинциальному совету (Дипутасьо) Барселоны и является пристройкой к Льярс-Мундет. Здесь размещается Фонд Бош-и-Жимпера.", "Башня Гранха-Вельи, некогда принадлежавшая Жуану Сабастиде (XV век), перешла во владение иеронимитов Валь-д'Эброн, а после десамортизации — банкиру Луису Марти-и-Кодолару, который устроил здесь сельскохозяйственную ферму, сады и парки и даже зоопарк (изначальное ядро зоопарка Барселоны); Дон Боско посетил её в 1885 году, а вскоре после этого она была передана салезианцам.", "<strong>Организации</strong>", "Среди культурных и общественных организаций, определявших жизнь квартала, в первую очередь стоит упомянуть Приходской центр Люисос, основанный в 1866 году в Кал-Шикус (улица Байш-де-Маринер) мосеном Луисом Кантарельей и ставший одним из самых деятельных центров, с секциями туризма, фотографии, библиотекой, литературным и театральным кружками. Среди его дочерних объединений выделяются Эсбарт-де-Орта, основанный Жузепом М. Кастельсом-и-Андильей, и Группа театральных исследований Орты, возникшая по инициативе Жузепа Монтаньеса в 1964 году и получившая известность по всей стране. Атенеу был основан в 1868 году под названием Сиркол-Ортенк и располагает библиотекой, шахматной секцией, залом для художественной деятельности и так далее. La Vanguardia Obrera, основанная в 1894 году для повышения культурного уровня своих членов, входила в каталонское кооперативное движение через Федерацию потребительских кооперативов и другие организации; в её ведении находились школы, музыкальные и спортивные секции и прочее.", "El Foment — организация, глубоко укоренившаяся в Орте. Основана в 1887 году как продолжение общества Societat Casino Familiar на площади Сантес-Креус, а в 1917 году под названием Foment Hortenc обосновалась в помещении на улице Альт-де-Маринер (здание Пере Серры-и-Пау), уничтоженном пожаром в 1946 году и восстановленном в 1948-м; имеет зал для собраний, конференций и выставок, а также библиотеку; под её эгидой действует немало театральных коллективов.", "Другие организации в большей степени посвящены спорту, например, Теннисный клуб Орты (основан в 1912 году) на землях старой церкви, Спортивный союз Орты (Unión Atlética Horta), Спортивное объединение Орты (Unión Deportiva de Horta) и Туристический союз Орты (Unión Excursionista de Horta), которые одновременно выполняют и гражданско-культурную функцию.", "Среди учреждений социальной помощи, весьма многочисленных в Орте и далеко выходящих за пределы квартала, в первую очередь упомянем Институт, или Патронат Рибас — приют для сирот, основанный Луисом Рибасом-и-Регордосой в здании архитектора Энрика Сань​ера, окружённом садами, ныне — учреждение профессионального и среднего образования. Между Эуресом и Лабиринтом расположен крупный социальный комплекс, центром которого являются «Дома Анны Жиронельи де Мундет» (Llars Anna Gironella de Mundet), вобравшие в себя многие из учреждений барселонского Дома милосердия. Уже в 1915 году провинциальный совет Барселоны при финансовой поддержке Фонда Альба (учреждённого Микелем Альба-и-Андреу) открыл одноимённый лечебный центр в старинной Торре-делс-Фрарес, в здании, построенном Франсеском де Паулой дель Вилар-и-Кармоной (завершено Бонавентурой Бассегодой). Пожертвование Артура Мундета-и-Карбо (1954) побудило провинциальный совет Барселоны построить этот социальный комплекс на основе недостроенного здания 1927 года и новых павильонов работы архитектора Мануэля Бальдрича — для дома престарелых, а также школ и центров перевоспитания детей. Здания украшены работами известных художников и скульпторов (Субиракс, Кларà, Э. Сьерра, Таррратс, Гиновар и другие). Больница Сант-Рафаэль, специализирующаяся на детях, расположена на променаде Валь-д'Эброн (до 1967 года находилась в Лес-Кортсе). Рядом с ней — крупный медицинский комплекс Сьютат-Санитария-де-ла-Валь-д'Эброн, насчитывающий 2300 коек и поликлинику, один из крупнейших и наиболее хорошо оснащённых в стране. Неподалёку, в секторе Кан-Папанапс, расположен Муниципальный институт психиатрии, построенный начиная с 1971 года.", "В сфере образования Орта обладает давней традицией, восходящей к трудам уважаемого учителя Франсеска Комермы-и-Бакса, преподававшего в общеобразовательной школе и автора педагогических книг, таких как «Колосья и маки» (1875) и «Книга детства» (1879), а также к деятельности некоторых светских школ, таких как обновлённые школы кооператива La Vanguardia Obrera, просуществовавшие до 1975 года. Среди государственных школ следует выделить Единую школу (Escuela Unitària), основанную в 1906 году и находившуюся в здании бывшего муниципалитета Орты на площади Сантес-Креус, где сегодня расположен центр социальных служб. Примечательной была школа, действовавшая во время Гражданской войны в Кан-Глория, — «Производственная школа» (Escuela Productiva), где сами ученики обрабатывали и сбывали продукцию с земельных участков. Среди конфессиональных школ выделяется Приходская школа, основанная в 1904 году мосеном Жузепом Бундо-и-Видалем, отличавшаяся выраженным каталонским духом и укоренённостью в местном сообществе; в 1912 году она перешла к братьям христианского учения (школы La Salle-Horta). Колледж доминиканок Ануньята, основанный в 1878 году, также обладает давней традицией (его посещала Мария Монтессори). В 1913 году открылась École Ménagère — первая в Испании школа домоводства."], "vibe": "Огороды, поившие водой всю Барселону, теперь застроены лестницами и смотровыми площадками."}, "historia_url": "https://ajuntament.barcelona.cat/horta-guinardo/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/horta-guinardo/es/el-distrito-y-sus-barrios"}, "d8": {"num": 8, "color": "#B7A78C", "web1": "http://www.bcn.cat/noubarris", "src": "https://ajuntament.barcelona.cat/noubarris/ca/coneixeu-el-districte/historia", "ipa_ca": "NOH BAH-rees", "ipa_es": "noh BAH-rees", "landmarks": [["El Castell de Torre Baró", "https://ajuntament.barcelona.cat/noubarris/es/conozca-el-distrito/puntos-de-interes/el-castell-de-torre-baro-92086030904", {"es": "mirador con vistas a la ciudad", "ca": "mirador amb vistes a la ciutat", "ru": "смотровая площадка с видом на город"}], ["La Torre Llobeta", "https://ajuntament.barcelona.cat/noubarris/es/conozca-el-distrito/puntos-de-interes/la-torre-llobeta-92086004700", {"es": "antigua masía del siglo XV", "ca": "antiga masia del segle XV", "ru": "усадьба XV века"}], ["Can Basté", "https://ajuntament.barcelona.cat/noubarris/es/conozca-el-distrito/puntos-de-interes/can-baste-95124132926", {"es": "masía del siglo XVII, hoy centro cívico", "ca": "masia del segle XVII, avui centre cívic", "ru": "усадьба XVII века, теперь общественный центр"}], ["Santuario de Santa Eulàlia de Vilapicina", "https://ajuntament.barcelona.cat/noubarris/es/conozca-el-distrito/puntos-de-interes/santuario-de-santa-eulalia-de-vilapicina-99400072726", {"es": "santuario neoclásico del siglo XVIII", "ca": "santuari neoclàssic del segle XVIII", "ru": "неоклассическое святилище XVIII века"}]], "founding": {"es": "Nou Barris se sitúa en el extremo norte de la ciudad, entre la sierra de Collserola y el distrito de Sant Andreu, con más de 800 hectáreas y unas 168.000 personas de procedencias muy diversas. Es el distrito con más barrios de la ciudad, trece en total, entre ellos Can Peguera, Canyelles, Ciutat Meridiana, la Guineueta, Porta, la Prosperitat, les Roquetes, Torre Baró, la Trinitat Nova, Vallbona, Verdun y Vilapicina i la Torre Llobeta.", "ca": "Nou Barris se situa a l'extrem nord de la ciutat, entre la serra de Collserola i el districte de Sant Andreu, amb més de 800 hectàrees i unes 168.000 persones de procedències molt diverses. És el districte amb més barris de la ciutat, tretze en total, entre els quals Can Peguera, Canyelles, Ciutat Meridiana, la Guineueta, Porta, la Prosperitat, les Roquetes, Torre Baró, la Trinitat Nova, Vallbona, Verdun i Vilapicina i la Torre Llobeta.", "ru": "Ноу-Баррис расположен на северной окраине города, между горным массивом Кольсерола и районом Сант-Андреу; площадь — более 800 га, население — около 168 000 человек самого разного происхождения. Это район с наибольшим числом кварталов в городе — их тринадцать, включая Кан-Пегера, Канельес, Сьютат-Меридиана, ла-Гинеуета, Порта, ла-Проспериат, лес-Рокетес, Торре-Баро, ла-Тринитат-Нова, Вальбона, Вердун и Вилаписина-и-ла-Торре-Льобета."}, "es": {"name": "Nou Barris", "sub": "«Nueve barrios»", "desc": ["La historia de Nou Barris es la historia de las personas que han vivido y han trabajado allí, y que han forjado sus sueños y esperanzas de futuro. Es, también, la historia de los agentes sociales que, en diferentes contextos económicos y políticos, han materializado sus iniciativas y proyectos.", "Este legado histórico ha dejado huellas tanto en el paisaje de Nou Barris como en la forma de actuar de sus ciudadanos, y ha formado una imagen colectiva o unos rasgos de identidad que hemos intentado interpretar.", "<strong>Nou Barris: el origen de un nombre y de un distrito</strong>", "Nou Barris era el nombre de la revista de la primera asociación de vecinos de la zona al inicio de los años setenta. Esta denominación, repleta de resonancias de lucha y de conciencia ciudadana, es la que se adoptó como nombre del distrito cuando, en 1984, se hizo la actual división de la ciudad en diez distritos.", "Antes, las 800 hectáreas que integran el territorio de Nou Barris formaban parte de la antigua parroquia y municipio independiente de Sant Andreu de Palomar y, desde la anexión de 1897, del distrito de Sant Andreu de Barcelona.", "<strong>Un pasado rural</strong>", "Hasta el primer tercio del siglo XIX, el paisaje de Nou Barris era básicamente rural, una característica que compartía con el resto de lugares y municipios que, como Sant Andreu, Sant Martí, Les Corts o Sants, integraban el llamado llano de Barcelona.", "Su territorio accidentado y montañoso, dado que Nou Barris se extiende por la vertiente nororiental de la sierra de Collserola, lo atravesaban numerosos torrentes que, con la excepción del milenario Rec Comtal, han desaparecido con las urbanizaciones posteriores.", "Algunos de sus nombres todavía perduran en los de las calles que quedaban cerca: Torrent de Tissó, Torrent de Can Campanya, Riera de Horta… También había fuentes muy apreciadas por sus aguas; de entre las que se conservan, cabe citar la fuente Muguera y la fuente de Canyelles.", "Las masías diseminadas por la sierra concentraban la actividad agrícola que se desarrollaba en el territorio. La mayoría han desaparecido, aunque han dado nombre a lugares o barrios enteros; por ejemplo, Can Dragó, Can Garrigó, Ca La Peira, Can Guineueta, Torre Baró, etcétera.", "Otras masías todavía se conservan y mantienen una cierta actividad económica, como es el caso de Can Carreras o Can Verdaguer. Algunas, finalmente, se utilizan como equipamientos públicos, como es el caso de Ca N’Ensenya, Torre Llobeta o Can Basté.", "El núcleo urbano más antiguo de Nou Barris era el de Santa Eulàlia de Vilapicina, un pequeño barrio que se articulaba en torno a una capilla románica del mismo nombre, que ya existía en el siglo X y que fue reconstruida en 1782. Muy cerca se encuentra Ca N’Artés, un antiguo hostal del siglo XVI levantado en el camino de Sant Iscle, y Can Basté, una masía de finales del siglo XVIII.", "La población de las masías y de este pequeño barrio no era de más de unos cuantos centenares de habitantes a mediados del siglo XIX. La economía se basaba en algunas actividades artesanales y, sobre todo, en el cultivo de la viña y de forrajes para el ganado. También se cultivaban productos de la huerta destinados al consumo de los habitantes de la próxima Barcelona, todavía rodeada por murallas.", "<strong>El impacto de la Revolución industrial</strong>", "El ritmo pausado de la vida rural empezó a cambiar a mediados del siglo XIX como consecuencia de la Revolución industrial, que afectó a Barcelona y los pueblos de los alrededores. El aumento de la población, la revolución de los transportes o las nuevas exigencias de la industrialización incidieron tímidamente en Nou Barris y pusieron en marcha una transformación del paisaje lenta, pero ya imparable. El aumento de la población en el municipio de Sant Andreu y la consolidación de las ideas higienistas hicieron que en 1839 se trasladara el antiguo cementerio parroquial al actual barrio de Porta. Esta actuación facilitó que, cerca del cementerio, empezaran a ubicarse pequeñas industrias harineras y de carpintería, así como a construirse algunas casas.", "Este primer impulso de urbanización en Porta continuó con la construcción, en 1855, de la línea ferroviaria de Barcelona a Zaragoza, y con la instalación, en 1880, de los Talleres del Ferrocarril del Norte en la actual zona de Can Dragó.", "Por otra parte, las crecientes necesidades de agua de los habitantes y de las nuevas industrias del llano de Barcelona favorecieron la construcción, entre 1871 y 1881, de dos acueductos que atravesaban el territorio de Nou Barris, algunos tramos de los cuales todavía se conservan en Ciutat Meridiana, Torre Baró y Can Carreras.", "También en la zona de Vilapicina se inició tímidamente la industrialización, ya que se instalaron manufacturas dedicadas a la producción de tejidos, de abonos, de jabón, de ladrillos, de productos químicos... e incluso de electricidad, para la tracción de los tranvías de la línea de Barcelona a Horta, en las actuales cocheras del paseo de Borbó.", "Este modestísimo proceso de industrialización, sobre todo si lo comparamos con las proporciones que alcanzaba el mismo proceso en el resto de lugares del llano de Barcelona, coincidió con la iniciativa urbana más importante del siglo XIX en Nou Barris: la urbanización del paseo de Santa Eulàlia, actualmente de Fabra i Puig.", "El paseo fue aprobado en 1875 por el Ayuntamiento de Sant Andreu y, desde la década de los ochenta, se convirtió en el eje vertebrador de una especie de pequeño Eixample que dinamizó la actividad constructiva en los barrios de Vilapicina y Porta.", "En 1889, en la actual Guineueta, se inauguraba el Hospital Mental de la Santa Creu, dirigido por el doctor Emili Pi i Molist, uno de los pioneros en el tratamiento de las enfermedades mentales en España. El imponente edificio se construyó siguiendo un “proyecto médico razonado”, donde se recogían las técnicas hospitalarias más modernas del momento.", "La instalación del sanatorio sigue la lógica de la industrialización que desplaza a la periferia y, en este caso, a Nou Barris, algunas de las grandes infraestructuras o equipamientos generales de la ciudad; por ejemplo, los talleres del ferrocarril, el sanatorio mental y, más adelante, la estación elevadora de aguas de Montcada o las torres de electricidad de alta tensión.", "En las postrimerías del siglo XIX, la población de Nou Barris se podía estimar en unos 1.700 habitantes, mayoritariamente campesinos, pero con una incidencia progresiva de los jornaleros ocupados en las manufacturas locales o en las industrias cada vez más numerosas de Sant Andreu.", "Poco sabemos de las inquietudes sociales y culturales de esta población, pero son ilustrativos algunos hechos de los que tenemos constancia, por ejemplo, las demandas que hacen los vecinos de Santa Eulàlia al Ayuntamiento de Sant Andreu en 1874 para que instale en el barrio una escuela de chicas, o bien la fundación, en 1887, de la Societat d’Obrers i Auxiliars L’Estrella, situada en la calle de Porta y dedicada a actividades recreativas y familiares y a la ayuda mutua entre los asociados en caso de muerte o enfermedad.", "El nuevo siglo se inició en Nou Barris con una propuesta de ciudad jardín que debía desarrollarse en un paraje de una calidad natural excepcional: la antigua heredad de Torre Baró i Vallbona, propiedad de la familia Sivatte desde 1873.", "Siguiendo corrientes urbanistas e higienistas de gran prestigio internacional que inspiraron iniciativas urbanas de características similares en Barcelona, como la de la avenida del Tibidabo o la del Park Güell, en 1904 se creó la Compañía de Urbanización de las Alturas del N. E. de Horta.", "La operación inmobiliaria relacionada con la ciudad jardín no prosperó, aunque la compañía construyó la carretera que une Horta con la colina de las Roquetes e inició la construcción del edificio de aspecto medieval que debía tener funciones de hotel y que hoy conocemos como el Castell de Torre Baró. Como testigo de este proyecto, se conservan algunas torres de veraneo levantadas en la zona entre los años 1915 y 1936.", "<strong>Los inicios de la urbanización</strong>", "A partir de 1917, y al amparo de las ganancias que reportó la neutralidad de España en la Primera Guerra Mundial, se produjo, en la ciudad, un nuevo fenómeno urbano consistente en la aparición, en el llano de Barcelona, de unas nuevas periferias urbanas integradas por una población básicamente obrera y con una alta proporción de inmigrantes.", "En estas circunstancias, y hasta 1936, Nou Barris se convirtió en el suburbio que experimentó el crecimiento más dinámico de Barcelona, ya que en su territorio se levantó la décima parte de toda la nueva edificación que se hizo en la periferia de la ciudad.", "Además, en los terrenos de Can Peguera, se construyeron más de quinientas viviendas integrantes del polígono Ramon Albó, uno de los cuatro grupos de casas baratas levantados en la ciudad en 1929 por el Patronato de la Vivienda.", "En este periodo, las barriadas de las Roquetes, Verdum, Charlot, la Prosperitat, la Guineueta y Can Borràs surgieron prácticamente de la nada. Una prueba indirecta de esta fiebre constructora es la creación, en 1925, de la entidad Defensa de los Intereses de la Propiedad Urbana de las Afueras de San Andrés, que hoy conocemos como la Asociación de Propietarios de las Roquetes.", "Como puede deducirse, el aumento de la población fue importante, y en 1930, en el que Barcelona alcanzó el mítico millón de habitantes, Nou Barris ya tenía 17.000. Como rasgos generales podemos decir que esta población era relativamente joven, con una notable presencia de inmigrantes y un gran número de niños.", "La incidencia del analfabetismo era grande, y resultaba más patente entre las mujeres. La mayor parte de la población activa se autoclasificaba como jornalera, y la presencia de comerciantes, propietarios y profesionales liberales era escasísima.", "La vida social en Nou Barris se organizaba en torno a sociedades culturales, deportivas y recreativas de todo tipo, como fueron el Casinet de Vilapicina, continuador de la sociedad L’Estrella, el desaparecido Ateneo Familiar Artístico y Cultural, creado en Verdum en 1927, o el todavía vigente coro de L’ldeal d’en Clavé, fundado en 1930. En el terreno deportivo, cabe citar a los veteranos equipos de fútbol La Montañesa y Les Roquetes, creados en 1927 y 1929, respectivamente.", "También existían algunas sedes de partidos políticos, como el de la Unión Monárquica, situada en la actual Vía Júlia, y parece que a lo largo de la época republicana se establecieron otros. Cabe decir que, en las elecciones generales de febrero de 1936, en Nou Barris ganó con holgura el Frente Popular.", "<strong>El modelo urbano del régimen franquista</strong>", "El fin de la Guerra Civil con la victoria de las tropas franquistas sobre el régimen democrático de la Segunda República dio paso a una dictadura militar basada en la represión de la población y en la ausencia de las libertades políticas, sindicales y nacionales.", "Las duras condiciones económicas derivadas de la inmediata posguerra, unidas a la necesidad imperiosa de vivienda y al férreo control político ejercido sobre la población, dieron lugar al chabolismo y a la autoconstrucción, una forma de crecimiento urbano hasta entonces desconocida en Nou Barris que descartaba cualquier demanda sobre los servicios y las condiciones de vida.", "En este contexto y entre los años 1941 y 1945, en Torre Baró y Vallbona, el que fue un proyecto ambicioso de ciudad jardín se transformó en una parcelación exhaustiva del territorio, donde se levantaron unas viviendas muy precarias, carentes muchas veces de servicios tan elementales como el agua, la luz o el alcantarillado.", "La autoconstrucción se extendió en los años cincuenta en las Roquetes, donde el verano de 1964 los vecinos tomaron la decisión de dotar al barrio de los inexistentes servicios de agua y alcantarillado, y ellos mismos los construían los domingos. Esta iniciativa fue conocida más adelante como “Urbanizando en domingo”.", "El inicio de la industrialización española, producida en los años cincuenta como consecuencia de la abertura de la economía a los mercados exteriores, provocó un proceso imparable de emigración desde todas las regiones de España hacia las grandes ciudades industriales, entre otras, Barcelona, lo que supuso un agravamiento de las condiciones, ya difíciles, de la vivienda de la población.", "Esta presión demográfica obligó a determinados organismos oficiales del régimen franquista, como el Gobierno Civil, el Patronato Municipal de la Vivienda o el mismo Sindicato Vertical mediante su Obra Sindical del Hogar, a intervenir en la promoción de viviendas en la ciudad.", "Por esta razón, entre los años 1952 y 1955 se levantaron en Nou Barris las llamadas viviendas del gobernador en el barrio de Verdum, el polígono de Torre Llobeta y los polígonos de la Obra Sindical del Hogar en Verdum y en la Trinitat Nova.", "En Nou Barris, el transporte público era prácticamente inexistente en aquella época. Solo había, a partir de 1949, un apeadero del tren en Torre Baró, y había que dirigirse a Horta o a Sant Andreu para tomar los tranvías y los autobuses que conectaban con el resto de la ciudad.", "Esta carencia obligaba a hacer desplazamientos largos y penosos, tanto para ir al trabajo como para utilizar los servicios públicos, siempre escasos. Es comprensible, pues, que los vecinos de Verdum, las Roquetes y la Prosperitat organizaran una gran celebración cuando, en 1953, llegaron a la Vía Júlia los autobuses de la compañía TAC.", "En un contexto de rápido crecimiento económico y fuerte inmigración que generaban un déficit permanente de viviendas en la ciudad, la aprobación, en 1953, del Plan comarcal de Barcelona resultó decisiva para el crecimiento de Barcelona y de Nou Barris en las dos décadas siguientes.", "El Plan comarcal, que diseñó las grandes vías de circulación de la ciudad, incorporaba también un instrumento urbanístico de primer orden —el Plan parcial— que en cada territorio concreto decidía los usos del suelo, las alineaciones de las calles y de las plazas, el emplazamiento de los espacios libres, de los servicios públicos y de los edificios, así como el volumen, la destinación y las condiciones sanitarias y estéticas de las construcciones.", "Por descontado, este poderoso instrumento se utilizó ampliamente en Nou Barris, donde los planes parciales afectaron a doce de los catorce barrios que lo componen, con la única excepción de Vilapicina y una pequeña parte de Porta. También cabe mencionar que en Nou Barris se desarrolló la quinta parte de los planes parciales que se ejecutaron en el conjunto de la ciudad.", "En un primer momento estos planes parciales fueron promovidos por los propietarios de los terrenos que todavía quedaban por urbanizar en Nou Barris y, en muchos casos, sirvieron para legalizar los desaguisados urbanísticos de la década anterior.", "Pero fue en los años sesenta cuando, en el marco del desarrollismo y de la llegada de miles de inmigrantes a Barcelona, los planes parciales se transformaron en verdaderos instrumentos para la especulación, ya que permanecían en manos de grandes compañías inmobiliarias que en Nou Barris hacían negocios multimillonarios.", "Bajo este enfoque se construyeron los polígonos de viviendas de la Guineueta, Porta, el Turó de la Peira, Ciutat Meridiana, de Barcinova y Calinova en la Guineueta, el último de los cuales significó el derribo de una gran parte del edificio del Hospital Mental. El último polígono, de promoción municipal y que se inauguró ya en época predemocrática, fue el de Canyelles, en 1974.", "La consecuencia lógica de este urbanismo especulativo del franquismo era el déficit de equipamientos y de servicios públicos, que se hacía patente en toda la ciudad, pero con más intensidad en los barrios periféricos y de nueva construcción. Ni que decir tiene que en 1967, fecha no tan lejana, incluso se habilitaron unos viejos tranvías como escuelas en Nou Barris.", "En los años sesenta y setenta, la falta de escuelas, de ambulatorios, de zonas deportivas y de esparcimiento, así como un largo etcétera, era proverbial en Nou Barris, puesto que la prioridad de la Administración municipal franquista no era, en absoluto, aumentar el bienestar de la población.", "La toma de conciencia de los ciudadanos ante estas carencias hizo nacer, en 1970, la Asociación de Vecinos de Nou Barris, una entidad pionera en la lucha contra los planes parciales y por la mejora de las condiciones de vida y la consecución de las libertades democráticas.", "En los primeros años de la década de los setenta, en cada barrio surgieron asociaciones de vecinos que acogieron a luchadores de todo tipo: vecinos concienciados, cristianos comprometidos, luchadores antifranquistas y miembros de los partidos políticos, entonces ilegales. Todos, hombres y mujeres, jóvenes y mayores, organizaron asambleas, manifestaciones y todo tipo de actividades que evidenciaban las insuficiencias que había que mejorar y las libertades que se tenían que alcanzar.", "Así, se emprendieron huelgas de alquileres para mejorar los polígonos de la OSH, olimpiadas populares para pedir equipamientos deportivos y para la juventud, cacerías de ratas para mejorar la limpieza, acciones para paralizar una planta asfáltica y convertirla en ateneo, encierros para conseguir institutos, secuestros de autobuses para subirlos a los barrios, manifestaciones para conseguir semáforos, y un largo etcétera que fue la expresión de la capacidad de lucha y de ingenio de los ciudadanos de Nou Barris.", "<strong>El modelo de ciudad de la época democrática</strong>", "La consecución de la democracia en 1977 y las primeras elecciones municipales de 1979 significaron un gran cambio para los ciudadanos y el paisaje de Nou Barris, ya que gran parte de las reivindicaciones de los vecinos las consiguieron los nuevos ayuntamientos e instituciones democráticas, a la vez que se crearon nuevos mecanismos de intervención y participación social.", "Desde esta perspectiva, el nuevo urbanismo desarrollado por el Ayuntamiento democrático en los años ochenta se ha planteado como un urbanismo de sutura, es decir, un urbanismo capaz de coser lo que había estado separado y capaz de intervenir en la regeneración y la dignificación de los espacios marginalizados por la especulación franquista.", "Este urbanismo, que no se entiende sin la participación ciudadana y que también ha mostrado auténticos puntos débiles, como hacer viables los planes especiales de reforma interior (PERI), ha dado muy buenas muestras de su saber hacer en Nou Barris. Son ejemplos las plazas de Sóller, de Àngel Pestaña o de Llucmajor, la Vía Júlia y la avenida de Rio de Janeiro, espacios donde también se ha actuado desde el punto de vista de la monumentalización de la periferia, creando una auténtica galería de arte en la calle de muy buena escultura internacional.", "Dicho esto, las intervenciones urbanas que mejor pueden definir la nueva forma de hacer ciudad en Nou Barris son las que han conseguido vincular la consecución de un nuevo equipamiento social, cultural o deportivo con la mejora de la calidad urbana de su entorno.", "Estos equipamientos, esta mejora de la calidad de vida, el espíritu emprendedor de los ciudadanos y la rica red asociativa de Nou Barris representan el punto de partida a partir del cual hay que avanzar en el fortalecimiento de las relaciones entre las personas, en la participación de todos en los asuntos de la comunidad y en la profundización en los valores democráticos, que son los que nos hacen auténticamente libres.", "Fragmento de la publicación Nou Barris", "García Soler, C. Centro de Estudios y Documentación de Nou Barris. Nou Barris Barcelona: Imprenta Municipal, 1998. (Archivo Municipal. Itinerarios). ISBN: 84-7609-868-5."], "vibe": "Nació de una lucha vecinal y todavía lleva esa pelea en el nombre."}, "ca": {"name": "Nou Barris", "sub": "«Nou Barris»", "desc": ["La història de Nou Barris és la història de les persones que hi han viscut, hi han treballat i hi han forjat els seus somnis i esperances de futur. És, també, la història dels agents socials que, en diferents contextos econòmics i polítics, hi han materialitzat les seves iniciatives i projectes.", "Aquest llegat històric ha deixat empremtes tant en el paisatge de Nou Barris com en la manera de fer dels seus ciutadans, i ha format una imatge col·lectiva o uns trets d’identitat que hem intentat interpretar.", "<strong>Nou Barris: l’origen d’un nom i d’un districte</strong>", "Nou Barris era el nom de la revista de la primera associació de veïns de la zona a l’inici dels anys setanta. Aquesta denominació, plena de ressons de lluita i de consciència ciutadana, és la que es va adoptar com a nom del districte quan, l’any 1984, es va fer l’actual divisió de la ciutat en deu districtes.", "Abans, les 800 hectàrees que integren el territori de Nou Barris formaven part de l’antiga parròquia i municipi independent de Sant Andreu de Palomar i, des de l’annexió del 1897, del districte de Sant Andreu de Barcelona.", "<strong>Un passat rural</strong>", "Fins al primer terç del segle XIX, el paisatge de Nou Barris era bàsicament rural, una característica que compartia amb la resta d’indrets i municipis que, com Sant Andreu, Sant Martí, les Corts o Sants, integraven l’anomenat pla de Barcelona.", "El seu territori accidentat i muntanyós, atès que Nou Barris s’estén pel vessant nord-oriental de la serra de Collserola, el travessaven nombrosos torrents i rieres que, amb l’excepció del mil·lenari rec Comtal, han desaparegut amb les urbanitzacions posteriors.", "Alguns dels seus noms encara perduren en els dels carrers que hi quedaven a prop: torrent d’en Tissó, torrent de Can Campanya, riera d’Horta… També hi havia fonts molt apreciades per les seves aigües; d’entre les que es conserven cal citar la font Muguera i la font d’en Canyelles.", "Les masies escampades per la serra concentraven l’activitat agrícola que es desenvolupava al territori. La majoria han desaparegut, tot i que han donat nom a indrets o barris sencers, per exemple, Can Dragó, Can Garrigó, Ca la Peira, Can Guineueta, Torre Baró, etcètera. Altres encara s’utilitzen avui en dia com a equipaments públics, com és el cas de Ca n’Ensenya, Torre Llobeta, Can Verdaguer o Can Basté.", "El nucli urbà més antic de Nou Barris era el de Santa Eulàlia de Vilapicina, un petit barri que s’articulava al voltant d’una capella romànica del mateix nom, que ja existia al segle X i que va ser refeta l’any 1782. Molt a prop es troba Ca n’Artés, un antic hostal del segle XVI aixecat al camí de Sant Iscle, i Can Basté, una masia de la darreria del segle XVIII.", "La població de les masies i d’aquest petit barri no era de més d’uns quants centenars d’habitants a mitjan segle XIX. L’economia es basava en algunes activitats artesanals i, sobretot, en el conreu de la vinya i de farratges per al bestiar. També s’hi conreaven productes de l’horta destinats al consum dels habitant
