<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcelona — mapa interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Open+Sans:wght@300;600;700;800&display=swap">
<style>
  :root{
    --paper:#F7F4EF; --panel:#FFFFFF; --ink:#2C2A29; --muted:#8a8177; --muted2:#c9beae;
    --line:#EAE1D2; --accent:#C86D51; --accent-soft:#f4e2d8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Source Sans Pro',-apple-system,BlinkMacSystemFont,sans-serif;
    height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Header ---------- */
  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 20px;border-bottom:1px solid var(--line);background:var(--panel);}
  .brand{display:flex;align-items:center;gap:9px;}
  .catalog-toggle{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:.76rem;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:.12s;margin-right:4px;}
  .catalog-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .brand svg{width:19px;height:19px;color:var(--accent);flex:none;}
  .brand h1{font-size:1rem;margin:0;font-weight:800;letter-spacing:-.01em;}
  .brand h1 b{font-weight:400;color:var(--muted);}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .langswitch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .langswitch button{border:none;background:var(--panel);color:var(--muted);
    padding:6px 12px;font-size:.74rem;font-weight:700;cursor:pointer;transition:.12s;
    font-family:'JetBrains Mono',monospace;}
  .langswitch button + button{border-left:1px solid var(--line);}
  .langswitch button.active{background:var(--accent);color:#fff;}
  .resetlink{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:.74rem;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.12s;}
  .resetlink:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- 2-pane cinematic layout ---------- */
  .main{flex:1;display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(300px,1fr);
    gap:0;min-height:0;position:relative;}

  /* ---------- Catalog drawer (overlay) ---------- */
  .sidebar{width:340px;position:fixed;top:56px;left:0;bottom:0;z-index:40;
    background:var(--panel);border-right:1px solid var(--line);
    transition:transform .22s ease, opacity .18s ease;
    overflow-y:auto;padding:10px;box-shadow:8px 0 32px rgba(0,0,0,.35);
    transform:translateX(-100%);opacity:0;pointer-events:none;}
  body.catalog-open .sidebar{transform:translateX(0);opacity:1;pointer-events:auto;}
  .sidebar-backdrop{position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:35;
    opacity:0;pointer-events:none;transition:opacity .18s ease;}
  body.catalog-open .sidebar-backdrop{opacity:1;pointer-events:auto;}

  .sidebar-head{display:flex;align-items:center;justify-content:space-between;
    padding:10px 10px 10px 14px;margin-bottom:2px;border-bottom:1px solid var(--line);}
  .sidebar-head h3{margin:0;font-size:.72rem;font-weight:700;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;}
  .sb-district{margin-bottom:1px;}
  .sb-district-row{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;
    cursor:pointer;transition:background .15s;border-radius:8px;}
  .sb-district-row:hover{background:rgba(255,255,255,.06);}
  .sb-district-row.active{background:rgba(200,109,81,.18);}
  .sb-num{font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--muted);
    width:20px;flex:none;}
  .sb-district-row.active .sb-num{color:var(--accent);}
  .sb-dname{font-size:.81rem;font-weight:500;color:var(--ink);line-height:1.25;flex:1;}
  .sb-district-row.active .sb-dname{color:var(--accent);font-weight:600;}
  .sb-swatch{width:6px;height:6px;border-radius:50%;flex:none;opacity:.75;}
  .sb-chevron{width:11px;height:11px;flex:none;color:var(--muted);transition:transform .15s ease;}
  .sb-district.expanded .sb-chevron{transform:rotate(90deg);}

  .sb-barris{padding-left:32px;max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .sb-district.expanded .sb-barris{max-height:900px;}
  .sb-barri-row{display:flex;align-items:baseline;gap:7px;padding:5px 9px;border-radius:7px;
    cursor:pointer;transition:background .12s;}
  .sb-barri-row:hover{background:rgba(255,255,255,.06);}
  .sb-barri-row.active{background:var(--accent);}
  .sb-barri-row .sb-num{color:var(--muted);font-size:.62rem;}
  .sb-barri-row.active .sb-num{color:#fff;opacity:.8;}
  .sb-bname{font-size:.77rem;color:var(--ink);opacity:.82;line-height:1.3;}
  .sb-barri-row.active .sb-bname{color:#fff;opacity:1;font-weight:600;}

  /* ---------- Map ---------- */
  .map-card{display:flex;align-items:center;justify-content:center;position:relative;
    background:#FBF7F0;border:1px solid var(--line);border-radius:16px;padding:6px;min-width:0;overflow:hidden;
    margin:10px;}
  .map-card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.045;z-index:1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;}
  .map-svg-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2;}
  svg.mapsvg{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .barri{cursor:pointer;transition:fill-opacity .15s ease, stroke-opacity .15s ease;}
  .barri:hover, .barri.preview{fill-opacity:.5;}
  .barri.selected{fill:var(--accent) !important;fill-opacity:.92;stroke:#fff;stroke-width:1.8;stroke-opacity:1;}
  .district-shape{pointer-events:none;transition:fill-opacity .2s ease, stroke-opacity .2s ease;}
  .district-shape.preview{fill-opacity:.12 !important;stroke-opacity:.5 !important;}
  .district-shape.active{fill-opacity:.42 !important;stroke:var(--accent) !important;stroke-width:3px !important;stroke-opacity:1 !important;}
  .barri-label{font-family:'JetBrains Mono',monospace;font-size:8.4px;fill:var(--ink);
    opacity:.35;pointer-events:none;text-anchor:middle;dominant-baseline:central;}
  .district-label{font-family:'Open Sans',sans-serif;font-weight:800;font-size:11px;
    fill:var(--ink);opacity:.72;text-anchor:middle;dominant-baseline:central;letter-spacing:.01em;
    text-transform:uppercase;cursor:pointer;pointer-events:auto;
    paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;
    transition:opacity .15s ease, fill .15s ease;}
  .district-label:hover, .district-label.preview{opacity:1;fill:var(--accent);}
  .accent-dot{fill:var(--accent);stroke:#fff;stroke-width:2;opacity:0;transition:opacity .2s ease, r .2s ease;
    pointer-events:none;}
  .accent-dot.show{opacity:1;}

  .tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:4px 9px;border-radius:5px;opacity:0;
    transform:translate(-50%,-120%);transition:opacity .1s;white-space:nowrap;z-index:5;
    display:flex;align-items:center;gap:6px;}
  .tooltip.show{opacity:1;}
  .tooltip-flag{font-size:.6rem;font-weight:700;background:rgba(255,255,255,.18);
    padding:1px 5px;border-radius:4px;letter-spacing:.04em;}

  /* ---------- Info panel: cinematic hero + feed ---------- */
  .info-card{background:var(--panel);color:var(--ink);border-left:1px solid var(--line);
    overflow-y:auto;position:relative;}

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;animation:fadeIn .3s ease both;}
  .empty-state svg{width:32px;height:32px;color:var(--muted);margin-bottom:14px;}
  .empty-state p{font-size:.85rem;color:var(--muted);line-height:1.55;max-width:240px;margin:0;}

  .hero-sticky{position:sticky;top:0;z-index:6;background:var(--panel);
    border-left:5px solid var(--district-color, var(--accent));
    padding:28px 28px 16px 23px;border-bottom:1px solid var(--line);}
  .hero-sticky > .feed-num{margin-bottom:12px;}
  .hero{background:var(--panel);border-left:5px solid var(--district-color, var(--accent));
    padding:16px 28px 22px 23px;animation:fadeIn .25s ease both;border-bottom:1px solid var(--line);}
  .id-pair{display:flex;flex-direction:column;gap:4px;margin:0;}
  .id-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;font-family:'Source Sans Pro',sans-serif;
    font-size:.92rem;font-weight:500;color:var(--muted);}
  .id-line:first-child{font-family:'Open Sans',sans-serif;font-size:1.55rem;font-weight:800;
    letter-spacing:-.015em;color:var(--ink);}
  .id-line .flag{font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;background:var(--paper);padding:1px 6px;
    border-radius:5px;color:var(--district-color, var(--muted2));flex:none;}
  .ipa{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted2);font-weight:400;}
  .section-h{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;color:var(--district-color, var(--accent));
    margin:28px 0 8px;}
  .section-h:first-of-type{margin-top:0;}
  .hist-section{margin:0 0 14px;}
  .hist-section summary{font-family:'Open Sans',sans-serif;font-size:.85rem;font-weight:700;
    color:var(--ink);cursor:pointer;list-style:none;}
  .hist-section summary::-webkit-details-marker{display:none;}
  .hist-section summary::before{content:'▸';display:inline-block;margin-right:7px;
    color:var(--district-color, var(--accent));transition:transform .15s ease;}
  .hist-section[open] summary::before{transform:rotate(90deg);}
  .hist-section-body{margin-top:10px;}
  .hist-section-body p{margin:0 0 12px;}
  .hist-section-body p:last-child{margin-bottom:0;}
  .bullet-list{margin:0 0 4px;padding-left:18px;font-family:'Source Sans Pro',sans-serif;font-size:.9rem;
    line-height:1.7;color:#4a4238;}
  .bullet-list a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted2);
    text-underline-offset:2px;}
  .bullet-list a:hover{color:var(--district-color, var(--accent));text-decoration-color:var(--district-color, var(--accent));}
  .hero p{font-family:'Source Sans Pro',sans-serif;font-size:1.08rem;line-height:1.65;font-weight:400;
    margin:0 0 14px;color:#4a4238;}
  .hero p:last-of-type{margin-bottom:0;}
  .hero p a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted2);
    text-underline-offset:2px;}
  .hero p a:hover{color:var(--district-color, var(--accent));text-decoration-color:var(--district-color, var(--accent));}
  .clamp-text{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .expand-toggle{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;
    letter-spacing:.02em;color:var(--district-color, var(--accent));background:none;border:none;padding:0;cursor:pointer;margin-top:6px;}
  .expand-toggle:hover{text-decoration:underline;}
  .backlog-note{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--muted2);
    margin:10px 0 0;line-height:1.5;}

  .feed-head{padding:14px 28px 8px;}
  .feed-head h4{margin:0;font-family:'JetBrains Mono',monospace;font-size:.66rem;
    font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;}

  .feed{padding:4px 20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .feed-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:11px;border-radius:10px;
    border:1px solid var(--line);transition:.15s;cursor:pointer;background:var(--panel);}
  .feed-card:hover{border-color:var(--district-color, var(--accent));box-shadow:0 2px 8px rgba(30,20,10,.06);}
  .feed-card.selected{border-color:var(--district-color, var(--accent));box-shadow:0 0 0 2px var(--district-color, var(--accent));}
  .feed-num{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;
    letter-spacing:.02em;color:var(--district-color, var(--accent));
    background:color-mix(in srgb, var(--district-color, var(--accent)) 16%, white);
    border-radius:5px;padding:1px 5px;display:inline-block;width:fit-content;}
  .feed-expand{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;
    border:none;background:none;color:var(--muted2);cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:.12s;}
  .feed-expand:hover{color:var(--district-color, var(--accent));background:var(--paper);}
  .feed-expand svg{width:12px;height:12px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(30,20,10,.35);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .15s ease;}
  .modal-backdrop.show{opacity:1;pointer-events:auto;}
  .modal-card{background:var(--panel);border-radius:16px;max-width:480px;width:100%;
    max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);
    transform:translateY(10px);transition:transform .15s ease;}
  .modal-backdrop.show .modal-card{transform:translateY(0);}
  .modal-close{position:sticky;top:10px;float:right;margin-right:10px;width:28px;height:28px;
    border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
  .modal-close:hover{color:var(--district-color, var(--accent));border-color:var(--district-color, var(--accent));}
  .modal-body{padding:28px;}
  .modal-body .feed-num{font-size:.68rem;padding:2px 7px;margin-bottom:10px;}
  .modal-body .feed-title{font-size:1.1rem;}
  .modal-body .feed-orig{font-size:.82rem;}
  .modal-body .feed-ru{font-size:.78rem;}
  .modal-body .feed-text{font-size:.86rem;line-height:1.6;margin-top:10px;}
  .feed-title{font-family:'Open Sans',sans-serif;font-size:1.02rem;font-weight:700;
    color:var(--ink);line-height:1.26;margin:0;letter-spacing:-.005em;}
  .feed-orig{font-family:'Source Sans Pro',sans-serif;font-weight:500;color:var(--muted);font-size:.78rem;
    display:block;margin-top:2px;}
  .feed-ru{font-family:'Source Sans Pro',sans-serif;font-size:.76rem;color:var(--muted2);}
  .feed-text{font-family:'Source Sans Pro',sans-serif;font-size:.95rem;line-height:1.5;font-weight:400;
    color:#4a4238;margin:0;}
  .card-footer{display:flex;flex-wrap:wrap;gap:6px 14px;}
  .card-footer a{display:inline-flex;align-items:center;gap:2px;font-family:'Source Sans Pro',sans-serif;
    font-size:.65rem;font-weight:400;color:var(--district-color, var(--accent));
    text-decoration:none;text-underline-offset:2px;transition:.12s;line-height:1.3;}
  .card-footer a:hover{text-decoration:underline;}
  .card-footer a::after{content:'↗';font-size:.85em;}

  /* ---------- Footer ---------- */
  .page-footer{flex:none;text-align:center;padding:6px 14px 10px;}
  .page-footer-link{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--muted2);
    text-decoration:none;letter-spacing:.02em;transition:.12s;}
  .page-footer-link:hover{color:var(--accent);text-decoration:underline;}

  /* ---------- Mobile ---------- */
  @media (max-width:900px){
    html,body{height:auto;overflow:auto;}
    .main{display:flex;flex-direction:column;}
    .sidebar{width:82%;}
    .map-card{height:44vh;margin:8px;}
    .info-card{width:100%;overflow-y:visible;min-height:56vh;}
    .hero-sticky{position:static;padding:24px 20px 16px;}
    .hero{padding:16px 20px 18px;}
    .feed-head{padding:14px 20px;}
    .feed{padding:4px 12px 20px;grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <button class="catalog-toggle" id="btnCatalogToggle">☰ <span id="catalogLabel">Catálogo</span></button>
    <h1>BARCELONA <b id="pageTag">· distritos &amp; barrios</b></h1>
  </div>
  <div class="topbar-right">
    <button class="resetlink" id="btnReset">✕ <span id="resetLabel">Reiniciar</span></button>
    <div class="langswitch">
      <button class="active" data-lang="es">ES</button>
      <button data-lang="ca">CA</button>
      <button data-lang="ru">RU</button>
    </div>
  </div>
</div>

<div class="main">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h3 id="sidebarTitle">Distritos &amp; barrios</h3>
    </div>
    <div id="sidebarList"></div>
  </aside>

  <div class="map-card">
    <div class="map-svg-wrap">
      <svg class="mapsvg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

, {"es": "antiguo cementerio, memorial de 1714", "ca": "antic cementiri, memorial de 1714", "ru": "бывшее кладбище, мемориал 1714 года"}], ["La muralla romana", "https://ajuntament.barcelona.cat/ciutatvella/es/conozca-el-distrito/puntos-de-interes/la-muralla-romana-99400387424", {"es": "restos de la muralla romana", "ca": "restes de la muralla romana", "ru": "остатки римской городской стены"}]], "founding": {"es": "Ciutat Vella está delimitado por el perímetro de la antigua muralla y coincide con el centro histórico de Barcelona. Limita al oeste con L'Eixample, al este con el mar Mediterráneo, al norte con Sant Martí y al sur con Sants-Montjuïc. Lo forman cuatro barrios: la Barceloneta al sur, el Raval al oeste, el Gòtic en el centro y Sant Pere, Santa Caterina i la Ribera al este.", "ca": "Ciutat Vella està delimitat pel perímetre de l'antiga muralla i coincideix amb el centre històric de Barcelona. Limita a l'oest amb l'Eixample, a l'est amb el mar Mediterrani, al nord amb Sant Martí i al sud amb Sants-Montjuïc. El formen quatre barris: la Barceloneta al sud, el Raval a l'oest, el Gòtic al centre i Sant Pere, Santa Caterina i la Ribera a l'est.", "ru": "Сьютат-Велья ограничен периметром старой городской стены и совпадает с историческим центром Барселоны. На западе он граничит с Эшампле, на востоке — со Средиземным морем, на севере — с Сан-Марти, на юге — с Сантс-Монжуик. Район состоит из четырёх кварталов: Барселонета на юге, Раваль на западе, Готический квартал в центре и Сан-Пере, Санта-Катерина и Рибера на востоке."}, "es": {"name": "Ciudad Vieja", "sub": "«Ciudad Vieja»", "desc": ["La historia del distrito de Ciutat Vella es la historia de los inicios de la ciudad de Barcelona, ya que delimita geográficamente el centro histórico de la ciudad.", "La historia de una ciudad que vivió amurallada hasta el año 1859 y que hoy es el territorio que queda rodeado por la avenida del Paral·lel, las rondas, la calle de Pelai, el paseo de Lluís Companys y el parque de la Ciutadella. Ciutat Vella está formado por cuatro grandes barrios que atesoran muchos otros históricos, con fuerte personalidad y homogeneidad propias. En el sur, encontramos la Barceloneta, el barrio más joven, creado a mediados del siglo XVIII con la excusa de realojar a los desplazados de la Ribera por la construcción de la Ciutadella; en poniente, el Raval, nacido a partir de los caminos rurales extramuros de la ciudad, que fue la cuna de la Revolución industrial del siglo XIX; en el centro, el Gòtic, la manifestación urbana más antigua de Barcelona; y en levante, Sant Pere, Santa Caterina i la Ribera, la extensión medieval de la ciudad. El territorio urbano de Ciutat Vella es un gran marco de tensiones y conflictos estructurales, relacionales y sociales. Las relaciones actuales no se entienden sin interrelacionar la aportación del pasado con las actuaciones del presente. La larga permanencia de Ciutat Vella intramuros configuró una realidad de mínimas aireaciones y perspectivas. Una vez liberada de este cinturón físico y psicológico, se vio sometida a procesos de degradación permanentes hasta la segunda mitad de los años setenta, cuando el desarrollismo se agotó y el modelo municipal autoritario dio paso al proceso de democratización de la sociedad. La combinación de estos dos últimos factores consolidó las bases para una política de regeneración urbana llevada a cabo en Ciutat Vella en las últimas décadas, durante las cuales las viejas operaciones sistemáticas de demolición y sustitución han evolucionado para convertirse en intervenciones de conservación y rehabilitación."], "vibe": "El corazón romano y medieval de la ciudad — cada calle esconde un siglo distinto."}, "ca": {"name": "Ciutat Vella", "sub": "«Ciutat Vella»", "desc": ["La història del districte de Ciutat Vella és la història dels inicis de la ciutat de Barcelona, ja que el districte delimita, geogràficament, el centre històric de la ciutat.", "La història d'una ciutat que va viure emmurallada fins a l'any 1859 i que avui és el territori que resta encerclat per l'avinguda del Paral·lel, les rondes, el carrer de Pelai, el passeig de Lluís Companys i el parc de la Ciutadella. Ciutat Vella està format per quatre grans barris que n'atresoren molts altres d'històrics, amb forta personalitat i homogeneïtat pròpies.", "Al sud, hi trobem la Barceloneta, el barri més jove, creat a mitjan segle XVIII amb l'excusa de reallotjar els desplaçats de la Ribera per la construcció de la Ciutadella; a ponent, el Raval, nascut a partir dels camins rurals extramurs de la ciutat, que va ser el bressol de la Revolució Industrial del segle XIX; al centre, el Gòtic, la manifestació urbana més antiga de Barcelona, i a llevant, Sant Pere, Santa Caterina i la Ribera, l'extensió medieval de la ciutat.", "El territori urbà de Ciutat Vella és un gran marc de tensions i conflictes estructurals, relacionals i socials. Les relacions existents no s'entenen sense interrelacionar l'aportació del passat amb les actuacions del present. La llarga permanència de Ciutat Vella intramurs va configurar una realitat de mínims airejaments i perspectives. Una vegada alliberada d'aquest cinturó físic i psicològic, es va veure sotmesa a processos de degradació permanents fins a la segona meitat dels anys setanta, en què el desenvolupisme es va esgotar i el model municipal autoritari va donar pas al procés de democratització de la societat.", "La combinació d'aquests dos últims factors va consolidar les bases per a una política de regeneració urbana duta a terme a Ciutat Vella les darreres dècades, durant les quals les velles operacions sistemàtiques de demolició i substitució han evolucionat per convertir-se en intervencions de conservació i rehabilitació."], "vibe": "El cor romà i medieval de la ciutat — cada carrer amaga un segle diferent."}, "ru": {"name": "Сьютат-Велья", "sub": "«Старый город»", "desc": ["История района Сьютат-Велья — это история зарождения города Барселоны, ведь именно он географически очерчивает исторический центр города.", "Это история города, который вплоть до 1859 года жил обнесённым крепостными стенами, а сегодня представляет собой территорию, ограниченную проспектом Параллель, кольцевыми магистралями (рондами), улицей Пелай, променадом Луиса Компаниса и парком Сьютадельи. Сьютат-Велья состоит из четырёх крупных кварталов, каждый из которых объединяет в себе множество других, исторических, с ярко выраженной собственной индивидуальностью и однородностью. На юге находится Барселонета — самый молодой квартал, созданный в середине XVIII века под предлогом переселения жителей Рибера, вытесненных строительством крепости Сьютадельи; на западе — Раваль, возникший из сельских дорог за пределами городских стен, ставший колыбелью промышленной революции XIX века; в центре — Готический квартал, старейшее городское образование Барселоны; а на востоке — Сант-Пере, Санта-Катерина и Рибера, средневековое расширение города. Городская территория Сьютат-Веллья представляет собой обширное поле структурных, межличностных и социальных напряжений и конфликтов. Нынешние отношения невозможно понять, не связав вклад прошлого с действиями настоящего. Долгое существование Сьютат-Веллья в границах крепостных стен сформировало реальность минимальной \"проветриваемости\" и ограниченных перспектив. Освободившись от этого физического и психологического пояса, район подвергался постоянным процессам деградации вплоть до второй половины 1970-х годов, когда девелопментализм исчерпал себя, а авторитарная муниципальная модель уступила место процессу демократизации общества. Сочетание этих двух последних факторов заложило основы политики городского возрождения, проводимой в Сьютат-Веллья в последние десятилетия, в ходе которой старые систематические операции по сносу и замене эволюционировали в мероприятия по сохранению и реабилитации застройки."], "vibe": "Римско-средневековое сердце города — на каждой улице свой век."}, "historia_url": "https://ajuntament.barcelona.cat/ciutatvella/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/ciutatvella/es/el-distrito-y-sus-barrios"}, "d2": {"num": 2, "color": "#CBA86B", "web1": "http://www.bcn.cat/eixample", "src": "https://ca.wikipedia.org/wiki/Eixample", "ipa_ca": "uh-SHAM-pluh", "ipa_es": "en-SAHN-cheh", "landmarks": [["La Sagrada Familia", "https://ajuntament.barcelona.cat/eixample/es/conozca-el-distrito/puntos-de-interes/la-sagrada-familia-92086004491", {"es": "templo de Gaudí, Patrimonio Mundial", "ca": "temple de Gaudí, Patrimoni Mundial", "ru": "храм Гауди, объект Всемирного наследия"}], ["La Casa Batlló", "https://ajuntament.barcelona.cat/eixample/es/conozca-el-distrito/puntos-de-interes/la-casa-batllo-75990398260", {"es": "edificio modernista de Gaudí", "ca": "edifici modernista de Gaudí", "ru": "модернистское здание Гауди"}], ["La Pedrera - Fundació Catalunya La Pedrera", "https://ajuntament.barcelona.cat/eixample/es/conozca-el-distrito/puntos-de-interes/la-pedrera-fundacio-catalunya-la-pedrera-94348110436", {"es": "casa modernista de Gaudí", "ca": "casa modernista de Gaudí", "ru": "модернистский дом Гауди"}], ["La Casa Amatller", "https://ajuntament.barcelona.cat/eixample/es/conozca-el-distrito/puntos-de-interes/la-casa-amatller-92086008866", {"es": "edificio modernista de Puig i Cadafalch", "ca": "edifici modernista de Puig i Cadafalch", "ru": "модернистское здание Пуч-и-Кадафалька"}]], "founding": {"es": "L'Eixample está formado por seis barrios: la Dreta de l'Eixample, la Antiga Esquerra, la Nova Esquerra, el Fort Pienc, la Sagrada Família y Sant Antoni. La Dreta fue el barrio de la burguesía donde se introdujo el modernismo, estilo que después influyó en el resto del distrito y lo convirtió en un conjunto arquitectónico único en Europa.", "ca": "L'Eixample està format per sis barris: la Dreta de l'Eixample, l'Antiga Esquerra, la Nova Esquerra, el Fort Pienc, la Sagrada Família i Sant Antoni. La Dreta va ser el barri de la burgesia on es va introduir el modernisme, estil que després va influir en la resta del districte i el va convertir en un conjunt arquitectònic únic a Europa.", "ru": "Эшампле состоит из шести кварталов: Дрета-де-л'Эшампле, Антига-Эскера, Нова-Эскера, Форт-Пиенк, Саграда-Фамилия и Сант-Антони. Дрета была районом буржуазии, где зародился модернизм — стиль, впоследствии повлиявший на весь остальной район и превративший его в уникальный для Европы архитектурный ансамбль."}, "es": {"name": "Ensanche", "sub": "«Ensanche»", "desc": ["La relación entre la ciudad y los pueblos del llano era muy intensa. Del portal de Sant Antoni salía el camino hacia Sants y del portal del Àngel, el camino de Gràcia. El tráfico era tan intenso que se instalaron servicios regulares de coches de caballos. En 1824 se plantaron cuatro hileras de árboles en torno al viejo camino de Gràcia, que se convirtió en un paseo tanto para los barceloneses como para los gracienses. Más adelante se construyeron jardines con merenderos y locales al aire libre donde se hacía teatro, baile y conciertos y había atracciones; eran el Prado Catalán, los Camps Elisis y el Tívoli, entre otros.", "Entre 1854 y 1856 se derribaron las murallas en un periodo breve de gobierno progresista, pero hasta 1858 no se permitió hacer un plan para ensanchar la ciudad.", "Fue en 1859 cuando el Consistorio barcelonés convocó un concurso de proyectos urbanísticos, cuyo ganador fue el proyecto del arquitecto Rovira i Trias. Paralelamente, el Gobierno central encargó otro al ingeniero Ildefons Cerdà, que impuso este plan mediante un decreto que anulaba la decisión del Ayuntamiento de Barcelona. Aquella intromisión no gustó nada en la ciudad, aunque proponía un proyecto mejor. Barcelona rechazaba el Plan Cerdà porque suponía una medida centralista del Gobierno de Madrid y porque desaprovechaba mucho espacio, ya que lo destinaba a zonas verdes. El plan de Cerdà no estaba pensado solo para el espacio que hoy ocupa el distrito de L’Eixample; planteaba un ensanche entre Montjuïc y el río Besòs, incluyendo el término de Sant Martí.", "L’Eixample se construyó en los años de la industrialización de Cataluña, a finales del siglo XIX y comienzos del XX. La parte central, la Dreta de l’Eixample, fue el barrio de la burguesía que introdujo en su casa un estilo propio, el modernismo, reflejo de ese momento. Aunque en esta zona se concentraba un buen número de edificios significativos, el resto de los que había en otros barrios, como el Fort Pienc, la Sagrada Família, Sant Antoni o la Esquerra de l’Eixample, fueron influidos por esta corriente. Todo L’Eixample constituye un conjunto arquitectónico modernista único en Europa.", "<strong>El Plan Cerdà</strong>", "Con su plan urbanístico, Cerdà quería diseñar una ciudad igualitaria, donde no se diferenciaran unos barrios de otros por las condiciones de vida impuestas. Preveía ofrecer los mismos servicios a todo el mundo.", "El plan de Cerdà se basaba en una gran red de calles perpendiculares y traveseras, todas ellas uniformes, excepto dos vías sesgadas superpuestas (la Diagonal y la Meridiana) y la Gran Via de les Corts Catalanes. El punto donde se encontraban estos ejes era el gran centro de comunicaciones de L’Eixample, en el que se preveía construir una gran plaza, la de las Glòries Catalanes. Con un gran rigor, el arquitecto previó el reparto uniforme de zonas de servicios, como mercados, centros sociales e iglesias, además de grandes parques.", "Las manzanas no eran exactamente cuadradas, ya que, para facilitar la visibilidad, en las esquinas se cortaban los ángulos en forma de chaflán. En el interior de cada manzana solo se permitía construir en uno o dos lados, y el resto del espacio se dejaba para el jardín de los vecinos. Las casas no debían tener más de tres pisos de altura (16 metros), ni ser muy profundas. Cerdà lo concibió así porque consideraba que la salud de los ciudadanos dependía de si vivían en unas casas bien iluminadas por donde circulara el aire limpio de los jardines.", "Con respecto a los jardines, además de los árboles de las calles y los jardines de cada isla de casas, en cada barrio se hacía un gran parque de entre cuatro y ocho manzanas de extensión. Además, en la zona del Poblet, hoy barrio de la Sagrada Família, Cerdà previó un gran hipódromo, y también concibió un gran bosque en el extremo de levante de la ciudad, en la orilla del Besòs. También estaba previsto construir tres hospitales fuera de la trama de calles.", "Aunque por entonces era difícil imaginarse la existencia del automóvil, se dejaron calles espaciosas, por donde podían circular los carros, los coches y los tranvías de caballos. En definitiva, Cerdà quería hacer una ciudad donde se evitara el amontonamiento de casas de la ciudad vieja.", "El encanto de L’Eixample no son solo los edificios más valiosos, sino todo el conjunto; las casas que son más sencillas tienen una cornisa, una barandilla o una portería con un detalle significativo de la arquitectura que las caracteriza.", "<strong>L’Eixample, distrito modernista</strong>", "La arquitectura modernista mezclaba las nuevas técnicas y los nuevos materiales del momento con la utilización de los recursos que proporcionaban las diversas técnicas decorativas tradicionales: los estucos, los esgrafiados, los cristales emplomados de los vitrales, la forja... El trabajo de los artesanos se ponía al servicio del diseño y la concepción de los arquitectos modernistas. Se trataba de una nueva arquitectura y un nuevo concepto del espacio que recogían las antiguas técnicas tradicionales y las más novedosas, en una armonía al servicio de la libertad creativa.", "Lluís Domènech i Montaner, Josep Puig i Cadafalch, Antoni Gaudí y muchos otros arquitectos crearon, poco a poco, el nuevo distrito. Era el comienzo de un nuevo estilo que se alejaba de la monotonía del eclecticismo dominante hasta aquel momento."], "vibe": "Una cuadrícula perfecta soñada por un ingeniero para curar una ciudad enferma de hacinamiento."}, "ca": {"name": "Eixample", "sub": "«Eixample»", "desc": ["La relació entre la ciutat i els pobles del pla era molt intensa. Del portal de Sant Antoni sortia el camí cap a Sants i del portal de l’Àngel, el camí de Gràcia. El trànsit era tan intens que es van instal·lar serveis regulars de cotxes de cavalls. El 1824 es van plantar quatre fileres d’arbres al voltant del vell camí de Gràcia, que es va convertir en un passeig tant per als barcelonins com per als graciencs. Més endavant es van construir jardins amb berenadors i locals a l’aire lliure on es feia teatre, ball i concerts i hi havia atraccions; eren el Prado Catalán, els Camps Elisis i el Tívoli, entre altres.", "Entre el 1854 i el 1856 es van enderrocar les muralles en un període breu de govern progressista, però fins el 1858 no es va permetre fer un pla per eixamplar la ciutat.", "Va ser l’any 1859 que el consistori barceloní va convocar un concurs de projectes urbanístics, el guanyador del qual va ser el projecte de l’arquitecte Rovira i Trias. Paral·lelament, el Govern central en va encarregar un altre a l’enginyer Ildefons Cerdà; el Govern va imposar aquest pla mitjançant un decret que anul·lava la decisió de l’Ajuntament de Barcelona. Aquella intromissió no va agradar gens a la ciutat, malgrat que proposava un projecte millor. Barcelona rebutjava el pla Cerdà perquè suposava una mesura centralista del Govern de Madrid i perquè desaprofitava molt espai, que destinava a zones verdes. El pla de Cerdà no estava pensat només per a l’espai que avui ocupa el districte de l’Eixample; plantejava un Eixample entre Montjuïc i el riu Besòs, incloent-hi el terme de Sant Martí.", "L’Eixample es va construir en els anys de la industrialització de Catalunya, a la darreria del segle XIX i al començament del XX. La part central, la Dreta de l’Eixample, va ser el barri de la burgesia, que va introduir a casa seva un estil propi, el modernisme, reflex d’aquell moment. Malgrat que en aquesta zona es concentrava un bon nombre d’edificis significatius, la resta dels que hi havia en altres barris com el Fort Pienc, la Sagrada Família, Sant Antoni o l’Esquerra de l’Eixample van ser influïts per aquest corrent. Tot l’Eixample constitueix un conjunt arquitectònic modernista únic a Europa.", "<strong>El pla Cerdà</strong>", "Amb el seu pla urbanístic, Cerdà volia dissenyar una ciutat igualitària, on no es diferenciessin uns barris dels altres per les condicions de vida imposades. Preveia oferir els mateixos serveis a tothom.", "El pla de Cerdà es basava en una gran xarxa de carrers perpendiculars i travessers, tots ells uniformes, excepte dues vies esbiaixades superposades (la Diagonal i la Meridiana) i la gran via de les Corts Catalanes. El punt on es trobaven aquests eixos era el gran centre de comunicacions de l’Eixample, on es preveia construir una gran plaça, la de les Glòries Catalanes. Amb un gran rigor, l’arquitecte va preveure el repartiment uniforme de zones de serveis, com ara mercats, centres socials i esglésies, a més de grans parcs.", "Les illes no eren ben bé quadrades, ja que, per facilitar la visibilitat, a les cantonades es tallaven els angles en forma de xamfrà. A l’interior de cada illa només es permetia construir en un o dos costats, i la resta de l’espai es deixava per al jardí dels veïns. Les cases no havien de tenir més de tres pisos d’alçada (16 metres), i tampoc no havien de ser gaire profundes. Cerdà ho va concebre així perquè considerava que la salut dels ciutadans depenia de si vivien en unes cases ben il·luminades per on circulés l’aire net dels jardins.", "Pel que fa als jardins, a més dels arbres dels carrers i els jardins de cada illa de cases, a cada barri es feia un gran parc d’entre quatre i vuit illes d’extensió. A més, a la zona del Poblet, avui barri de la Sagrada Família, Cerdà hi va preveure un gran hipòdrom, i també va concebre un gran bosc a l’extrem de llevant de la ciutat, a la riba del Besòs. També estava previst construir tres hospitals fora de la trama de carrers.", "Tot i que en aquell moment era difícil imaginar-se l’existència de l’automòbil, es van deixar carrers espaiosos, per on podien circular els carros, els cotxes i els tramvies de cavalls. En definitiva, Cerdà volia fer una ciutat on s’evités l’amuntegament de cases de la ciutat vella.", "L’encant de l’Eixample no són només els edificis més valuosos, sinó tot el conjunt; les cases que són més senzilles tenen una cornisa, una barana o una porteria amb un detall significatiu de l’arquitectura que les caracteritza.", "<strong>L’Eixample, districte modernista</strong>", "L’arquitectura modernista barrejava les noves tècniques i els nous materials del moment amb la utilització dels recursos que proporcionaven les diverses tècniques decoratives tradicionals: els estucs, els esgrafiats, els vidres emplomats dels vitralls, la forja… El treball dels artesans es posava al servei del disseny i la concepció dels arquitectes modernistes. Es tractava d’una nova arquitectura i un nou concepte de l’espai que recollien les antigues tècniques tradicionals i les més noves, en una harmonia al servei de la llibertat creativa.", "Lluís Domènech i Montaner, Josep Puig i Cadafalch, Antoni Gaudí i molts altres arquitectes van crear, de mica en mica, el nou districte. S’encetava un nou estil que s’allunyava de la monotonia de l’eclecticisme dominant fins en aquell moment."], "vibe": "Una quadrícula perfecta somiada per un enginyer per curar una ciutat malalta de massificació."}, "ru": {"name": "Эшампле", "sub": "«Расширение»", "desc": ["Связь между городом и посёлками равнины была очень интенсивной. От ворот Сант-Антони отходила дорога на Сантс, а от ворот Ангела — дорога на Грасию. Движение было настолько оживлённым, что были организованы регулярные линии конных экипажей. В 1824 году вдоль старой дороги на Грасию высадили четыре ряда деревьев, и она превратилась в променад как для барселонцев, так и для жителей Грасии. Позднее здесь были построены сады с закусочными и открытыми площадками, где устраивали театральные представления, танцы и концерты и где были аттракционы; среди них — Прадо Каталан, Кампс-Элисис и Тиволи.", "Между 1854 и 1856 годами, в короткий период правления прогрессистов, были снесены городские стены, но лишь к 1858 году было разрешено разработать план расширения города.", "Именно в 1859 году барселонский муниципалитет объявил конкурс градостроительных проектов, победителем которого стал проект архитектора Ровиры-и-Триаса. Параллельно центральное правительство заказало другой проект инженеру Ильдефонсу Серда, который навязал этот план указом, аннулировавшим решение барселонского муниципалитета. Это вмешательство совершенно не понравилось городу, хотя предложенный проект был лучше. Барселона отвергала План Серда, поскольку он представлял собой централистскую меру мадридского правительства и потому что впустую расходовал много пространства, отводя его под зелёные зоны. План Серда был задуман не только для территории, которую сегодня занимает район Эшампле: он предполагал расширение города между Монжуиком и рекой Бесос, включая земли Сант-Марти.", "Эшампле был построен в годы индустриализации Каталонии, в конце XIX — начале XX века. Центральная часть, Права-де-л'Эшампле, стала кварталом буржуазии, которая привнесла в свои дома собственный стиль — модернизм, отражавший дух той эпохи. Хотя именно в этой зоне сосредоточилось наибольшее число значимых зданий, остальные постройки в других кварталах, таких как Форт-Пиенк, Саграда-Фамилия, Сант-Антони или Эскера-де-л'Эшампле, также испытали влияние этого течения. Весь Эшампле представляет собой уникальный для Европы архитектурный ансамбль в стиле модернизма.", "<strong>План Серда</strong>", "Своим градостроительным планом Серда хотел спроектировать город равенства, где условия жизни не отличали бы один квартал от другого. Он предусматривал предоставление одинаковых услуг всем жителям.", "План Серда основывался на обширной сети перпендикулярных и поперечных улиц, все они были одинаковыми, за исключением двух наложенных диагональных магистралей (Диагональ и Меридиана) и Гран-Виа-де-лес-Кортс-Каталанес. В точке пересечения этих осей должен был располагаться главный коммуникационный центр Эшампле, где предусматривалось строительство большой площади — площади Глориес-Каталанес. С большой скрупулёзностью архитектор предусмотрел равномерное распределение зон обслуживания — рынков, общественных центров и церквей, а также крупных парков.", "Кварталы (манзаны) не были строго квадратными: чтобы улучшить видимость, углы на перекрёстках срезались, образуя фаски (шафлан). Внутри каждого квартала застройка допускалась только с одной или двух сторон, остальное пространство отводилось под сад для жителей. Дома не должны были превышать трёх этажей в высоту (16 метров) и не должны были быть слишком глубокими. Серда задумал это так, поскольку считал, что здоровье горожан зависит от того, живут ли они в хорошо освещённых домах, куда проникает чистый воздух из садов.", "Что касается зелёных насаждений, помимо уличных деревьев и садов внутри каждого квартала домов, в каждом районе предусматривался большой парк площадью от четырёх до восьми кварталов. Кроме того, в зоне Побле, сегодняшнем квартале Саграда-Фамилия, Серда предусмотрел большой ипподром, а также задумал обширный лес на восточной окраине города, на берегу реки Бесос. Также планировалось построить три больницы за пределами уличной сетки.", "Хотя в те времена трудно было представить появление автомобиля, были оставлены просторные улицы, по которым могли передвигаться повозки, экипажи и конные трамваи. В конечном счёте Серда хотел создать город, где было бы исключено скученное нагромождение домов старого города.", "Очарование Эшампле заключается не только в самых ценных зданиях, но и во всём ансамбле в целом: даже самые простые дома имеют карниз, перила или парадный вход с деталью, значимой для характерной для них архитектуры.", "<strong>Эшампле — квартал модернизма</strong>", "Архитектура модернизма сочетала новые для того времени техники и материалы с использованием ресурсов, которые предоставляли различные традиционные декоративные техники: штукатурку, сграффито, свинцовые витражные стёкла, кованое железо... Труд ремесленников был поставлен на службу замыслу и концепции архитекторов-модернистов. Речь шла о новой архитектуре и новом понимании пространства, объединявших старинные традиционные техники с самыми новаторскими, в гармонии, служившей творческой свободе.", "Луис Доменек-и-Монтанер, Жозеп Пуч-и-Кадафалк, Антони Гауди и многие другие архитекторы постепенно создавали новый район. Это было начало нового стиля, отдалявшегося от монотонности эклектизма, господствовавшего до того момента."], "vibe": "Идеальная сетка кварталов, придуманная инженером, чтобы вылечить задыхающийся от тесноты город."}, "historia_url": "https://ajuntament.barcelona.cat/eixample/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/eixample/es/el-distrito-y-sus-barrios"}, "d3": {"num": 3, "color": "#8FA37E", "web1": "http://www.bcn.cat/sants-montjuic", "src": "https://ca.wikipedia.org/wiki/Montju%C3%AFc_(Barcelona)", "ipa_ca": "SANZ mon-zhoo-EEK", "ipa_es": "SANTS mon-khoo-EEK", "landmarks": [["El Castillo de Montjuïc", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/el-castillo-de-montjuic-99077121755", {"es": "fortaleza en lo alto de Montjuïc", "ca": "fortalesa dalt de Montjuïc", "ru": "крепость на вершине Монжуика"}], ["La Fuente Mágica", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/la-fuente-magica-95087125042", {"es": "fuente con espectáculo de luz y agua", "ca": "font amb espectacle de llum i aigua", "ru": "фонтан со светомузыкальным шоу"}], ["El Pabellón Mies van der Rohe", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/el-pabellon-mies-van-der-rohe-institut-municipal-fundacio-mies-van-der-rohe-96243111030", {"es": "pabellón de arquitectura racionalista", "ca": "pavelló d'arquitectura racionalista", "ru": "павильон рационалистской архитектуры"}], ["El Teatre Grec", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/el-teatre-grec-92086000123", {"es": "teatro al aire libre en una cantera", "ca": "teatre a l'aire lliure en una pedrera", "ru": "открытый театр в бывшем карьере"}], ["El Mercado de Sants", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/el-mercado-de-sants-92086009455", {"es": "mercado modernista de 1913", "ca": "mercat modernista de 1913", "ru": "модернистский рынок 1913 года"}], ["Can Batlló", "https://ajuntament.barcelona.cat/sants-montjuic/es/conozca-el-distrito/puntos-de-interes/can-batllo-99400343700", {"es": "antigua fábrica textil reconvertida", "ca": "antiga fàbrica tèxtil reconvertida", "ru": "бывшая текстильная фабрика"}]], "founding": {"es": "Sants-Montjuïc es el distrito más extenso de Barcelona, con 2.090 hectáreas, casi una cuarta parte del término municipal, aunque buena parte no está habitada (el puerto, la Zona Franca, la montaña de Montjuïc). Está formado por ocho barrios: el Poble-sec, Hostafrancs, la Bordeta, la Font de la Guatlla, la Marina de Port, la Marina del Prat Vermell, Sants y Sants-Badal.", "ca": "Sants-Montjuïc és el districte més extens de Barcelona, amb 2.090 hectàrees, gairebé una quarta part del terme municipal, tot i que bona part no és habitada (el port, la Zona Franca, la muntanya de Montjuïc). El formen vuit barris: el Poble-sec, Hostafrancs, la Bordeta, la Font de la Guatlla, la Marina de Port, la Marina del Prat Vermell, Sants i Sants-Badal.", "ru": "Сантс-Монжуик — самый большой по площади район Барселоны (2090 га, почти четверть территории города), хотя значительная его часть не заселена (порт, Зона Франка, гора Монжуик). Район состоит из восьми кварталов: Побле-сек, Остафранкс, ла-Бордета, ла-Фонт-де-ла-Гуатлья, ла-Марина-де-Порт, ла-Марина-дель-Прат-Вермель, Сантс и Сантс-Бадаль."}, "es": {"name": "Sants-Montjuïc", "sub": "", "desc": ["La montaña de Montjuïc es la caja fuerte donde se guarda la historia de Barcelona. Pocas ciudades tienen un accidente geográfico tan característico y con tantos secretos asidos a la piedra y tantos acontecimientos vividos. Los arqueólogos ya encontraron restos abundantes de una cantera taller epipaleolítica de unos 10.000 años de antigüedad; es el testimonio más antiguo de presencia humana en la ciudad de Barcelona. En la falda de Montjuïc han ido creciendo diversos núcleos de población que han llegado a formar una unidad física, actualmente organizada en el distrito de Sants-Montjuïc.", "Sants era un pequeño vecindario agrícola que existía como mínimo desde el siglo XI y que se transformó en un gran pueblo industrial. Los talleres donde se estampaban las prendas de ropa con los dibujos denominados indianas. El crecimiento industrial no se detuvo, y pronto grandes fábricas textiles hicieron compañía a la multitud de pequeños talleres: el Vapor Vell (Sants), la Espanya Industrial (Hostafrancs), Can Batlló (la Bordeta). Ello causó que estos barrios, que tenían un crecimiento demográfico muy rápido debido sobre todo a la inmigración y con una clase obrera predominante, se convirtieran en lugares de historia agitada y de formación de muchas sociedades populares, buena parte de las cuales todavía existen.", "<strong>La negociación entre Barcelona y Sants</strong>", "En 1839, Barcelona había hecho un cambio de terrenos con el municipio de Sants. La Ciudad Condal cedía a su vecino una parte de la zona marítima a cambio de establecer, en el torrente de Magòria, el límite por el sureste. Así, pasó a pertenecer a Barcelona el territorio donde acto seguido se empezó a urbanizar el barrio de Hostafrancs, que tomó el nombre de un hostal fundado por Joan Corrades, y bautizado con el topónimo del pueblo leridano de donde procedía. Aunque ya pertenecía a Barcelona cuando se redactó el Plan de ensanche, Hostafrancs no fue incluido en él y tuvo su propio desarrollo urbanístico diferenciado.", "En 1883, el Ayuntamiento de Sants agregó el pueblo a Barcelona, pero este acuerdo municipal fue anulado por el Gobierno al año siguiente. Finalmente, en 1897, Sants se anexionó definitivamente a Barcelona por real decreto, al mismo tiempo que Sant Martí, Sant Andreu, Les Corts, Gràcia y Sant Gervasi.", "El Poble-sec fue, de hecho, el primer ensanche de Barcelona, anterior al que proyectó Ildefons Cerdà. Las murallas de Barcelona se derribaron en 1854 y el Plan de ensanche se aprobó cinco años más tarde, pero los propietarios tardaron unos años más en edificar a causa de las reticencias contra el proyecto de Cerdà. Aquel fue el origen del Poble-sec.", "<strong>Fuera del plan Cerdà</strong>", "Como los de Hostafrancs, los terrenos situados en el lado de la falda de Montjuïc más próximo al mar no quedaban incluidos en el Plan de ensanche ni estaban, por lo tanto, sujetos a limitaciones urbanísticas. Los propietarios, con buen criterio, empezaron a parcelarlos según su conveniencia, a partir de 1858, y a edificar casas sencillas para obreros. Nacieron, así, los barrios de la França Xica, Santa Madrona y las Hortes de Sant Bertran, después agrupados bajo el nombre genérico de Poble-sec. Era un sector que quedaba muy cerca del antiguo recinto amurallado de la ciudad y tenía, así, todas las ventajas y un único inconveniente: las fuertes pendientes.", "Hasta 1887 el Ayuntamiento no decidió intervenir. Convocó un concurso de proyectos de urbanización que tenía que asumir, lógicamente, lo que ya estaba construido. Josep Amargós, encargado de redactarlo, lo terminó en 1894. Copió el sistema de chaflanes ideado por Cerdà, a escala reducida, y dejó establecida la trama urbana actual del Poble-sec, desde el mar hasta la plaza de Espanya.", "<strong>La urbanización del Paral·lel</strong>", "El Paral·lel, que es actualmente el límite del distrito con el barrio viejo y la parte baja de L’Eixample, se urbanizó poco después de la Exposición Universal de 1888. Su nombre proviene de una taberna abierta en 1894, cuyos dueños, para bautizarla, siguieron el consejo de un amigo, el astrónomo Comas i Solà, partiendo de que el trazado de la calle tiene exactamente la misma orientación que los paralelos terrestres y coincide con el que pasa por Barcelona, situado a 41° 20’ de latitud norte. De inmediato, aquella amplia avenida se convirtió en un barrio alegre, repleto de teatros y cafés.", "En 1892 se abrió el Teatro Español, en el mismo local, transformado, que ahora ocupa la Sala Barts. En 1898 se instaló en la avenida el Café Sevilla, ya desaparecido, y en 1903, el Teatro Condal. En 1901 se le sumó el Nou; en 1903, el Apolo; en 1907, el Cómico; en 1916, el Victòria y El Molino. Raquel Meller, que debutó en 1911 en el Arnau, fue la figura indiscutible de las salas de espectáculos del Paral·lel durante muchos años. Aquella tradición, inaugurada cuando acababa un siglo y empezaba el siguiente, se ha mantenido con dificultades hasta nuestros días.", "<strong>La Zona Franca, territorio aduanero</strong>", "El nombre de la Marina, antes conocida como Zona Franca, proviene de que, al empezar el siglo XX, el Fomento del Trabajo Nacional pidió al Gobierno la creación, en el delta del Llobregat, de una gran zona industrial donde se pudieran elaborar, con exenciones fiscales importantes, materias primas catalanas destinadas a la exportación. Eso es, precisamente, una zona franca: un territorio que dispone de instalaciones portuarias y que es considerado, desde el punto de vista aduanero, como territorio extranjero, aunque dependa del Estado donde esté situado. Solo se autorizan construcciones industriales y comerciales, pero no residenciales.", "Nunca fue concedido este privilegio a Barcelona. Se llegaron a expropiar los terrenos, durante la dictadura de Primo de Rivera, después de segregarlos de L’Hospitalet y anexionarlos a Barcelona, pero no se hizo nada a causa de los pleitos con los propietarios expropiados y de la evolución histórica posterior del país. En 1965, cuando ya hacía diez años que se había instalado la SEAT, una ley decidió que los terrenos expropiados no servirían como zona franca, sino como polígono industrial para la mediana y gran industria, y también para la ampliación del puerto. Tres años más tarde se aprobó el plan parcial de 714 hectáreas, a partir del cual han surgido aquellas calles inhóspitas y sin nombre.", "<strong>Montjuïc, un espacio de ocio</strong>", "Desde siempre, había habido tradición de ir a Montjuïc a pasar ratos de ocio. Las ermitas siempre han sido lugar de romería y estas excursiones suelen acabar con una jira. A las ermitas se les añadieron los merenderos, siempre cerca de las fuentes. Se iba el domingo y había baile al aire libre. En la noche de San Juan, sobre todo, se convertían en el lugar preferido de las verbenas, porque en Montjuïc crecía la planta del mismo nombre y los enamorados aprovechaban para hacerse con un ramo de flores y ofrecérselo a sus parejas. La Font del Gat dio origen a una de las canciones catalanas más populares.", "El ajetreo de las canteras convivía con lugares tranquilos, con prados y bosques de pinos donde los lerrouxistas organizaban sus encuentros a principios de siglo. Este paraíso dejó de serlo cuando unos financieros barceloneses muy relacionados con las nacientes compañías productoras y distribuidoras de electricidad se fijaron en este sitio para convertirlo en el mejor escaparate publicitario de sus intereses.", "<strong>La importancia de la luz</strong>", "Francesc Cambó era el abogado de Sofina, una sociedad financiera vinculada a la AEG que tuvo una intervención decisiva en todo el proceso de electrificación en Cataluña. Joan Pich i Pon era el líder del Partido Radical en Barcelona. Cuando los radicales mandaban en el Ayuntamiento, se hizo la concesión municipal al AEG para el alumbrado público de la ciudad, después de un viaje que hizo Lerroux expresamente a Barcelona para entrevistarse con los representantes de esta empresa.", "Cambó y Pich i Pon tenían capacidad para influir en las decisiones municipales de la segunda década del siglo. Eran los concejales más destacados de sus respectivos partidos y fueron elegidos en 1913 para organizar una exposición de industrias eléctricas que promocionara el consumo de aquella naciente forma de energía. El Ayuntamiento asumió plenamente el proyecto y seleccionó la montaña de Montjuïc como marco de la exposición, que tenía que celebrarse en 1917. Un real decreto autorizó al Ayuntamiento a expropiar los terrenos, declarados de utilidad pública. Se encargaron proyectos de urbanización a algunos de los arquitectos más importantes del momento —Puig i Cadafalch, Domènech i Montaner, Enric Sagnier y August Font, entre otros— y empezaron las obras con mucho empuje.", "La guerra europea aconsejó aplazar la exposición, ya que difícilmente participarían en ella las empresas extranjeras, pero las obras no se detuvieron, pensando que podrían servir para otras exposiciones. El mismo día en que Primo de Rivera dio el golpe de estado, en 1923, se inauguró una de mobiliario y, seis años después, con las obras de urbanización acabadas, se celebraba la Exposición Internacional. La luz, tal como había sido la intención inicial, ocupaba un lugar muy importante, con los rayos del Palacio Nacional, la fuente mágica de Buïgas, la torre de la plaza del Univers y las farolas art déco de la avenida de Maria Cristina. La montaña quedó configurada tal como es ahora, desde la plaza de Espanya hasta Miramar.", "<strong>Montjuïc, después de la Exposición: 3 elementos clave</strong>", "En Montjuïc, después de la Exposición de 1929, han ocurrido muchas cosas. La primera, que muchos de los emigrantes que atrajo se alojaron en chabolas detrás del estadio y, para que no se vieran durante la Exposición, se levantó un muro. Aquel núcleo fue creciendo en la posguerra hasta formar una verdadera ciudad que llegaba a las vallas del cementerio. A mediados de los años sesenta, que es cuando llegaron al momento de máxima densidad, esta ciudad de barracas tenía una población de unos 35.000 habitantes y ocupaba una superficie de 30 hectáreas, que se mantuvo hasta principios de los años setenta.", "La segunda, que durante la Guerra Civil Española y una vez acabada entró en un proceso de degradación creciente, del que no se empezó a recuperar hasta que se decidió celebrar en Barcelona el Congreso Eucarístico Internacional de 1952, un acontecimiento de gran importancia política —era el primer signo visible del fin del aislamiento diplomático del régimen franquista— y de impacto en el urbanismo de la ciudad, comparable a las dos exposiciones y a los Juegos Olímpicos.", "La tercera, que una vez recuperadas las instalaciones de la exposición y reanudada la Feria de Muestras, Montjuïc sirvió para encajar todo lo que no cabía en otro sitio, sin una visión coherente y de conjunto: desde pistas para los exámenes de conducir hasta escuelas de sordomudos, desde parques de atracciones hasta museos, desde terrenos deportivos hasta vertederos de basuras... Todo cabía.", "<strong>La construcción de viviendas públicas</strong>", "Una de las utilidades que el Ayuntamiento franquista encontró a la montaña de Montjuïc fue la de solar de diversos grupos de viviendas de promoción pública, de los que se hicieron en la ciudad en los años sesenta para dar alojamiento a los inmigrantes que seguían llegando a la ciudad y para quienes la iniciativa privada no tenía interés en construir.", "El primero de estos grupos ya se había formado en los años de la exposición junto al paseo de la Zona Franca, que entonces era un camino arbolado que conducía al hipódromo de Can Tunis. Se levantó uno de los cuatro grupos de casas baratas que la dictadura de Primo de Rivera construyó en Barcelona. Recibió el nombre de Eduardo Aunós, ministro de Trabajo, Comercio e Industria en el momento en que se formó el conjunto.", "Los grupos siguientes se hicieron en el Polvorí y en Can Clos los días del Congreso Eucarístico. En un mes se levantaron en Can Clos 192 viviendas de 30 metros cuadrados. Allí trasladaron a los chabolistas que estaban en la zona de la Diagonal situada al límite del término municipal, ya que este lugar fue urbanizado entonces para situar el altar principal de los oficios solemnes del congreso. En el Polvorí, con 44 bloques levantados por el Patronato Municipal de la Vivienda, se instalaron, también, chabolistas procedentes de otras zonas, aunque nueve se reservaron para policías.", "<strong>La urbanización de nuevos espacios</strong>", "En 1966, el Patronato construyó otro polígono en la montaña: el de la Vinya, con 288 viviendas junto a la vía de los Ferrocarriles Catalanes. Esta línea ferroviaria era un ramal que se había construido en 1926 desde la estación de la Magòria hasta el puerto, a través de Montjuïc, para transportar la potasa de las minas del Bages a los barcos de mercancías. Se clausuró después de unas fuertes protestas en 1977, y ahora ya no queda ningún rastro de las vías.", "Además, en el lado de la Mare de Déu de Port, hay otros conjuntos de viviendas para obreros, promovidos por empresas: la colonia Bausili, cerca de las casas baratas; la colonia Santiveri; las casas de la SEAT, que se empezaron a construir en 1953; y otros grupos que han ido quedando diluidos dentro de las edificaciones modernas del paseo de la Zona Franca, completamente transformado.", "En el lado de la Gran Vía se ha ido desarrollando, con vida propia, el barrio de la Font de la Guatlla-Magòria, con la calle de la Font Florida como eje central, y la escuela municipal Pau Vila, promovida en tiempos del alcalde Socías como nexo de unión con los barrios del lado de Port.", "La elección de Barcelona como sede de los Juegos Olímpicos de 1992 introdujo un nuevo elemento que abrió las puertas a un nuevo e importante capítulo de la historia de este sector de la ciudad de Barcelona. También, en los últimos años, han tenido lugar las importantes labores de articulación, reurbanización, rehabilitación de viviendas, nuevos equipamientos, creación de zonas verdes, etcétera."], "vibe": "Del cementerio judío medieval a los fuegos artificiales olímpicos: la montaña que lo ha visto todo."}, "ca": {"name": "Sants-Montjuïc", "sub": "", "desc": ["La muntanya de Montjuïc és la caixa forta on es guarda la història de Barcelona. Poques ciutats tenen un accident geogràfic tan característic i amb tants secrets arrapats a la pedra i tants esdeveniments viscuts. Els arqueòlegs ja van trobar restes abundants d'una pedrera-taller epipaleolítica d'uns 10.000 anys d'antiguitat; és el testimoni més antic de presència humana a la ciutat de Barcelona. A la falda de Montjuïc han anat creixent diversos nuclis de població que han arribat a formar una unitat física, actualment organitzada en el districte de Sants-Montjuïc.", "Sants era un petit veïnat agrícola que existia com a mínim des del segle XI i que es va transformar en un gran poble industrial. Els tallers on s'estampaven les peces de roba amb els dibuixos anomenats indianes. El creixement industrial no es va aturar i aviat grans fàbriques tèxtils van fer companyia a la multitud de petits tallers: el Vapor Vell (Sants), l’Espanya Industrial (Hostafrancs), Can Batlló (la Bordeta). Això va fer que aquests barris, que tenien un creixement demogràfic molt ràpid provocat sobretot per la immigració i amb una classe obrera predominant, esdevinguessin llocs d’història agitada i de formació de moltes societats populars, bona part de les quals encara existeixen.", "<strong>La negociació entre Barcelona i Sants</strong>", "L’any 1839, Barcelona havia fet un canvi de terrenys amb el municipi de Sants. La Ciutat Comtal cedia al seu veí una part de la zona marítima a canvi d’establir, a la riera de Magòria, el límit pel sud-est. Així, va passar a pertànyer a Barcelona el territori on tot seguit es va començar a urbanitzar el barri d’Hostafrancs, que va prendre el nom d’un hostal fundat per Joan Corrades, i batejat amb el topònim del poble lleidatà d’on procedia. Malgrat que ja pertanyia a Barcelona quan es va redactar el Pla d’Eixample, Hostafrancs no hi va ser inclòs i va tenir el seu propi desenvolupament urbanístic diferenciat.", "El 1883 l’Ajuntament de Sants va agregar el poble a Barcelona, però aquest acord municipal va ser anul·lat pel Govern l’any següent. Finalment, el 1897, Sants es va annexionar definitivament a Barcelona, per reial decret, al mateix temps que Sant Martí, Sant Andreu, les Corts, Gràcia i Sant Gervasi.", "El Poble-sec va ser, de fet, el primer Eixample de Barcelona, anterior al que va projectar Ildefons Cerdà. Les muralles de Barcelona es van enderrocar el 1854 i el Pla d’Eixample es va aprovar cinc anys més tard, però els propietaris van trigar encara uns anys a edificar, per les reticències contra el projecte de Cerdà. Aquell va ser l’origen del Poble-sec.", "<strong>Fora del pla Cerdà</strong>", "Com els d’Hostafrancs, els terrenys situats a la banda de la falda de Montjuïc més propera al mar no quedaven inclosos en el Pla d’Eixample ni estaven, per tant, subjectes a limitacions urbanístiques. Els propietaris, amb bon ull, van començar a parcel·lar-los segons la seva conveniència, a partir del 1858, i a edificar cases senzilles per a obrers. Van néixer, així, els barris de la França Xica, Santa Madrona i les Hortes de Sant Bertran, després agrupats sota el nom genèric de Poble-sec. Era un sector que quedava molt a prop de l’antic recinte emmurallat de la ciutat i tenia, així, tots els avantatges i un únic inconvenient: els forts pendents.", "Fins al 1887 l’Ajuntament no va decidir intervenir-hi. Va convocar un concurs de projectes d’urbanització que havia d’assumir, lògicament, el que ja hi havia construït. El va redactar Josep Amargós, que el va enllestir el 1894. Va copiar el sistema de xamfrans ideat per Cerdà, a escala reduïda, i va deixar establerta la trama urbana actual del Poble-sec, des del mar fins a la plaça d’Espanya.", "<strong>La urbanització del Paral·lel</strong>", "El Paral·lel, que és actualment el límit del districte amb el barri vell i la part baixa de l’Eixample, es va urbanitzar poc després de l’Exposició Universal del 1888. El seu nom prové d’una taverna oberta el 1894, els amos de la qual, per batejar-la, van seguir el consell del seu amic l’astrònom Comas i Solà, partint del fet que el traçat del carrer té exactament la mateixa orientació que els paral·lels terrestres i coincideix amb el que passa per Barcelona, situat a 41º 20’ de latitud nord. Tot seguit, aquella àmplia avinguda es va convertir en un barri alegre, ple de teatres i cafès.", "El 1892 es va obrir el Teatre Espanyol, al mateix local, transformat, que ara ocupa la Sala Barts. El 1898 es va instal·lar a l'avinguda el Café Sevilla, ja desaparegut, i el 1903, el Teatre Condal. El 1901 se li va sumar el Nou; el 1903, l’Apolo; el 1907, el Còmic; el 1916, el Victòria i el Molino. Raquel Meller, que va debutar el 1911 a l’Arnau, va ser la figura indiscutible de les sales d’espectacles del Paral·lel durant molts anys. Aquella tradició, inaugurada quan s’acabava un segle i en començava un altre, s’ha mantingut, amb entrebancs, fins als nostres dies.", "<strong>La Zona Franca, territori duaner</strong>", "El nom de la Marina, abans coneguda com a Zona Franca, prové del fet que, en començar el segle XX, el Foment del Treball Nacional va demanar al Govern la creació, al delta del Llobregat, d’una gran zona industrial on es poguessin elaborar, amb exempcions fiscals importants, matèries primeres catalanes destinades a l’exportació. Això és, precisament, una zona franca: un territori que disposa d’instal·lacions portuàries i que és considerat, des del punt de vista duaner, com a territori estranger, encara que depengui de l’Estat on estigui situat. Només s’hi autoritzen construccions industrials i comercials, però no residencials.", "Mai no va ser concedit aquest privilegi a Barcelona. Es van arribar a expropiar els terrenys, durant la dictadura de Primo de Rivera, després de segregar-los de l’Hospitalet i annexionar-los a Barcelona, però no s’hi va fer res per causa dels plets amb els propietaris expropiats i de l’evolució històrica posterior del país. El 1965, quan ja feia deu anys que s’hi havia instal·lat la SEAT, una llei va decidir que els terrenys expropiats no servirien com a zona franca, sinó com a polígon industrial per a la mitjana i gran indústria, i també per a l’ampliació del port. Tres anys més tard es va aprovar el pla parcial de 714 hectàrees, a partir del qual han sorgit aquells carrers inhòspits i sense nom.", "<strong>Montjuïc, un espai de lleure</strong>", "De sempre hi havia hagut tradició d’anar a Montjuïc a passar estones de lleure. Les ermites sempre han estat lloc de romiatge i aquestes excursions solen acabar amb una fontada. A les ermites se’ls van afegir els berenadors, sempre a prop de les fonts. S’hi anava el diumenge i hi havia ball a l’aire lliure. La nit de Sant Joan, sobretot, es convertien en el lloc preferit de les revetlles perquè a Montjuïc hi creixia la berbena i aquell era el dia ideal per agafar-ne un pom de flors i oferir-lo a la xicota. La font del Gat va donar peu a una de les cançons catalanes més populars.", "El tràfec de les pedreres convivia amb indrets tranquils, amb prats i boscos de pins on els lerrouxistes feien els seus aplecs al començament del segle. Aquest paradís va deixar de ser-ho quan uns financers barcelonins molt lligats a les naixents companyies productores i distribuïdores d’electricitat van posar-hi els ulls per convertir-lo en el millor aparador publicitari dels seus interessos.", "<strong>La importància de la llum</strong>", "Francesc Cambó era l’advocat de Sofina, una societat financera vinculada a l’AEG, que va tenir una intervenció decisiva en tot el procés d’electrificació a Catalunya. Joan Pich i Pon era el líder del partit radical a Barcelona. Quan els radicals manaven a l’Ajuntament, es va fer la concessió municipal a l’AEG per a l’enllumenat públic de la ciutat, després d’un viatge que va fer Lerroux expressament a Barcelona per entrevistar-se amb els representants d’aquesta empresa.", "Cambó i Pich i Pon tenien capacitat per influir en les decisions municipals de la segona dècada del segle. Eren els regidors més destacats dels seus respectius partits i van ser triats el 1913 per organitzar una exposició d’indústries elèctriques que promocionés el consum d’aquella naixent forma d’energia. L’Ajuntament va assumir plenament el projecte i va triar la muntanya de Montjuïc com a marc de l’exposició, que havia de fer-se el 1917. Un reial decret va autoritzar l’Ajuntament a expropiar els terrenys, declarats d’utilitat pública. Es van encarregar projectes d’urbanització a alguns dels arquitectes més importants del moment —Puig i Cadafalch, Domènech i Montaner, Enric Sagnier i August Font, entre altres— i van començar les obres amb molta empenta.", "La guerra europea va aconsellar ajornar l’exposició, ja que difícilment hi participarien les empreses estrangeres, però les obres no es van aturar, pensant que podrien servir per a altres exposicions. El mateix dia que Primo de Rivera va donar el cop d’estat, el 1923, se n’hi va inaugurar una de mobiliari i, sis anys després, amb les obres d’urbanització acabades, s’hi feia l’Exposició Internacional. La llum, tal com havia estat la intenció inicial, hi ocupava un lloc molt important, amb els raigs del Palau Nacional, la font màgica de Buïgas, la torre de la plaça de l’Univers i els fanals art déco de l’avinguda de Maria Cristina. La muntanya va quedar configurada tal com és ara, des de la plaça d’Espanya fins a Miramar.", "<strong>Montjuïc, després de l'Exposició: 3 elements clau</strong>", "A Montjuïc, després de l’Exposició del 1929, hi han passat moltes coses. La primera, que molts dels emigrants que va atraure es van allotjar en barraques darrere de l’estadi i, perquè no es veiessin durant l’Exposició, s'hi va fer un mur. Aquell nucli va anar creixent a la postguerra fins a formar una veritable ciutat que arribava a les tanques del cementiri. A mitjan anys seixanta, que és quan van arribar al moment de màxima densitat, aquesta ciutat de barraques tenia una població d’uns 35.000 habitants i ocupava una superfície de 30 hectàrees. Va ser-hi fins al començament dels anys setanta.", "La segona, que durant la Guerra Civil Espanyola i un cop acabada va entrar en un procés de degradació creixent, del qual no es va començar a recuperar fins que es va decidir celebrar a Barcelona el Congrés Eucarístic Internacional del 1952, un esdeveniment de gran importància política —era el primer signe visible de la fi de l’aïllament diplomàtic del règim franquista— i d’impacte en l’urbanisme de la ciutat, comparable a les dues exposicions i als Jocs Olímpics.", "La tercera, que un cop recuperades les instal·lacions de l’Exposició i represa la Fira de Mostres, Montjuïc va servir per posar-hi tot el que no cabia en un altre lloc, sense una visió coherent i de conjunt: des de pistes per als exàmens de conduir fins a escoles de sordmuts, des de parcs d’atraccions fins a museus, des de terrenys esportius fins a abocadors d’escombraries, tot hi cabia.", "<strong>La construcció d'habitatges públics</strong>", "Una de les utilitats que l’Ajuntament franquista va trobar a la muntanya de Montjuïc va ser la de solar de diversos grups d’habitatges de promoció pública, dels que es van fer a la ciutat els anys seixanta per donar allotjament als immigrants que continuaven arribant a la ciutat i per als quals la iniciativa privada no tenia interès a construir.", "El primer d’aquest grups ja s’havia format els anys de l’Exposició al costat del passeig de la Zona Franca, que aleshores era un camí arbrat que conduïa a l’hipòdrom de Can Tunis. S’hi va aixecar un dels quatre grups de cases barates que la dictadura de Primo de Rivera va construir a Barcelona. Va rebre el nom d’Eduardo Aunós, ministre del Treball, el Comerç i la Indústria en el moment que es va fer el grup.", "Els grups següents es van fer al Polvorí i a Can Clos els dies del Congrés Eucarístic. En un mes es van aixecar a Can Clos 192 habitatges de 30 metres quadrats. Hi van portar els barraquistes que eren a la zona de la Diagonal situada al límit del terme municipal, ja que aquest indret va ser urbanitzat aleshores per posar-hi l’altar principal dels oficis solemnes del Congrés. Al Polvorí, amb 44 blocs aixecats pel Patronat Municipal de l’Habitatge, s’hi van instal·lar, també, barraquistes procedents d’altres zones, encara que nou es van reservar per a policies.", "<strong>La urbanització de nous espais</strong>", "El 1966, el Patronat va construir un altre polígon a la muntanya: el de la Vinya, amb 288 habitatges al costat de la via dels Ferrocarrils Catalans. Aquesta línia ferroviària era un ramal dels Ferrocarrils Catalans que s’havia construït el 1926 des de l’estació de la Magòria fins al port, a través de Montjuïc, per portar la potassa de les mines del Bages fins als vaixells de transport. Es va clausurar després d’unes fortes protestes de l’any 1977, i ara ja no queda cap rastre de les vies.", "A més, a la banda de la Mare de Déu de Port, hi ha altres grups d’habitatges per a obrers, promoguts per empreses: la colònia Bausili, prop de les cases barates, la colònia Santiveri, les cases de la SEAT, que es van començar a construir el 1953, i altres grups que han anat quedant diluïts dins les edificacions modernes del passeig de la Zona Franca, completament transformat.", "A la banda de la Gran Via s’ha anat desenvolupant, amb vida pròpia, el barri de la Font de la Guatlla - Magòria, amb el carrer de la Font Florida com a eix central, i l’escola municipal Pau Vila, promoguda en el temps de l’alcalde Socías, com a nexe d’unió amb els barris de la banda de Port.", "L’elecció de Barcelona com a seu dels Jocs Olímpics del 1992 va introduir un nou element que va obrir les portes a un nou i important capítol de la història d’aquest sector de la ciutat de Barcelona. També, els darrers anys, ha tingut lloc la tasca important d’articulació, reurbanització, rehabilitació d’habitatges, nous equipaments, creació de zones verdes, etcètera."], "vibe": "Del cementiri jueu medieval als focs artificials olímpics: la muntanya que ho ha vist tot."}, "ru": {"name": "Сантс-Монжуик", "sub": "", "desc": ["Гора Монжуик — это сейф, в котором хранится история Барселоны. Мало какие города обладают столь характерным природным ориентиром, с таким множеством тайн, скрытых в камне, и таким числом пережитых событий. Археологи уже обнаружили здесь обильные следы эпипалеолитической каменоломни-мастерской возрастом около 10 000 лет — это самое древнее свидетельство присутствия человека на территории Барселоны. У подножия Монжуика постепенно выросли различные населённые пункты, которые в итоге образовали единое физическое целое, ныне организованное в район Сантс-Монжуик.", "Сантс был небольшим сельскохозяйственным поселением, существовавшим по меньшей мере с XI века, которое превратилось в крупный промышленный посёлок. Здесь работали мастерские, где на ткани набивали рисунки, называемые «индианас». Промышленный рост не останавливался, и вскоре к множеству мелких мастерских добавились крупные текстильные фабрики: Вапор-Вель (Сантс), Эспанья-Индустриаль (Остафранкс), Кан-Батльо (ла-Бордета). Из-за этого данные кварталы, переживавшие очень быстрый демографический рост главным образом за счёт иммиграции и с преобладанием рабочего класса, превратились в места бурной истории и формирования множества народных обществ, многие из которых существуют до сих пор.", "<strong>Переговоры между Барселоной и Сантсом</strong>", "В 1839 году Барселона произвела обмен земель с муниципалитетом Сантс. Город-графство уступил соседу часть приморской зоны в обмен на установление границы по юго-востоку вдоль русла Магория. Таким образом, Барселоне отошла территория, на которой сразу же началась застройка квартала Остафранкс, получившего название от постоялого двора, основанного Жуаном Коррадесом и названного в честь лейридского городка, откуда он был родом. Хотя Остафранкс уже принадлежал Барселоне на момент составления Плана расширения, в него он включён не был и получил собственное, отдельное градостроительное развитие.", "В 1883 году муниципалитет Сантс присоединил посёлок к Барселоне, но это муниципальное решение было отменено правительством на следующий год. Наконец, в 1897 году Сантс окончательно вошёл в состав Барселоны по королевскому указу, одновременно с Сант-Марти, Сант-Андреу, Лес-Кортс, Грасией и Сант-Жервази.", "Побле-Сек стал фактически первым расширением Барселоны, предшествовавшим тому, что спроектировал Ильдефонс Серда. Городские стены Барселоны были снесены в 1854 году, а План расширения утверждён пятью годами позже, однако владельцы земли потратили ещё несколько лет на застройку из-за недоверия к проекту Серда. Так возник Побле-Сек.", "<strong>За пределами плана Серда</strong>", "Как и земли Остафранкса, участки, расположенные на склоне Монжуика ближе к морю, не были включены в План расширения и, следовательно, не подпадали под градостроительные ограничения. Владельцы, проявив здравый смысл, начали с 1858 года делить их по своему усмотрению и строить простые дома для рабочих. Так родились кварталы Франса-Шика, Санта-Мадрона и Ортес-де-Сант-Бертран, впоследствии объединённые под общим названием Побле-Сек. Это был сектор, расположенный совсем рядом со старым обнесённым стенами городом, и потому обладавший всеми преимуществами и лишь одним недостатком — крутыми склонами.", "Только к 1887 году муниципалитет решил вмешаться. Был объявлен конкурс градостроительных проектов, который, разумеется, должен был учитывать уже построенное. Жузеп Амаргос, которому было поручено его разработать, завершил проект в 1894 году. Он скопировал в уменьшенном масштабе систему срезанных углов (шафланов), придуманную Сер
