s de la propera Barcelona, encara encerclada per muralles.", "<strong>L’impacte de la Revolució Industrial</strong>", "El ritme pausat de la vida rural va començar a canviar a mitjan segle XIX com a conseqüència de la Revolució Industrial, que va afectar Barcelona i els pobles de la rodalia. L’augment de la població, la revolució dels transports o les noves exigències de la industrialització van incidir tímidament a Nou Barris i en van posar en marxa una transformació del paisatge lenta però ja imparable. L’augment de la població al municipi de Sant Andreu i la consolidació de les idees higienistes van fer que el 1839 es traslladés el vell cementiri parroquial a l’actual barri de Porta. Aquesta actuació va facilitar que, prop del cementiri, comencessin a ubicar-s’hi petites indústries farineres i de fusteria, així com a bastir-s’hi algunes cases.", "Aquest primer impuls d'urbanització a Porta va continuar amb la construcció, l’any 1855, de la línia ferroviària de Barcelona a Saragossa, i amb la instal·lació, el 1880, dels Tallers del Ferrocarril del Nord a l’actual zona de Can Dragó.", "D’altra banda, les creixents necessitats d’aigua dels habitants i de les noves indústries del pla de Barcelona van afavorir la construcció, entre el 1871 i el 1881, de dos aqüeductes que travessaven el territori de Nou Barris, alguns trams dels quals encara es conserven  a Ciutat Meridiana, Torre Baró i Can Carreras.", "També a la zona de Vilapicina es va iniciar tímidament la industrialització, ja que s’hi van instal·lar manufactures dedicades a la producció de teixits, d’adobs, de sabó, de maons, de productes químics… i fins i tot d’electricitat, per a la tracció dels tramvies de la línia de Barcelona a Horta, a les actuals cotxeres del passeig de Borbó.", "Aquest modestíssim procés d'industrialització, sobretot si el comparem amb les proporcions que assolia el mateix procés a la resta d’indrets del pla de Barcelona, va coincidir amb la iniciativa urbana més important del segle XIX a Nou Barris: la urbanització del passeig de Santa Eulàlia, actualment de Fabra i Puig.", "El passeig va ser aprovat l’any 1875 per l’Ajuntament de Sant Andreu i, des de la dècada dels vuitanta, es va convertir en l’eix vertebrador d’una mena de petit Eixample que va dinamitzar l’activitat constructiva als barris de Vilapicina i Porta.", "L’any 1889, a l’actual Guineueta, s’hi inaugurava l’Hospital Mental de la Santa Creu, dirigit pel doctor Emili Pi i Molist, un dels pioners en el tractament de les malalties mentals a Espanya. L’imponent edifici es va construir seguint un “proyecto médico razonado”, on es recollien les tècniques hospitalàries  més modernes del moment.", "La instal·lació del sanatori segueix la lògica de la industrialització que desplaça a la perifèria, i en aquest cas a Nou Barris, algunes de les grans infraestructures o equipaments generals de la ciutat, per exemple, els tallers del ferrocarril, el sanatori mental i, més endavant, l’estació elevadora d’aigües de Montcada o les torres d’electricitat d’alta tensió.", "A la darreria del segle XIX, la població de Nou Barris es podia estimar en uns 1.700 habitants, majoritàriament pagesos, però amb una  incidència progressiva dels jornalers ocupats en les manufactures locals o en les indústries cada cop més nombroses de Sant Andreu.", "Poques coses sabem de les inquietuds socials i culturals d’aquesta població, però són il·lustratius alguns fets dels quals tenim constància per exemple, les demandes que fan els veïns de Santa Eulàlia a l’Ajuntament de Sant Andreu l’any 1874 perquè instal·li al barri una escola de noies, o bé la fundació, el 1887, de la Societat d’Obrers i Auxiliars L’Estrella, situada al carrer de Porta i dedicada a activitats recreatives i familiars i a l’ajuda mútua entre els associats en cas de mort o malaltia.", "El nou segle es va iniciar a Nou Barris amb una proposta de ciutat jardí que havia de desenvolupar-se en un paratge d’una qualitat natural excepcional: l’antiga heretat de Torre Baró i Vallbona, propietat de la família Sivatte des del 1873.", "Seguint corrents urbanistes i higienistes de gran prestigi internacional que van inspirar  iniciatives urbanes de característiques similars a Barcelona, com ara la de l’avinguda del Tibidabo o la del Park Güell, l’any 1904 es va crear la Compañía de Urbanización de las Alturas del N. E. de Horta.", "L’operació immobiliària relacionada amb la ciutat jardí no va prosperar, malgrat que la companyia va construir la carretera que uneix Horta amb el turó de les Roquetes i va iniciar el bastiment de l’edifici d'aspecte medieval, que havia de tenir funcions d’hotel i que avui coneixem com el Castell de Torre Baró. Com a testimoni d’aquest projecte es conserven algunes torres d’estiueig aixecades a la zona entre els anys 1915 i 1936.", "<strong>Els inicis de la urbanització</strong>", "A partir del 1917, i a l'empara dels guanys que va reportar la neutralitat d’Espanya a la Primera Guerra Mundial, es produeix, a la ciutat, un nou fenomen urbà consistent en l’aparició, al pla de Barcelona, d’unes noves perifèries urbanes integrades per una població bàsicament obrera i amb una alta proporció d’immigrants.", "En aquestes circumstàncies, i fins l’any 1936, Nou Barris es va convertir en el suburbi que va experimentar el creixement més dinàmic de Barcelona, ja que en el seu territori es va aixecar la desena part de tota la nova edificació que es va fer a la perifèria de la ciutat.", "A més, als terrenys de Can Peguera, es van construir més de cinc-cents habitatges integrants del polígon Ramon Albó, un dels quatre grups de cases barates aixecats a la ciutat l’any 1929 pel Patronat de l’Habitatge.", "En aquest període, les barriades de les Roquetes, Verdum, Charlot, la Prosperitat, la Guineueta i Can Borràs van sorgir pràcticament del no-res. Una prova indirecta d’aquesta febre constructora és la creació, l’any 1925, de l’entitat Defensa de los Intereses de la Propiedad Urbana de las Afueras de San Andrés, que avui coneixem com l’Associació de Propietaris de les Roquetes.", "Com es pot deduir, l’augment de la població va ser important, i l’any 1930, en què Barcelona va assolir el mític milió d’habitants, Nou Barris ja en tenia 17.000. Com a trets generals podem dir que aquesta població era relativament jove, amb una notable presència d’immigrants i un gran nombre d’infants.", "La incidència de l’analfabetisme era gran, i resultava més palès entre les dones. La major part de la població activa s’autoclassificava com a jornalera, i la presència de comerciants, propietaris i professionals liberals era escassíssima.", "La vida social a Nou Barris s’organitzava al voltant de societats culturals, esportives i recreatives de tota mena, com van ser el Casinet de Vilapicina, continuador de la societat L’Estrella, el desaparegut Ateneu Familiar Artístic i Cultural, creat a Verdum I’any 1927, o l’encara vigent cor de L’ldeal d’en Clavé, fundat el 1930. En el terreny esportiu cal citar els veterans equips de futbol La Montañesa i Les Roquetes, creats els anys 1927 i 1929, respectivament.", "També existien algunes seus de partits polítics, com el de la Unió Monàrquica, situada a l’actual via Júlia, i sembla que al llarg de l’època republicana se n’hi van establir d’altres. Cal dir que a les eleccions generals del febrer del 1936, a Nou Barris va guanyar àmpliament el Front Popular.", "<strong>El model urbà del règim franquista</strong>", "L’acabament de la Guerra Civil amb la victòria de les tropes franquistes sobre el règim democràtic de la Segona República va donar pas a una dictadura militar basada en la repressió de la població i en l’absència de les llibertats polítiques, sindicals i nacionals.", "Les dures condicions econòmiques derivades de la immediata postguerra, unides a la necessitat imperiosa d’habitatge i al ferri control polític exercit sobre la població, van donar lloc al barraquisme i a l’autoconstrucció, una forma de creixement urbà fins llavors desconeguda a Nou Barris que descartava qualsevol demanda sobre els serveis i les condicions de vida.", "En aquest context i entre els anys 1941 i 1945, a Torre Baró i Vallbona el que va ser un projecte ambiciós de ciutat jardí es va transformar en una parcel·lació exhaustiva del territori, on es van aixecar uns habitatges molt precaris, mancats moltes vegades de serveis tan elementals com l’aigua, la llum o el clavegueram.", "L’autoconstrucció es va estendre els anys cinquanta a Roquetes, on l’estiu del 1964 els veïns van prendre la decisió de dotar el barri dels inexistents serveis d’aigua i clavegueram, i ells mateixos els construïen els diumenges. Aquesta iniciativa va ser coneguda més endavant com \"Urbanitzant en diumenge\".", "L’inici de la industrialització espanyola, produïda als anys cinquanta com a conseqüència de l’obertura de l’economia als mercats exteriors, va provocar un procés imparable d’emigració des de totes les contrades d’Espanya cap a les grans ciutats industrials, entre altres Barcelona, un fet que va suposar un agreujament de les condicions, ja difícils, de l’habitatge de la població.", "Aquesta pressió demogràfica va obligar determinats organismes oficials del règim franquista, com ara el Govern Civil, el Patronato Municipal de la Vivienda o el mateix sindicat vertical mitjançant la seva Obra Sindical del Hogar, a intervenir en la promoció d’habitatges a la ciutat.", "Per aquesta raó, entre els anys 1952 i 1955 es van aixecar a Nou Barris les anomenades Viviendas del Gobernador al barri de Verdum, el polígon de Torre Llobeta i els polígons de l’Obra Sindical del Hogar a Verdum i a la Trinitat Nova.", "A Nou Barris el transport públic era pràcticament inexistent en aquella època. Només hi havia, a partir del 1949, el baixador del tren a Torre Baró, i calia anar fins a Horta o a Sant Andreu per agafar els tramvies i els autobusos que connectaven amb la resta de la ciutat.", "Aquesta mancança obligava a fer desplaçaments llargs i penosos, tant per anar a la feina com per utilitzar els serveis públics, sempre escassos. És comprensible, doncs, que els veïns de Verdum, les Roquetes i la Prosperitat organitzessin una gran celebració quan, l’any 1953, van arribar a la via Júlia els autobusos de la companyia TAC.", "En un context de ràpid creixement econòmic i forta immigració que generaven un dèficit permanent d'habitatges a la ciutat, l’aprovació, l’any 1953, del Pla comarcal de Barcelona va resultar decisiva per al creixement de Barcelona i de Nou Barris en les dues dècades següents.", "El Pla comarcal, que va dissenyar les grans vies de circulació de la ciutat, incorporava també un instrument urbanístic de primer ordre –el Pla parcial– que en cada territori concret decidia els usos del sòl, les alineacions dels carrers i de les places, l’emplaçament dels espais lliures, dels serveis públics i dels edificis, així com el volum, la destinació i les condicions sanitàries i estètiques de les construccions.", "No cal dir que aquest instrument poderós va ser àmpliament utilitzat a Nou Barris, on els plans parcials van afectar dotze dels catorze barris que el componen, amb l’única excepció de Vilapicina i una petita part de Porta. També s’ha d’esmentar que a Nou Barris es va desenvolupar la cinquena part dels plans parcials que es van executar al conjunt de la ciutat", "En un primer moment aquests plans parcials van ser promoguts pels propietaris dels terrenys que encara restaven per urbanitzar a Nou Barris i, en molts casos, van servir per legalitzar les malifetes urbanístiques que s'havien fet en la dècada anterior.", "Però va ser als anys seixanta que, en el marc del desenvolupisme i de l’arribada de milers d’immigrants a Barcelona, els plans parcials es van transformar en veritables instruments per a l’especulació, ja que romanien en mans de grans companyies immobiliàries que a Nou Barris feien negocis multimilionaris.", "Sota aquest enfocament es van bastir els polígons d’habitatges de la Guineueta, de Porta, del Turó de la Peira, de Ciutat Meridiana, de Barcinova i Calinova a la Guineueta, l’últim dels quals va significar l’enderrocament d’una gran part de l’edifici de l’Hospital Mental. El darrer polígon, de promoció municipal i que es va inaugurar ja en època predemocràtica, va ser el de Canyelles, l’any 1974.", "La conseqüència lògica d’aquest urbanisme especulatiu del franquisme era el dèficit d’equipaments i de serveis públics que es feia palès a tota la ciutat, però amb més intensitat als barris perifèrics i de nova construcció. Només cal esmentar que l'any 1967, no tan llunyà, uns vells tramvies encara es van habilitar com a escoles a Nou Barris.", "Els anys seixanta i setanta, la manca d’escoles, d’ambulatoris, de zones esportives i d’esbarjo, així com un llarg etcètera, era proverbial a Nou Barris, atès que la prioritat de l’Administració municipal franquista no era, en absolut, augmentar el benestar de la població.", "La presa de consciència dels ciutadans davant aquestes mancances va fer néixer, l’any 1970, l’Associació de Veïns de Nou Barris, una entitat pionera en la lluita contra els plans parcials i per la millora de les condicions de vida i la consecució de les llibertats democràtiques.", "Els primers anys de la dècada dels setanta, a cada barri van sorgir associacions de veïns que van donar cabuda a lluitadors de tota mena: veïns conscienciats, cristians compromesos, lluitadors antifranquistes i membres dels partits polítics, aleshores il·legals. Tots plegats, homes i dones, joves i grans, van organitzar assemblees, manifestacions i tot tipus d’activitats que evidenciaven les insuficiències que calia millorar i les llibertats que s’havien d'assolir.", "Així, es van encetar vagues de lloguers per millorar els polígons de l’OSH, olimpíades populars per demanar equipaments esportius i per al jovent, caceres de rates per millorar la neteja, accions per paralitzar una planta asfàltica i convertir-la en ateneu, tancaments per aconseguir instituts, segrestos d’autobusos per pujar-los als barris, manifestacions per aconseguir semàfors, i un llarg etcètera que va ser l’expressió de la capacitat de lluita i d’enginy dels ciutadans de Nou Barris.", "<strong>El model de ciutat de l’època democràtica</strong>", "La consecució de la democràcia, l’any 1977, i les primeres eleccions municipals del 1979 van significar un gran canvi per als ciutadans i el paisatge de Nou Barris, ja que gran part de les reivindicacions dels veïns les van assolir els nous ajuntaments i institucions democràtiques, alhora que es van crear nous mecanismes d’intervenció i participació social.", "Des d’aquesta perspectiva, el nou urbanisme desenvolupat per l’Ajuntament democràtic als anys vuitanta s’ha plantejat com un urbanisme de sutura, és a dir, un urbanisme capaç de relligar el que havia estat separat i capaç d’intervenir en la regeneració i la dignificació dels espais marginalitzats per l’especulació franquista.", "Aquest urbanisme, que no s’entén sense la participació ciutadana i que també ha mostrat autèntics punts febles com ara fer viables els plans especials de reforma interior (PERI), ha donat molt bones mostres del seu saber fer a Nou Barris. En són exemples les places de Sóller, d’Àngel Pestaña o de Llucmajor, la via Júlia i l’avinguda de Rio de Janeiro, espais on també s’ha actuat des del punt de vista de la monumentalització de la perifèria, creant una autèntica galeria d’art al carrer de molt bona escultura internacional.", "Dit això, les intervencions urbanes que millor poden definir la nova forma de fer ciutat a Nou Barris són les que han aconseguit lligar la consecució d’un nou equipament social, cultural o esportiu amb la millora de la qualitat urbana del seu entorn.", "És des d’aquests equipaments, des d’aquesta millora de la qualitat de vida, des de l’esperit emprenedor dels ciutadans i des de la rica xarxa associativa de Nou Barris, que s’ha d’avançar en l’enfortiment de les relacions entre les persones, en la participació de tots en els afers de la comunitat i en l’aprofundiment en els valors democràtics, que són els que ens fan autènticament lliures.", "Fragment de la publicació Nou Barris", "GARCÍA SOLER, C. Centre d’Estudis i Documentació de Nou Barris. Nou Barris. Barcelona: Impremta Municipal, 1998. (Arxiu Municipal. Itineraris). ISBN: 84-7609-868-5."], "vibe": "Va néixer d'una lluita veïnal i encara porta aquella batalla al nom."}, "ru": {"name": "Ноу-Баррис", "sub": "«Девять кварталов»", "desc": ["История Ноу-Баррис — это история людей, которые здесь жили и работали, ковали свои мечты и надежды на будущее. Это также история социальных сил, которые в разных экономических и политических условиях воплощали свои инициативы и проекты в жизнь.", "Это историческое наследие оставило следы как в ландшафте Ноу-Баррис, так и в образе действий его жителей, сформировав коллективный образ, или черты идентичности, которые мы попытались истолковать.", "<strong>Ноу-Баррис: происхождение имени и района</strong>", "«Ноу-Баррис» («Девять кварталов») было названием журнала первой соседской ассоциации этой зоны в начале 1970-х годов. Это название, наполненное отголосками борьбы и гражданского самосознания, было принято как имя района, когда в 1984 году было проведено нынешнее деление города на десять районов.", "Прежде 800 гектаров, составляющих территорию Ноу-Баррис, входили в состав старинного прихода и независимого муниципалитета Сант-Андреу-де-Паломар, а после присоединения 1897 года — в состав района Сант-Андреу города Барселоны.", "<strong>Сельское прошлое</strong>", "Вплоть до первой трети XIX века ландшафт Ноу-Баррис был по сути сельским — черта, которую он разделял с остальными местностями и муниципалитетами, такими как Сант-Андреу, Сант-Марти, Лес-Кортс или Сантс, входившими в так называемую барселонскую равнину.", "Его пересечённую и гористую территорию — Ноу-Баррис тянется вдоль северо-восточного склона горного массива Кольсерола — пересекали многочисленные потоки, которые, за исключением тысячелетнего Рек-Комталь, исчезли в ходе последующей застройки.", "Некоторые из их названий до сих пор сохраняются в названиях близлежащих улиц: Торрент-де-Тисо, Торрент-де-Кан-Кампанья, Риера-де-Орта… Также здесь были источники, славившиеся своей водой; среди сохранившихся стоит упомянуть источник Мугера и источник Каньельес.", "Разбросанные по горному массиву усадьбы (масии) были центрами сельскохозяйственной деятельности, которая велась на этой территории. Большинство из них исчезло, хотя они дали название целым местностям или кварталам; например, Кан-Драго, Кан-Гарриго, Ка-ла-Пейра, Кан-Гинеуета, Торре-Баро и другие.", "Другие усадьбы сохранились до сих пор и продолжают вести определённую хозяйственную деятельность, как, например, Кан-Каррерас или Кан-Вердагер. Некоторые, наконец, используются как общественные учреждения, как, например, Ка-Н'Энсенья, Торре-Льобета или Кан-Басте.", "Древнейшим городским центром Ноу-Баррис был центр Санта-Эулалия-де-Вилаписина — небольшой квартал, сложившийся вокруг одноимённой романской часовни, существовавшей уже в X веке и перестроенной в 1782 году. Совсем рядом находится Ка-Н'Артес — старинный постоялый двор XVI века, построенный на дороге Сант-Ишкле, и Кан-Басте — усадьба конца XVIII века.", "Население усадеб и этого небольшого квартала к середине XIX века не превышало нескольких сотен жителей. Экономика основывалась на некоторых ремесленных занятиях и, прежде всего, на выращивании винограда и кормовых культур для скота. Также выращивались огородные культуры, предназначенные для потребления жителями близлежащей Барселоны, всё ещё окружённой крепостными стенами.", "<strong>Влияние промышленной революции</strong>", "Неспешный ритм сельской жизни начал меняться в середине XIX века под воздействием промышленной революции, затронувшей Барселону и окрестные посёлки. Рост населения, революция в транспорте и новые требования индустриализации робко, но всё же затронули Ноу-Баррис, запустив медленное, но уже необратимое преобразование ландшафта. Рост населения муниципалитета Сант-Андреу и утверждение гигиенистских идей привели к тому, что в 1839 году старое приходское кладбище было перенесено в нынешний квартал Порта. Это способствовало тому, что рядом с кладбищем начали размещаться небольшие мукомольные и столярные предприятия, а также строиться первые дома.", "Этот первый импульс застройки в Порте был усилен строительством в 1855 году железнодорожной линии Барселона — Сарагоса и открытием в 1880 году мастерских Северной железной дороги (Talleres del Ferrocarril del Norte) в нынешней зоне Кан-Драго.", "Кроме того, растущие потребности жителей и новых предприятий барселонской равнины в воде способствовали строительству между 1871 и 1881 годами двух акведуков, пересекавших территорию Ноу-Баррис, отдельные участки которых до сих пор сохраняются в Сьютат-Меридиана, Торре-Баро и Кан-Каррерас.", "Также в зоне Вилаписина робко началась индустриализация: здесь разместились предприятия по производству тканей, удобрений, мыла, кирпича, химической продукции... и даже электричества — для питания трамваев линии Барселона — Орта, размещавшихся в тогдашних трамвайных депо на променаде Борбон.", "Этот весьма скромный процесс индустриализации, особенно в сравнении с масштабами, которых тот же процесс достигал в остальных местах барселонской равнины, совпал с наиболее значимой городской инициативой XIX века в Ноу-Баррис — застройкой променада Санта-Эулалия, ныне носящего имя Фабра-и-Пуч.", "Променад был утверждён в 1875 году муниципалитетом Сант-Андреу и, начиная с 1880-х годов, превратился в стержневую ось своего рода небольшого «эшампле», оживившего строительную деятельность в кварталах Вилаписина и Порта.", "В 1889 году в нынешней Гинеуете открылась психиатрическая больница Санта-Крус, которую возглавлял доктор Эмили Пи-и-Молист, один из первопроходцев в лечении душевных болезней в Испании. Внушительное здание было построено согласно «обоснованному медицинскому проекту», в котором были учтены самые современные на тот момент больничные технологии.", "Размещение лечебницы следует той же логике индустриализации, которая вытесняла на периферию — в данном случае в Ноу-Баррис — некоторые крупные городские инфраструктуры или объекты общего пользования; например, железнодорожные мастерские, психиатрическую лечебницу, а позднее — водоподъёмную станцию Монткада или опоры высоковольтных линий электропередачи.", "К концу XIX века население Ноу-Баррис можно было оценить примерно в 1700 человек, в основном крестьян, однако с постепенно растущей долей подёнщиков, занятых на местных мануфактурах или на всё более многочисленных предприятиях Сант-Андреу.", "Мы мало знаем об общественных и культурных настроениях этого населения, но некоторые известные нам факты весьма показательны: например, требования жителей Санта-Эулалии, направленные муниципалитету Сант-Андреу в 1874 году, об открытии в квартале школы для девочек, или основание в 1887 году Общества рабочих и вспомогательных работников «Эстрелья» (Societat d'Obrers i Auxiliars L'Estrella), располагавшегося на улице Порта и занимавшегося досуговой и семейной деятельностью, а также взаимопомощью между членами в случае смерти или болезни.", "Новый век начался в Ноу-Баррис с предложения создать город-сад, который должен был развиваться в местности исключительного природного качества — на территории старинного поместья Торре-Баро-и-Вальбона, принадлежавшего семье Сиватте с 1873 года.", "Следуя престижным международным градостроительным и гигиенистским течениям, вдохновившим аналогичные городские инициативы в Барселоне, такие как застройка проспекта Тибидабо или парка Гуэль, в 1904 году была основана Компания застройки северо-восточных высот Орты (Compañía de Urbanización de las Alturas del N. E. de Horta).", "Строительный проект, связанный с городом-садом, не увенчался успехом, хотя компания построила дорогу, соединяющую Орту с холмом Рокетес, и начала строительство здания в средневековом стиле, которое должно было выполнять функции гостиницы и которое сегодня известно как замок Торре-Баро. Свидетельством этого проекта остаются несколько дачных «башен», возведённых в этой зоне между 1915 и 1936 годами.", "<strong>Начало застройки</strong>", "Начиная с 1917 года и благодаря доходам, которые принесла Испании её нейтралитет в Первой мировой войне, в городе возникло новое градостроительное явление — появление на барселонской равнине новых городских окраин, населённых в основном рабочим классом со значительной долей иммигрантов.", "В этих условиях, вплоть до 1936 года, Ноу-Баррис стал пригородом с наиболее динамичным ростом в Барселоне: на его территории было построено десять процентов от всей новой застройки, возведённой на периферии города.", "Кроме того, на землях Кан-Пегера было построено более пятисот единиц жилья, входящих в жилой массив Рамон-Альбо — одну из четырёх групп «дешёвых домов», построенных в городе в 1929 году Патронатом жилья.", "В этот период кварталы Рокетес, Вердум, Шарлот, ла-Проспеританьт, ла-Гинеуета и Кан-Боррас возникли практически на пустом месте. Косвенным свидетельством этой строительной лихорадки служит создание в 1925 году организации «Защита интересов городской собственности окраин Сан-Андрес» (Defensa de los Intereses de la Propiedad Urbana de las Afueras de San Andrés), которая сегодня известна как Ассоциация собственников Рокетес.", "Как можно предположить, рост населения был значительным, и в 1930 году, когда Барселона достигла легендарного миллиона жителей, в Ноу-Баррис уже проживало 17 000 человек. В общих чертах можно сказать, что это население было относительно молодым, с заметной долей иммигрантов и большим числом детей.", "Уровень неграмотности был высок и особенно заметен среди женщин. Большая часть трудоспособного населения относила себя к подёнщикам, а доля торговцев, собственников и представителей свободных профессий была крайне незначительной.", "Общественная жизнь в Ноу-Баррис строилась вокруг культурных, спортивных и досуговых обществ всех видов, таких как «Касинет-де-Вилаписина», продолжатель общества «Эстрелья», уже не существующий Семейный художественно-культурный атенеум, основанный в Вердуме в 1927 году, или до сих пор действующий хор «Идеаль-д'ен-Клаве», основанный в 1930 году. В спортивной сфере стоит упомянуть ветеранские футбольные команды «Ла-Монтаньеса» и «Лес-Рокетес», созданные соответственно в 1927 и 1929 годах.", "Существовали также отделения некоторых политических партий, например, «Монархического союза», располагавшееся на нынешней Виа-Жулия, и, по всей видимости, в республиканскую эпоху появились и другие. Стоит отметить, что на всеобщих выборах в феврале 1936 года в Ноу-Баррис с большим отрывом победил Народный фронт.", "<strong>Городская модель франкистского режима</strong>", "Окончание Гражданской войны победой франкистских войск над демократическим режимом Второй республики открыло путь военной диктатуре, основанной на репрессиях против населения и отсутствии политических, профсоюзных и национальных свобод.", "Тяжёлые экономические условия непосредственного послевоенного периода в сочетании с острой нехваткой жилья и жёстким политическим контролем над населением привели к распространению трущоб и самостроя — формы городского роста, дотоле неизвестной в Ноу-Баррис, при которой полностью игнорировались какие-либо требования к коммунальным услугам и условиям жизни.", "В этом контексте, между 1941 и 1945 годами, в Торре-Баро и Вальбоне амбициозный проект города-сада превратился в сплошное разбиение территории на участки, на которых возводилось крайне убогое жильё, зачастую лишённое таких элементарных удобств, как вода, электричество или канализация.", "Самострой распространился в 1950-е годы в Рокетес, где летом 1964 года жители решили самостоятельно обеспечить квартал отсутствовавшими коммунальными услугами — водопроводом и канализацией, — и сами строили их по воскресеньям. Эта инициатива позднее стала известна как «Застройка по воскресеньям».", "Начало индустриализации Испании, происходившей в 1950-е годы вследствие открытия экономики страны для внешних рынков, вызвало неудержимый процесс миграции из всех регионов Испании в крупные промышленные города, в том числе в Барселону, что усугубило и без того сложную ситуацию с жильём для населения.", "Это демографическое давление вынудило определённые государственные органы франкистского режима — такие как гражданское правительство, Муниципальный патронат жилья или сам Вертикальный профсоюз через своё Профсоюзное дело по жилью (Obra Sindical del Hogar) — заняться строительством жилья в городе.", "По этой причине между 1952 и 1955 годами в Ноу-Баррис были построены так называемые «дома губернатора» в квартале Вердум, жилой массив Торре-Льобета и массивы Профсоюзного дела по жилью в Вердуме и Тринитат-Нове.", "В те времена общественный транспорт в Ноу-Баррис практически отсутствовал. Единственным было, начиная с 1949 года, железнодорожная остановка в Торре-Баро; чтобы сесть на трамваи и автобусы, связывавшие с остальной частью города, приходилось направляться в Орту или Сант-Андреу.", "Эта нехватка вынуждала совершать долгие и утомительные поездки как для того, чтобы добраться до работы, так и для того, чтобы воспользоваться всегда скудными общественными службами. Поэтому понятно, что жители Вердума, Рокетес и ла-Проспериты устроили большой праздник, когда в 1953 году на Виа-Жулию наконец пришли автобусы компании TAC.", "В условиях быстрого экономического роста и активной иммиграции, порождавших постоянный дефицит жилья в городе, утверждение в 1953 году Регионального плана Барселоны (Plan comarcal) стало решающим фактором для роста как самой Барселоны, так и Ноу-Баррис в последующие два десятилетия.", "Региональный план, определивший основные транспортные магистрали города, включал в себя также важнейший градостроительный инструмент — частный план (Plan parcial), который для каждой конкретной территории определял использование земли, линии застройки улиц и площадей, размещение свободных пространств, общественных служб и зданий, а также объём, назначение и санитарные и эстетические условия строений.", "Разумеется, этот мощный инструмент широко применялся в Ноу-Баррис, где частные планы затронули двенадцать из четырнадцати кварталов, входящих в его состав, за единственным исключением Вилаписины и небольшой части Порты. Стоит также упомянуть, что в Ноу-Баррис была реализована пятая часть всех частных планов, осуществлённых в масштабах всего города.", "Поначалу эти частные планы продвигались владельцами земель, всё ещё остававшихся незастроенными в Ноу-Баррис, и во многих случаях служили для узаконивания градостроительных беспорядков предыдущего десятилетия.", "Но именно в 1960-е годы, в эпоху «девелопментализма» и прибытия тысяч иммигрантов в Барселону, частные планы превратились в настоящие инструменты спекуляции, поскольку находились в руках крупных строительных компаний, извлекавших в Ноу-Баррис многомиллионные прибыли.", "Именно в таком ключе были построены жилые массивы Гинеуета, Порта, Туро-де-ла-Пейра, Сьютат-Меридиана, а также Барсинова и Калинова в Гинеуете, последний из которых повлёк за собой снос значительной части здания психиатрической больницы. Последний массив, муниципальной постройки, открытый уже в предемократическую эпоху, — это массив Канельес, построенный в 1974 году.", "Логичным следствием этого спекулятивного франкистского градостроительства стал дефицит инфраструктуры и общественных услуг, ощущавшийся по всему городу, но особенно остро — в периферийных и новостроящихся кварталах. Стоит сказать, что ещё в 1967 году, не так уж давно, в Ноу-Баррис даже приспособили под школы старые трамвайные вагоны.", "В 1960-е и 1970-е годы нехватка школ, поликлиник, спортивных и досуговых зон и многого другого была в Ноу-Баррис общеизвестным явлением, поскольку приоритетом франкистской муниципальной администрации отнюдь не было повышение благосостояния населения.", "Осознание жителями этих недостатков привело к тому, что в 1970 году была создана Соседская ассоциация Ноу-Баррис — организация-первопроходец в борьбе против частных планов и за улучшение условий жизни и достижение демократических свобод.", "В первые годы 1970-х в каждом квартале возникли соседские ассоциации, объединившие борцов самого разного толка: сознательных жителей, ангажированных христиан, антифранкистских активистов и членов тогда ещё запрещённых политических партий. Все они, мужчины и женщины, молодые и пожилые, организовывали собрания, демонстрации и всевозможные акции, наглядно демонстрировавшие имевшиеся недостатки, которые необходимо было исправить, и свободы, которых предстояло добиться.", "Так, проводились забастовки квартиросъёмщиков за улучшение условий в массивах Профсоюзного дела по жилью, «народные олимпиады» с требованием спортивных сооружений и объектов для молодёжи, «охоты на крыс» ради улучшения санитарного состояния, акции против асфальтового завода с требованием превратить его в атенеум, сидячие забастовки ради открытия учебных заведений, захваты автобусов, чтобы направить их в кварталы, демонстрации с требованием установки светофоров, и многое другое, что стало выражением способности к борьбе и изобретательности жителей Ноу-Баррис.", "<strong>Городская модель демократической эпохи</strong>", "Установление демократии в 1977 году и первые муниципальные выборы 1979 года ознаменовали большие перемены для жителей и облика Ноу-Баррис, поскольку значительная часть требований, выдвигавшихся жителями, была удовлетворена новыми демократическими муниципалитетами и институтами, а также были созданы новые механизмы социального участия и вмешательства.", "С этой точки зрения новое градостроительство, развиваемое демократическим муниципалитетом в 1980-е годы, было задумано как «градостроительство сшивания» — то есть градостроительство, способное соединить то, что было разделено, и вмешаться в регенерацию и облагораживание пространств, маргинализированных франкистской спекуляцией.", "Это градостроительство, немыслимое без гражданского участия и также обнаружившее настоящие слабые места — например, в осуществимости специальных планов внутренней реформы (PERI), — тем не менее продемонстрировало в Ноу-Баррис подлинное мастерство. Примерами служат площади Сольер, Ангель-Пестанья или Люкмажор, Виа-Жулия и проспект Рио-де-Жанейро — пространства, где также велась работа по «монументализации» периферии, создав настоящую уличную художественную галерею с очень качественной международной скульптурой.", "Сказав это, стоит отметить, что городские вмешательства, наилучшим образом определяющие новый подход к градостроительству в Ноу-Баррис, — это те, которым удалось связать создание нового социального, культурного или спортивного объекта с улучшением качества городской среды вокруг него.", "Эти объекты, повышение качества жизни, предпринимательский дух жителей и богатая сеть общественных объединений Ноу-Баррис представляют собой отправную точку, от которой нужно двигаться дальше — к укреплению связей между людьми, к участию всех в делах местного сообщества и к более глубокому усвоению демократических ценностей, которые и делают нас по-настоящему свободными.", "Фрагмент издания «Ноу-Баррис»", "Гарсия Солер, К. Центр исследований и документации Ноу-Баррис. Nou Barris Barcelona: Муниципальная типография, 1998. (Муниципальный архив. Серия «Маршруты»). ISBN: 84-7609-868-5."], "vibe": "Родился из соседской борьбы — и до сих пор носит эту борьбу в своём имени."}, "historia_url": "https://ajuntament.barcelona.cat/noubarris/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/noubarris/es/el-distrito-y-sus-barrios"}, "d9": {"num": 9, "color": "#7FA89C", "web1": "http://www.bcn.cat/santandreu", "src": "https://ajuntament.barcelona.cat/santandreu/ca/el-districte-i-els-seus-barris/sant-andreu-de-palomar/historia-de-sant-andreu-de-palomar", "ipa_ca": "sant an-DREH-oo", "ipa_es": "sahn ahn-DREHS", "landmarks": [["La Casa Bloc", "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/puntos-de-interes/la-casa-bloc-casa-bloc-99400287924", {"es": "vivienda social racionalista de los años 30", "ca": "habitatge social racionalista dels anys 30", "ru": "рационалистское соцжильё 1930-х"}], ["Fabra i Coats - Fàbrica de Creació", "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/puntos-de-interes/fabra-i-coats-fabrica-de-creacio-99400193035", {"es": "antigua fábrica textil, hoy centro cultural", "ca": "antiga fàbrica tèxtil, avui centre cultural", "ru": "бывшая текстильная фабрика, теперь культурный центр"}], ["Can Fabra", "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/puntos-de-interes/can-fabra-99400595905", {"es": "parte del complejo Fabra i Coats", "ca": "part del complex Fabra i Coats", "ru": "часть комплекса Фабра-и-Коатс"}], ["Parroquia de Sant Pacià - Mosaico de Gaudí", "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/puntos-de-interes/parroquia-de-sant-pacia-mosaico-de-gaudi-92086004870", {"es": "iglesia con mosaico de estilo gaudiniano", "ca": "església amb mosaic d'estil gaudinià", "ru": "церковь с мозаикой в духе Гауди"}], ["El barrio del Bon Pastor - Cases Baratas", "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/puntos-de-interes/el-barrio-del-bon-pastor-cases-baratas-99400387432", {"es": "barrio de casas baratas de 1929", "ca": "barri de cases barates de 1929", "ru": "квартал «дешёвых домов» 1929 года"}]], "founding": {"es": "El distrito de Sant Andreu, de origen agrícola, evolución industrial y mucha tradición comercial, se transforma a gran velocidad con la llegada del tren de alta velocidad a la nueva estación de la Sagrera. Lo forman los barrios de la Sagrera, el Bon Pastor, la Trinitat Vella, Baró de Viver, el Congrés i els Indians, Navas y Sant Andreu de Palomar, el núcleo más antiguo, con más de mil años de historia.", "ca": "El districte de Sant Andreu, d'origen agrícola, evolució industrial i molta tradició comercial, es transforma a gran velocitat amb l'arribada del tren d'alta velocitat a la nova estació de la Sagrera. El formen els barris de la Sagrera, el Bon Pastor, la Trinitat Vella, Baró de Viver, el Congrés i els Indians, Navas i Sant Andreu de Palomar, el nucli més antic, amb més de mil anys d'història.", "ru": "Район Сант-Андреу, изначально сельскохозяйственный, затем промышленный и всегда сохранявший торговые традиции, стремительно меняется с приходом высокоскоростной железной дороги на новую станцию ла-Сагрера. Он включает кварталы ла-Сагрера, эль-Бон-Пастор, ла-Тринитат-Велья, Баро-де-Вивер, эль-Конгрес-и-элс-Индианс, Навас и Сант-Андреу-де-Паломар — древнейшее ядро района с более чем тысячелетней историей."}, "es": {"name": "San Andrés", "sub": "", "desc": ["El término o parroquia de Sant Andreu se extendía por todo el norte y noreste del llano de Barcelona, desde la muralla de la ciudad hasta el margen del río Besòs. Desde finales del siglo X y principios del siglo XI encontramos Sant Andreu como una parroquia dotada de jurisdicción.", "La transformación de la antigua iglesia de Santa Maria de les Arenes —Santa Maria del Mar— en parroquia a mediados del siglo XI quitó a Sant Andreu de Palomar todo el territorio situado al sur de la Riera de Horta, de la travesía al mar. Sant Adrià, en el siglo XII, le segregó la marina.", "En 1310 se definieron los límites del huerto y viñedo de la ciudad de Barcelona. En este territorio se incluyen las parroquias de Barcelona y las foráneas de Sant Martí de Provençals, Sant Vicenç de Sarrià y Santa Maria de Sants.", "En 1716, con el Decreto de Nueva Planta, los poblados del llano situados fuera de las murallas de Barcelona se independizaron administrativamente y mantuvieron, solamente, la sujeción religiosa correspondiente. Es en ese momento cuando estos pueblos empiezan a tener ayuntamientos propios.", "En 1811, el Gobierno general de Cataluña divide el Principado en corregimientos. El subcorregimiento de Barcelona se formó con cantones, de los cuales correspondían a la ciudad los de Llevant, Ponent, Migdia y Tramuntana.", "En 1845, por una ley orgánica, se unificó la constitución administrativa de los municipios del Estado. En 1847 es cuando encontramos la figura de los alcaldes de barrio como representantes del alcalde de la ciudad.", "A partir de 1854 empezaron a derribarse las murallas de Barcelona y crecieron los primeros ensanches de la ciudad. En 1878, la ciudad de Barcelona tenía 10 distritos y 53 barrios.", "Hacia 1880, el municipio de Sant Andreu estaba dividido en cinco distritos o barrios, que eran el barrio del Besòs, Mercadal, Sant Pacià, Estadella y Roquetes.", "El Ayuntamiento de Barcelona, antes de la agregación definitiva de los pueblos del llano, ya había solicitado en otras ocasiones su anexión a la ciudad. La primera vez fue en 1879 y la segunda, en 1885, hasta que se consiguió el 20 de abril de 1897.", "El 22 de marzo de 1949 la ciudad se dividió en doce distritos; Sant Andreu fue el distrito IX. Esta división perduraría casi sin modificaciones hasta la nueva reestructuración de 1984.", "A partir de la Ley especial del municipio de Barcelona de 1960, se encomendó a las juntas municipales de distrito la relación entre los órganos superiores de gestión municipal y los ciudadanos.", "En 1979 se produjo la división del distrito IX en dos, con la segregación de los barrios de Canyelles, Torre Baró, Ciutat Meridiana, la Trinitat Nova, la Trinitat Vella, Vallbona, Porta, la Guineueta, Torre Llobeta, el Congrés, la Prosperitat, Verdum, las Roquetes y Ramon Albó, que crearon el distrito IX norte, mientras que quedaron como IX sur los barrios de Sant Andreu, la Sagrera, Navas, el Bon Pastor y Baró de Viver.", "En 1984, se aprobó la nueva división territorial de la ciudad, que se estableció en diez distritos, con los nombres de Ciutat Vella, L’Eixample, Sants-Montjuïc, Les Corts, Sarrià-Sant Gervasi, Gràcia, Horta-Guinardó, Nou Barris, Sant Andreu y Sant Martí. A raíz de esta nueva división, el distrito de Sant Andreu recuperó los barrios de la Trinitat Vella y el Congrés.", "En 1986, el 5 de diciembre, el Consejo Plenario Municipal aprobó las normas reguladoras de la organización de los distritos y de la participación ciudadana, que daba fe de la voluntad descentralizadora del Ayuntamiento de Barcelona."], "vibe": "Pueblo industrial junto al río, con memoria obrera y trenes en el horizonte."}, "ca": {"name": "Sant Andreu", "sub": "", "desc": ["El terme o parròquia de Sant Andreu s’estenia per tot el nord i nord-est del pla de Barcelona, des de la muralla de la ciutat fins al marge del riu Besòs. Des del final del segle X i principi del segle XI trobem Sant Andreu com una parròquia dotada de jurisdicció.", "La transformació de l’antiga església de Santa Maria de les Arenes —Santa Maria del Mar— en parròquia a mitjan segle XI va prendre a Sant Andreu de Palomar tot el territori situat a migdia de la riera d’Horta, de la travessera al mar. Sant Adrià, al segle XII, li va segregar la marina.", "L’any 1310 es van definir els límits de l’hort i vinyet de la ciutat de Barcelona. En aquest territori s’inclouen les parròquies de Barcelona i les foranes de Sant Martí de Provençals, Sant Vicenç de Sarrià i Santa Maria de Sants.", "El 1716, amb el Decret de Nova Planta, els poblats del pla situats fora de les muralles de Barcelona es van independitzar administrativament i van mantenir, només, la subjecció religiosa corresponent. És a partir d’aquí que aquests pobles comencen a tenir ajuntaments propis.", "El 1811, el Govern general de Catalunya divideix el Principat en corregiments. El subcorregiment de Barcelona es va formar amb cantons, dels quals corresponien a la ciutat els de Llevant, Ponent, Migdia i Tramuntana.", "L’any 1845, per una llei orgànica, es va unificar la constitució administrativa dels municipis de l’Estat. I és el 1847 que trobem la figura dels alcaldes de barri com a representants de l’alcalde.", "A partir del 1854 comencen a enderrocar-se les muralles de Barcelona i creixen els primers eixamples de la ciutat. El 1878 la ciutat de Barcelona tenia 10 districtes i 53 barris.", "Cap al 1880 el municipi de Sant Andreu estava dividit en cinc districtes o barris, que eren el barri del Besòs, Mercadal, Sant Pacià, Estadella i Roquetes.", "L’Ajuntament de Barcelona, abans de l’agregació definitiva dels pobles del pla, ja havia sol·licitat en altres ocasions la seva agregació a la ciutat. La primera vegada va ser l’any 1879 i la segona, el 1885, fins que es va aconseguir el 20 d’abril de 1897.", "El 22 de març de 1949 la ciutat es va dividir en dotze districtes, Sant Andreu va ser el districte IX. Aquesta divisió perduraria quasi sense modificacions fins a la nova reestructuració del 1984.", "A partir de la Llei especial del municipi de Barcelona del 1960, s’encomana a les juntes municipals de districte la relació entre els òrgans superiors de gestió municipal i els ciutadans.", "L’any 1979 es va produir la divisió del districte IX en dos, amb la segregació dels barris de Canyelles, Torre Baró, Ciutat Meridiana, la Trinitat Nova, la Trinitat Vella, Vallbona, Porta, la Guineueta, Torre Llobeta, el Congrés, la Prosperitat, Verdum, les Roquetes i Ramon Albó, que van crear el districte IX Nord, mentre que van restar com a IX Sud els barris de Sant Andreu, la Sagrera, Navas, el Bon Pastor i Baró de Viver.", "L’any 1984, es va aprovar la nova divisió territorial de la ciutat, que es va establir en deu districtes, amb els noms de Ciutat Vella, l'Eixample, Sants-Montjuïc, les Corts, Sarrià - Sant Gervasi, Gràcia, Horta-Guinardó, Nou Barris, Sant Andreu i Sant Martí. Arran d’aquesta nova divisió, el districte de Sant Andreu recupera els barris de la Trinitat Vella i el Congrés.", "L’any 1986, el 5 de desembre, el Consell Plenari Municipal va aprovar les normes reguladores de l’organització dels districtes i de la participació ciutadana, que donava carta de fe de la voluntat descentralitzadora de l’Ajuntament de Barcelona."], "vibe": "Poble industrial vora el riu, amb memòria obrera i trens a l'horitzó."}, "ru": {"name": "Сант-Андреу", "sub": "", "desc": ["Территория, или приход, Сант-Андреу простиралась по всему северу и северо-востоку барселонской равнины, от городской крепостной стены до берега реки Бесос. С конца X — начала XI века Сант-Андреу известен как приход, наделённый собственной юрисдикцией.", "Преобразование старинной церкви Санта-Мария-де-лес-Аренес — «Санта-Мария-дель-Мар» — в приход в середине XI века лишило Сант-Андреу-де-Паломар всей территории, расположенной к югу от русла Орта, вплоть до пути к морю. Сант-Адриа, в свою очередь, в XII веке отделил от него прибрежную полосу.", "В 1310 году были определены границы огородов и виноградников города Барселоны. В эту территорию вошли приходы самой Барселоны, а также приходы за её пределами — Сант-Марти-де-Провенсалс, Сант-Висенс-де-Сарриа и Санта-Мария-де-Сантс.", "В 1716 году, с принятием Декрета Нуэва-Планта, посёлки равнины, находившиеся за пределами барселонских стен, обрели административную самостоятельность и сохранили лишь соответствующую церковную подчинённость. Именно тогда эти посёлки начали обзаводиться собственными муниципалитетами.", "В 1811 году генеральное правительство Каталонии разделило Княжество на округа (корреждименты). Барселонский субокруг был сформирован из кантонов, к городу относились кантоны Льевант, Понент, Мигдия и Трамунтана.", "В 1845 году органическим законом была унифицирована административная организация муниципалитетов страны. В 1847 году впервые появляется фигура квартальных алькальдов как представителей городского алькальда.", "Начиная с 1854 года стали сносить барселонские крепостные стены, и начали расти первые городские расширения. В 1878 году город Барселона насчитывал 10 округов и 53 квартала.", "Около 1880 года муниципалитет Сант-Андреу был разделён на пять округов, или кварталов: Бесос, Меркадаль, Сант-Пасия, Эстаделья и Рокетес.", "Муниципалитет Барселоны ещё до окончательного присоединения посёлков равнины неоднократно ходатайствовал об их присоединении к городу. Впервые это произошло в 1879 году, во второй раз — в 1885-м, и, наконец, присоединение было достигнуто 20 апреля 1897 года.", "22 марта 1949 года город был разделён на двенадцать округов; Сант-Андреу стал округом IX. Это деление сохранялось почти без изменений вплоть до новой реорганизации 1984 года.", "Согласно Особому закону о муниципалитете Барселоны 1960 года, окружным муниципальным комиссиям было поручено обеспечивать связь между высшими органами муниципального управления и гражданами.", "В 1979 году округ IX был разделён на два, с выделением кварталов Каньельес, Торре-Баро, Сьютат-Меридиана, Тринитат-Нова, Тринитат-Велья, Вальбона, Порта, Ла-Гинеуета, Торре-Льобета, Эль-Конгрес, Ла-Проспериты, Вердум, Лес-Рокетес и Рамон-Альбо, образовавших северный округ IX, в то время как южным округом IX остались кварталы Сант-Андреу, Ла-Сагрера, Навас, Эль-Бон-Пасторе и Баро-де-Вивер.", "В 1984 году было утверждено новое территориальное деление города — на десять округов, получивших названия Сьютат-Велья, Эшампле, Сантс-Монжуик, Лес-Кортс, Сарриа-Сант-Жервази, Грасия, Орта-Гинардо, Ноу-Баррис, Сант-Андреу и Сант-Марти. В результате этого нового деления округ Сант-Андреу вернул себе кварталы Тринитат-Велья и Эль-Конгрес.", "5 декабря 1986 года городской пленарный совет утвердил регламентирующие нормы организации округов и гражданского участия, что стало свидетельством децентрализаторской воли муниципалитета Барселоны."], "vibe": "Промышленный посёлок у реки, с рабочей памятью и поездами на горизонте."}, "historia_url": "https://ajuntament.barcelona.cat/santandreu/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/santandreu/es/el-distrito-y-sus-barrios"}, "d10": {"num": 10, "color": "#7A8FA0", "web1": "http://www.bcn.cat/santmarti", "src": "https://ajuntament.barcelona.cat/santmarti/ca/coneixeu-el-districte/historia", "ipa_ca": "sam muhr-TEE", "ipa_es": "sahn mahr-TEEN", "landmarks": [["La Torre Glòries", "https://ajuntament.barcelona.cat/santmarti/es/conozca-el-distrito/puntos-de-interes/la-torre-glories-99400077221", {"es": "rascacielos de Jean Nouvel", "ca": "gratacel de Jean Nouvel", "ru": "небоскрёб Жана Нувеля"}], ["La Farinera del Clot", "https://ajuntament.barcelona.cat/santmarti/es/conozca-el-distrito/puntos-de-interes/la-farinera-del-clot-99119115920", {"es": "antigua fábrica de harina, hoy centro cultural", "ca": "antiga fàbrica de farina, avui centre cultural", "ru": "бывшая мукомольная фабрика, теперь культурный центр"}], ["El cementerio del Poblenou", "https://ajuntament.barcelona.cat/santmarti/es/conozca-el-distrito/puntos-de-interes/el-cementerio-del-poblenou-92086009474", {"es": "cementerio neoclásico de 1819", "ca": "cementiri neoclàssic de 1819", "ru": "неоклассическое кладбище 1819 года"}], ["Can Felipa", "https://ajuntament.barcelona.cat/santmarti/es/conozca-el-distrito/puntos-de-interes/can-felipa-92086035490", {"es": "antigua fábrica textil, hoy centro cultural", "ca": "antiga fàbrica tèxtil, avui centre cultural", "ru": "бывшая текстильная фабрика, теперь культурный центр"}]], "founding": {"es": "El distrito de Sant Martí reúne en un mismo territorio el pasado y el futuro de Barcelona: diez barrios que comparten un largo pasado industrial. Los Juegos Olímpicos de 1992 transformaron especialmente el distrito, que se abrió al mar y cambió fábricas y naves industriales por viviendas, zonas verdes y el nuevo distrito tecnológico del 22@ en el antiguo Poblenou industrial.", "ca": "El districte de Sant Martí reuneix en un mateix territori el passat i el futur de Barcelona: deu barris que comparteixen un llarg passat industrial. Els Jocs Olímpics de 1992 van transformar especialment el districte, que es va obrir al mar i va canviar fàbriques i naus industrials per habitatges, zones verdes i el nou districte tecnològic del 22@ a l'antic Poblenou industrial.", "ru": "Район Сан-Марти объединяет на одной территории прошлое и будущее Барселоны: десять кварталов с общим долгим промышленным прошлым. Олимпийские игры 1992 года особенно преобразили район, который открылся к морю и заменил фабрики и промышленные склады жильём, зелёными зонами и новым технологическим кварталом 22@ на месте бывшего промышленного Побленоу."}, "es": {"name": "San Martín", "sub": "", "desc": ["Sant Martí era un territorio amplio casi deshabitado, situado a las afueras de la muralla de Barcelona. Se extendía desde el norte hasta el río Besòs y desde el mar hasta la montaña del Carmel. En aquellos tiempos, la línea de la costa estaba más atrasada, y gran parte de lo que ahora son los barrios del Poblenou y el Besòs o bien eran marismas insalubres, o bien pantanos y lagunas, que constituían una prolongación natural del delta del río Besòs. Es así como a lo largo de los siglos, con el retroceso de la línea de costa y la acción humana, su superficie aumentó hasta convertirse en uno de los pueblos más extensos del llano de Barcelona."], "vibe": "De campos romanos y fábricas humeantes a la fachada marítima olímpica de Barcelona."}, "ca": {"name": "Sant Martí", "sub": "", "desc": ["Sant Martí era un territori ampli gairebé deshabitat, situat als afores de la muralla de Barcelona. S'estenia des del nord fins al riu Besòs i des del mar fins a la muntanya del Carmel. En aquells temps, la línia de la costa estava més reculada, i gran part del que ara són els barris del Poblenou i el Besòs o bé eren maresmes insalubres o bé aiguamolls i llacunes, que constituïen un perllongament natural del delta del riu Besòs. És així com al llarg dels segles, amb el retrocés de la línia de costa i l'acció humana, la seva superfície va augmentar fins a esdevenir un dels pobles més extensos del pla de Barcelona."], "vibe": "De camps romans i fàbriques fumejants a la façana marítima olímpica de Barcelona."}, "ru": {"name": "Сант-Марти", "sub": "", "desc": ["Сант-Марти был обширной, почти незаселённой территорией, расположенной за пределами барселонской крепостной стены. Он простирался от севера до реки Бесос и от моря до горы Кармель. В те времена береговая линия проходила иначе, и значительная часть нынешних кварталов Побленоу и Бесос представляла собой либо нездоровые болотистые низины, либо трясины и лагуны, являвшиеся естественным продолжением дельты реки Бесос. Так, на протяжении веков, по мере отступления береговой линии и под воздействием деятельности человека, его площадь увеличивалась, пока он не превратился в один из самых обширных посёлков барселонской равнины."], "vibe": "От римских полей и дымящих фабрик до олимпийского морского фасада Барселоны."}, "historia_url": "https://ajuntament.barcelona.cat/santmarti/es/conozca-el-distrito/historia", "neighbourhoods_url": "https://ajuntament.barcelona.cat/santmarti/es/el-distrito-y-sus-barrios"}}, "barris": {"01": {"num": 1, "district": "d1", "name": "el Raval", "web1": "http://lameva.barcelona.cat/ciutatvella/ca/home/el-barri-del-raval", "ipa_es": "ah-rah-BAHL", "cx": 396.8, "cy": 535.3, "es": {"trans": "Arrabal", "etym": "Del árabe rabad, «arrabal, suburbio». El barrio creció fuera de la antigua muralla romana; históricamente muy multicultural."}, "ca": {"trans": "Raval", "etym": "De l'àrab rabad, «raval, suburbi». El barri va créixer fora l'antiga muralla romana; històricament molt multicultural."}, "ru": {"trans": "Раваль", "etym": "От араб. rabad — «предместье». Квартал вырос за пределами римской стены, исторически многонациональный."}, "ipa_ca": "uhl ruh-BAHL"}, "02": {"num": 2, "district": "d1", "name": "el Barri Gòtic", "web1": "http://lameva.barcelona.cat/ciutatvella/ca/home/el-barri-gotic", "ipa_es": "BAR-yoh GOH-tee-koh", "cx": 424.7, "cy": 544.6, "es": {"trans": "Barrio Gótico", "etym": "Llamado así por la arquitectura gótica que domina la zona, aunque parte del aspecto «medieval» es una reconstrucción de principios del s. XX. Núcleo histórico de Barcelona, sobre la antigua Barcino romana."}, "ca": {"trans": "Barri Gòtic", "etym": "Anomenat així per l'arquitectura gòtica que hi domina, tot i que part de l'aspecte «medieval» és una reconstrucció de principis del s. XX. Nucli històric de Barcelona, sobre l'antiga Barcino romana."}, "ru": {"trans": "Готический квартал", "etym": "Назван по готической архитектуре; часть «средневекового» облика — реконструкция начала XX века. Историческое ядро на месте римской Барсино."}, "ipa_ca": "uhl BAH-ree GAW-teek"}, "03": {"num": 3, "district": "d1", "name": "la Barceloneta", "web1": "http://lameva.barcelona.cat/ciutatvella/ca/home/el-barri-de-la-barceloneta", "ipa_es": "peh-KEH-nyah bar-theh-LOH-nah", "cx": 448.9, "cy": 592.1, "es": {"trans": "«Pequeña Barcelona»", "etym": "Diminutivo de «Barcelona». Construida a mediados del s. XVIII sobre terreno ganado al mar para los pescadores y vecinos del barrio de la Ribera, derribado al construirse la ciudadela militar."}, "ca": {"trans": "«Petita Barcelona»", "etym": "Diminutiu de «Barcelona». Construïda a mitjan s. XVIII sobre terreny guanyat al mar per als pescadors i veïns del barri de la Ribera, enderrocat en construir-se la ciutadella militar."}, "ru": {"trans": "«Маленькая Барселона»", "etym": "Уменьшительное от «Barcelona». Построена в XVIII веке на намывной земле для жителей квартала Рибера, снесённого под крепость."}, "ipa_ca": "luh bar-suh-loo-NEH-tuh"}, "04": {"num": 4, "district": "d1", "name": "Sant Pere, Santa Caterina i la Ribera", "web1": "http://lameva.barcelona.cat/ciutatvella/ca/home/el-barri-de-sant-pere-santa-caterina-i-la-ribera", "ipa_es": "san PEH-droh SAN-tah kah-tah-LEE-nah ee lah reh-BEH-rah", "cx": 461.5, "cy": 539.6, "es": {"trans": "San Pedro, Santa Catalina y la Ribera", "etym": "Por dos antiguas parroquias (San Pedro y Santa Catalina) más la Ribera — «la orilla» (en la Edad Media aquí pasaba la línea de costa y el puerto)."}, "ca": {"trans": "Sant Pere, Santa Caterina i la Ribera", "etym": "Per dues antigues parròquies (Sant Pere i Santa Caterina) més la Ribera — «la vora» (a l'edat mitjana hi passava la línia de costa i el port)."}, "ru": {"trans": "Сан-Пере, Санта-Катарина и Рибера", "etym": "По двум приходам (Св. Петра и Св. Екатерины) плюс la Ribera — «берег» (здесь была береговая линия и порт)."}, "ipa_ca": "SAHN PEH-ruh SAHN-tuh kuh-tuh-REE-nuh ee luh ree-BEH-ruh"}, "05": {"num": 5, "district": "d2", "name": "el Fort Pienc", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-fort-pienc", "ipa_es": null, "cx": 493.0, "cy": 494.0, "es": {"trans": "Fort Pienc", "etym": "Por un antiguo fuerte militar que hubo aquí (conocido coloquialmente también como Fort Pius). El origen exacto de «Pienc» no está del todo claro."}, "ca": {"trans": "el Fort Pienc", "etym": "Per un antic fort militar que hi havia (conegut col·loquialment també com a Fort Pius). L'origen exacte de «Pienc» no és del tot clar."}, "ru": {"trans": "Форт-Пьенк", "etym": "По стоявшему здесь военному форту (известен также как Fort Pius). Точное происхождение слова «Pienc» неясно."}, "ipa_ca": "uhl FOR pee-ENK"}, "06": {"num": 6, "district": "d2", "name": "la Sagrada Família", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-la-sagrada-familia", "ipa_es": "sah-GRAH-dah fah-MEEL-yah", "cx": 506.9, "cy": 450.2, "es": {"trans": "Sagrada Familia", "etym": "Por el célebre templo de Gaudí; antes de su construcción la zona se llamaba el Poblet, «el pueblecito»."}, "ca": {"trans": "la Sagrada Família", "etym": "Pel cèlebre temple de Gaudí; abans de la seva construcció la zona es deia el Poblet."}, "ru": {"trans": "Святое Семейство", "etym": "Назван по храму Гауди; до его строительства местность называлась el Poblet («деревенька»)."}, "ipa_ca": "luh suh-GRAH-duh fuh-MEE-lee-uh"}, "07": {"num": 7, "district": "d2", "name": "la Dreta de l'Eixample", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-la-dreta-de-leixample", "ipa_es": null, "cx": 442.6, "cy": 472.6, "es": {"trans": "El lado derecho del Eixample", "etym": "Respecto al eje central del distrito. Aquí se instaló la burguesía, que construyó las casas modernistas más célebres (Casa Batlló, La Pedrera)."}, "ca": {"trans": "La dreta de l'Eixample", "etym": "Respecte a l'eix central del districte. Hi va viure la burgesia, que hi va construir les cases modernistes més cèlebres (Casa Batlló, La Pedrera)."}, "ru": {"trans": "Правая часть Эшампле", "etym": "От условной центральной оси района. Здесь селилась буржуазия, строившая дома в стиле модернизма."}, "ipa_ca": "luh DREH-tuh duh lay-SHAHM-pluh"}, "08": {"num": 8, "district": "d2", "name": "l'Antiga Esquerra de l'Eixample", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-lantiga-esquerra-de-leixample", "ipa_es": "el an-TEE-gwoh LAH-doh eeth-KYEHR-doh", "cx": 389.3, "cy": 455.7, "es": {"trans": "El antiguo lado izquierdo", "etym": "Se urbanizó antes que la «nueva» parte izquierda, con la que formaba originalmente un solo barrio."}, "ca": {"trans": "L'antiga esquerra", "etym": "Es va urbanitzar abans que la part «nova», amb què formava originalment un sol barri."}, "ru": {"trans": "Старая левая часть", "etym": "Застраивалась раньше «новой левой части», изначально составляла с ней единый квартал."}, "ipa_ca": "lahn-TEE-guh uhs-KEH-ruh duh lay-SHAHM-pluh"}, "09": {"num": 9, "district": "d2", "name": "la Nova Esquerra de l'Eixample", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-la-nova-esquerra-de-leixample", "ipa_es": "el NWEH-boh LAH-doh eeth-KYEHR-doh", "cx": 349.5, "cy": 463.5, "es": {"trans": "El nuevo lado izquierdo", "etym": "Se urbanizó más tarde que la parte antigua — véase arriba."}, "ca": {"trans": "La nova esquerra", "etym": "Es va urbanitzar més tard que la part antiga — vegeu més amunt."}, "ru": {"trans": "Новая левая часть", "etym": "Застраивалась позже старой левой части — см. выше."}, "ipa_ca": "luh NAW-vuh uhs-KEH-ruh duh lay-SHAHM-pluh"}, "10": {"num": 10, "district": "d2", "name": "Sant Antoni", "web1": "http://lameva.barcelona.cat/eixample/ca/home/el-barri-de-sant-antoni", "ipa_es": "san an-TOH-nyoh", "cx": 363.4, "cy": 508.1, "es": {"trans": "San Antonio", "etym": "En honor a san Antonio. Barrio obrero, conocido por su mercado modernista homónimo."}, "ca": {"trans": "Sant Antoni", "etym": "En honor a sant Antoni. Barri obrer, conegut pel seu mercat modernista homònim."}, "ru": {"trans": "Сант-Антони", "etym": "В честь святого Антония. Рабочий квартал, известен одноимённым модернистским рынком."}, "ipa_ca": "SAHN uhn-TOH-nee"}, "11": {"num": 11, "district": "d3", "name": "el Poble Sec - Parc de Montjuïc", "web1": "http://lameva.barcelona.cat/sants-montjuic/ca/home/el-barri-del-poble-sec", "ipa_es": null, "cx": 314.2, "cy": 555.3, "es": {"trans": "«Pueblo seco» + parque de Montjuïc", "etym": "Poble Sec: en la zona no había fuentes naturales de agua. Montjuïc: etimología discutida — de Mons Jovis («monte de Júpiter», por un templo romano) o de Mons Judaicus («monte judío», por un cementerio medieval en la ladera)."}, "ca": {"trans": "«Poble sec» + parc de Montjuïc", "etym": "Poble Sec: a la zona no hi havia fonts naturals d'aigua. Montjuïc: etimologia discutida — de Mons Jovis o de Mons Judaicus, pel cementiri jueu medieval al vessant."}, "ru": {"trans": "«Сухая деревня» + парк Монжуик", "etym": "Poble Sec — здесь не было источников воды. Montjuïc — спорно: Mons Jovis («гора Юпитера») либо Mons Judaicus («еврейская гора»)."}, "ipa_ca": "uhl PAW-bluh SEK park duh moon-zhoo-EEK"}, "12": {"num": 12, "district": "d3", "name": "la Marina del Prat Vermell", "web1": "http://lameva.barcelona.cat/sants-montjuic/ca/home/el-barri-de-la-marina-del-prat-vermell", "ipa_es": "mah-REE-nah del PRAH-doh ROH-hoh", "cx": 169.9, "cy": 610.5, "es": {"trans": "Marina del Prado Rojo", "etym": "«Marina» — llanura junto al mar; Prat Vermell, «prado rojo»."}, "ca": {"trans": "Marina del Prat Vermell", "etym": "«Marina» — plana vora mar; Prat Vermell, «prat vermell»."}, "ru": {"trans": "Марина Красного луга", "etym": "«Марина» — приморская низменность; Prat Vermell — «красный луг»."}, "   const card = e.target.closest('.feed-card');
  if(card && !e.target.closest('a')) pickBarri(card.getAttribute('data-barri'));

function openBarriModal(code){
  const t = UI[currentLang];
  const b = DATA.barris[code];
  const bt = b[currentLang];
  const modalCardEl = document.getElementById('modalCard');
  modalCardEl.style.setProperty('--district-color', DATA.districts[b.district].color);
  modalCardEl.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">✕</button>
    <div class="modal-body">
      <span class="feed-num mono">${t.barriLabel} ${t.numPrefix}${b.num}</span>
      <div class="feed-title">${b.name}${b.ipa_ca ? ` <span class="ipa">(${b.ipa_ca})</span>` : ''}<span class="feed-orig">${b.es.trans}${b.ipa_es ? ` <span class="ipa">(${b.ipa_es})</span>` : ''} · <span class="feed-ru">${b.ru.trans}</span></span></div>
      <div class="section-h">${t.historiaLabel}</div>
      <p class="feed-text">${bt.etym}</p>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('modalCloseBtn').addEventListener('click', closeBarriModal);
}
function closeBarriModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
  if(e.target.id === 'modalBackdrop') closeBarriModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeBarriModal();
});
infoCard.addEventListener('mouseover', (e)=>{
  const card = e.target.closest('.feed-card');

infoCard.addEventListener('mouseout', (e)=>{

});

    : { ca: entity.ca.name, es: entity.es.name, ru: entity.ru.name };
}
function ipaForms(entity){
  return { ca: entity.ipa_ca || null, es: entity.ipa_es || null, ru: null };
}
function langStackHtml(forms, ipas){
  return LANG_ORDER.map(lang=>{
    const ipa = ipas[lang] ? ` <span class="ipa">(${ipas[lang]})</span>` : '';
    return `<div class="id-line"><span class="flag">${lang.toUpperCase()}</span>${forms[lang]}${ipa}</div>`;
  }).join('');
}

function barriListForDistrict(dk){
  return Object.keys(DATA.barris).filter(c=>DATA.barris[c].district===dk).sort((a,b)=>DATA.barris[a].num-DATA.barris[b].num);
}

function districtCentroid(dk){
  const codes = barriListForDistrict(dk);
  const sum = codes.reduce((acc,code)=>{
    const b = DATA.barris[code];
    acc.x += b.cx; acc.y += b.cy; return acc;
  }, {x:0, y:0});
  return { x: sum.x / codes.length, y: sum.y / codes.length };
}

function renderDistrictLabels(){
  const layer = document.getElementById('districtLabelLayer');
  let html = '';
  districtIds.forEach(dk=>{
    const d = DATA.districts[dk];
    const c = districtCentroid(dk);
    html += `<text class="district-label" data-district="${dk}" x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}">${d.ca.name}</text>`;
  });
  layer.innerHTML = html;
}

let expandedDistrict = null;
const chevronSvg = `<svg class="sb-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>`;

function renderSidebar(){
  let html = '';
  districtIds.forEach(dk=>{
    const d = DATA.districts[dk];
    const expanded = dk === expandedDistrict ? ' expanded' : '';
    html += `<div class="sb-district${expanded}" data-district-block="${dk}">
      <div class="sb-district-row" data-district="${dk}">
        ${chevronSvg}
        <span class="sb-num mono">${String(d.num).padStart(2,'0')}</span>
        <span class="sb-dname">${d[currentLang].name}</span>
        <span class="sb-swatch" style="background:${d.color}"></span>
      </div>
      <div class="sb-barris">`;
    barriListForDistrict(dk).forEach(code=>{
      const b = DATA.barris[code];
      const bf = nameForms(b, true);
      html += `<div class="sb-barri-row" data-barri="${code}">
        <span class="sb-num mono">${b.num}</span><span class="sb-bname">${bf[currentLang]}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  sidebarList.innerHTML = html;
}

function clearVisualState(){
  document.querySelectorAll('.district-shape.active').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.barri.selected').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.sb-district-row.active').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.sb-barri-row.active').forEach(el=>el.classList.remove('active'));
}

function clearPreview(){
  document.querySelectorAll('.barri.preview, .district-shape.preview').forEach(el=>el.classList.remove('preview'));
}
function previewDistrict(dk){
  clearPreview();
  document.querySelectorAll(`.barri[data-district="${dk}"]`).forEach(el=>el.classList.add('preview'));
  const shape = document.querySelector(`.district-shape[data-district="${dk}"]`);
  if(shape) shape.classList.add('preview');
}
function previewBarri(code){
  clearPreview();
  const el = document.querySelector(`.barri[data-barri-id="${code}"]`);
  if(el) el.classList.add('preview');
}

function renderEmptyState(){
  infoCard.innerHTML = `<div class="empty-state">${ICONS.compass}<p>${UI[currentLang].emptyText}</p></div>`;
}
function wikiLink(name){
  return `https://${WIKI_HOST[currentLang]}/w/index.php?search=${encodeURIComponent(name + ' Barcelona')}`;
}
function gmapsLink(name){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ', Barcelona')}`;
}
function tagLink(url, label){
  return `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
}

function duckLink(name){
  return `https://duckduckgo.com/?q=${encodeURIComponent(name + ' Barcelona')}`;
}
function landmarkSentence(landmarks){
  if(!landmarks || !landmarks.length) return '';
  const top = landmarks.slice(0,3).map(([name])=>`<a href="${duckLink(name)}" target="_blank" rel="noopener">${name}</a>`);
  const phrase = {
    es: n => n.length===3 ? ` Entre sus lugares emblemáticos destacan ${n[0]}, ${n[1]} y ${n[2]}.`
             : n.length===2 ? ` Entre sus lugares emblemáticos destacan ${n[0]} y ${n[1]}.`
             : ` Entre sus lugares emblemáticos destaca ${n[0]}.`,
    ca: n => n.length===3 ? ` Entre els llocs emblemàtics hi ha ${n[0]}, ${n[1]} i ${n[2]}.`
             : n.length===2 ? ` Entre els llocs emblemàtics hi ha ${n[0]} i ${n[1]}.`
             : ` Entre els llocs emblemàtics hi ha ${n[0]}.`,
    ru: n => n.length===3 ? ` Среди знаковых мест — ${n[0]}, ${n[1]} и ${n[2]}.`
             : n.length===2 ? ` Среди знаковых мест — ${n[0]} и ${n[1]}.`
             : ` Среди знаковых мест — ${n[0]}.`,
  };
  return phrase[currentLang](top);
}

function buildHistoriaHtml(paras){
  const headerRe = /^<strong>(.+)<\/strong>$/;
  let html = '';
  let inSection = false;
  paras.forEach(p=>{
    const m = p.match(headerRe);
    if(m){
      if(inSection) html += `</div></details>`;
      html += `<details class="hist-section"><summary>${m[1]}</summary><div class="hist-section-body">`;
      inSection = true;
    } else {
      html += `<p>${p}</p>`;
    }
  });
  if(inSection) html += `</div></details>`;
  return html;
}

function renderCard(){
  const t = UI[currentLang];
  if(!selectedDistrict && !selectedBarri){ renderEmptyState(); return; }
  const dk = selectedDistrict;
  const d = DATA.districts[dk];
  const barriCodes = barriListForDistrict(dk);
  const dForms = nameForms(d, false);
  const dIpas = ipaForms(d);

  const meetDistrictSection = (d.landmarks && d.landmarks.length) ? `
      <div class="section-h">${t.meetDistrictLabel}</div>
      <ul class="bullet-list">${d.landmarks.map(([lm,url,desc])=>`<li><a href="${url || wikiLink(lm)}" target="_blank" rel="noopener">${lm}</a>${desc && desc[currentLang] ? ` — ${desc[currentLang]}` : ''}</li>`).join('')}</ul>` : '';

  const dHistoriaRaw = d[currentLang].desc;
  const dHistoriaParas = Array.isArray(dHistoriaRaw) ? dHistoriaRaw : (dHistoriaRaw ? [dHistoriaRaw] : []);
  const dHistoriaHtml = buildHistoriaHtml(dHistoriaParas);

  const heroHtml = `
    <div class="hero-sticky">
      <span class="feed-num mono">${t.districtLabel} ${t.numPrefix}${d.num}</span>
      <div class="id-pair">${langStackHtml(dForms, dIpas)}</div>
    </div>
    <div class="hero">
      ${dHistoriaHtml}
      ${meetDistrictSection}
    </div>`;

  const cardsHtml = barriCodes.map(code=>{
    const b = DATA.barris[code];
    const bt = b[currentLang];
    const bf = nameForms(b, true);
    const selectedCls = (selectedBarri === code) ? ' selected' : '';
    return `
      <div class="feed-card${selectedCls}" data-barri="${code}">
        <button class="feed-expand" data-expand="${code}" title="${t.expandCardLabel}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <span class="feed-num mono">${t.barriLabel} ${t.numPrefix}${b.num}</span>
        <div class="feed-title">${b.name}${b.ipa_ca ? ` <span class="ipa">(${b.ipa_ca})</span>` : ''}<span class="feed-orig">${b.es.trans}${b.ipa_es ? ` <span class="ipa">(${b.ipa_es})</span>` : ''} · <span class="feed-ru">${b.ru.trans}</span></span></div>
        <p class="feed-text">${bt.etym}</p>
      </div>`;
  }).join('');

  infoCard.style.setProperty('--district-color', d.color);
  infoCard.innerHTML = heroHtml + `
    <div class="feed-head"><h4>${t.chooseBarriLabel}</h4></div>
    <div class="feed">${cardsHtml}</div>`;

  if(selectedBarri){
    const card = infoCard.querySelector(`.feed-card[data-barri="${selectedBarri}"]`);
    const stickyEl = infoCard.querySelector('.hero-sticky');
    if(card){
      const stickyH = stickyEl ? stickyEl.getBoundingClientRect().height : 0;
      const cardTop = card.offsetTop;
      const cardBottom = cardTop + card.offsetHeight;
      const viewTop = infoCard.scrollTop + stickyH;
      const viewBottom = infoCard.scrollTop + infoCard.clientHeight;
      if(cardTop < viewTop){
        infoCard.scrollTop = cardTop - stickyH - 12;
      } else if(cardBottom > viewBottom){
        infoCard.scrollTop = cardBottom - infoCard.clientHeight + 12;
      }
    }
  }
}

function applyVisual(){
  clearVisualState();
  if(selectedDistrict){
    const shape = document.querySelector(`.district-shape[data-district="${selectedDistrict}"]`);
    if(shape) shape.classList.add('active');
    document.querySelectorAll(`.sb-district-row[data-district="${selectedDistrict}"]`).forEach(el=>el.classList.add('active'));
  }
  const dot = document.getElementById('accentDot');
  if(selectedBarri){
    const el = document.querySelector(`.barri[data-barri-id="${selectedBarri}"]`);
    if(el) el.classList.add('selected');
    document.querySelectorAll(`.sb-barri-row[data-barri="${selectedBarri}"]`).forEach(el=>{
      el.classList.add('active');
      if(typeof el.scrollIntoView === 'function'){
        try { el.scrollIntoView({block:'nearest'}); } catch(_e) {}
      }
    });
    const b = DATA.barris[selectedBarri];
    dot.setAttribute('cx', b.cx); dot.setAttribute('cy', b.cy); dot.setAttribute('r','5.5');
    dot.classList.add('show');
  } else {
    dot.classList.remove('show'); dot.setAttribute('r','0');
  }
}

function pickDistrict(dk){
  selectedDistrict = dk; selectedBarri = null;
  renderSidebar(); applyVisual(); renderCard();
  infoCard.scrollTop = 0;
}
function pickBarri(code){
  selectedBarri = code;
  selectedDistrict = DATA.barris[code].district;
  expandedDistrict = selectedDistrict;
  renderSidebar(); applyVisual(); renderCard();
}
function resetAll(){
  selectedDistrict = null; selectedBarri = null;
  clearVisualState();
  const dot = document.getElementById('accentDot');
  dot.classList.remove('show'); dot.setAttribute('r','0');
  renderEmptyState();
}

document.getElementById('barriLayer').addEventListener('click', (e)=>{
  const el = e.target.closest('.barri');
  if(!el) return;
  pickBarri(el.getAttribute('data-barri-id'));
});
document.getElementById('barriLayer').addEventListener('mousemove', (e)=>{
  const el = e.target.closest('.barri');
  if(!el){ tooltip.classList.remove('show'); return; }
  const code = el.getAttribute('data-barri-id');
  const b = DATA.barris[code];
  tooltip.innerHTML = `<span class="tooltip-flag">CA</span>${b.num}. ${b.name}`;
  const rect = mapWrap.getBoundingClientRect();
  tooltip.style.left = (e.clientX - rect.left) + 'px';
  tooltip.style.top = (e.clientY - rect.top) + 'px';
  tooltip.classList.add('show');
});
document.getElementById('barriLayer').addEventListener('mouseleave', ()=> tooltip.classList.remove('show'));

document.getElementById('districtLabelLayer').addEventListener('click', (e)=>{
  const el = e.target.closest('.district-label');
  if(!el) return;
  pickDistrict(el.getAttribute('data-district'));
});
document.getElementById('districtLabelLayer').addEventListener('mouseover', (e)=>{
  const el = e.target.closest('.district-label');
  if(el){ el.classList.add('preview'); previewDistrict(el.getAttribute('data-district')); }
});
document.getElementById('districtLabelLayer').addEventListener('mouseout', (e)=>{
  const el = e.target.closest('.district-label');
  if(el){ el.classList.remove('preview'); clearPreview(); }
});

sidebar.addEventListener('click', (e)=>{
  const brow = e.target.closest('.sb-barri-row');
  if(brow){ pickBarri(brow.getAttribute('data-barri')); document.body.classList.remove('catalog-open'); return; }
  const drow = e.target.closest('.sb-district-row');
  if(drow){
    const dk = drow.getAttribute('data-district');
    expandedDistrict = (expandedDistrict === dk) ? null : dk;
    pickDistrict(dk);
    return;
  }
});
sidebar.addEventListener('mouseover', (e)=>{
  const brow = e.target.closest('.sb-barri-row');
  if(brow){ previewBarri(brow.getAttribute('data-barri')); return; }
  const drow = e.target.closest('.sb-district-row');
  if(drow){ previewDistrict(drow.getAttribute('data-district')); return; }
});
sidebar.addEventListener('mouseout', (e)=>{
  if(e.target.closest('.sb-barri-row') || e.target.closest('.sb-district-row')) clearPreview();
});

document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('btnCatalogToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('catalog-open');
});
document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
  document.body.classList.remove('catalog-open');
});

document.querySelectorAll('.langswitch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentLang = btn.getAttribute('data-lang');
    document.querySelectorAll('.langswitch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t = UI[currentLang];
    document.getElementById('pageTag').innerHTML = t.tag;
    document.getElementById('catalogLabel').textContent = t.catalogLabel;
    document.getElementById('sidebarTitle').textContent = t.tag.replace('· ','').replace(/^\w/, c=>c.toUpperCase());
    document.getElementById('resetLabel').textContent = t.reset;
    document.getElementById('footerLink').textContent = t.footer;
    document.documentElement.lang = currentLang;
    renderSidebar();
    applyVisual();
    if(selectedDistrict || selectedBarri) renderCard(); else renderEmptyState();
  });
});

renderSidebar();
renderDistrictLabels();
renderEmptyState();
</script>
</body>
</html>
